    name: Annotazione esito penale
    description: Scrive l'esito dell'udienza sull'impegno a calendario
    agent: registrazione-penale
    prompt: |
      ESITO: annota com'è andata sull'impegno già a calendario. Non spostare niente
      e non creare nessun impegno nuovo, nemmeno se l'udienza è stata rinviata: il
      rinvio lo registra la presa in carico, che parte da sola subito dopo.
      Data dell'udienza tenuta: {{dataUdienza}}
      Parti: {{parti}}
      Fascicolo o numero di ruolo: {{fascicolo}}
      Professionista: {{professionistaNome}}

      Esito: {{esito}}
      Nuova data (se rinviata): {{nuovaData}}
      Nuova ora (se indicata): {{nuovaOra}}
      Termini assegnati: {{terminiAssegnati}}
      Adempimenti o annotazioni: {{noteEsito}}

  # ------------------------------------------------------------------------------------------
  # La chiamata degli esiti, alle 18:30
  # ------------------------------------------------------------------------------------------
  # «Entro quella giornata dovrà comunicare l'esito dell'udienza» è la frase del cliente, e non è
  # esprimibile come soglia del processo: `maxLeadTimeMinutes` conta dall'arrivo del token, e una
  # designazione fatta in riunione arriva fino a sette giorni prima dell'udienza. Il motore non ha
  # eventi temporali — Start, End, Task, CallActivity e basta — quindi la scadenza vive qui: un
  # giro al giorno, nei giorni feriali, sugli impegni di OGGI.
  #
  # L'orario è dopo la chiusura delle udienze e prima di cena: chi non ha ancora scritto due righe
  # riceve il promemoria quando può ancora farlo.

  - key: chiamata-esiti-civile
    name: Chiamata esiti civile
    description: Ogni sera elenca le udienze di oggi di cui non è ancora stato comunicato l'esito
    agent: calendario-civile
    prompt: |
      Oggi è {{date}} (UTC). Finestra: le 00:00 e le 23:59 di OGGI, ora di Roma.

      Elenca gli impegni di oggi e dividili in due gruppi:
      1. ESITO COMUNICATO — le cui annotazioni contengono una riga che comincia
         con «ESITO:».
      2. ESITO MANCANTE — tutti gli altri, riportando per ciascuno data e ora,
         titolo, e il professionista designato se le annotazioni lo nominano
         (riga «Designato:»).
      Metti per primo il gruppo 2, che è quello che serve. Se è vuoto, dillo con
      una riga sola: sapere che sono stati raccontati tutti vale quanto l'elenco.
    trigger: scheduled
    schedule:
      cron: "30 18 * * 1-5"
      timeZone: Europe/Rome
    outputActions:
      - type: email
        recipients:
          - giuseppe.zileni@hevolus.it     # TODO: i referenti del civile
        subject: "{{taskName}} — {{date}}"
  - key: chiamata-esiti-penale
    name: Chiamata esiti penale
    description: Ogni sera elenca le udienze di oggi di cui non è ancora stato comunicato l'esito
    agent: calendario-penale
    prompt: |
      Oggi è {{date}} (UTC). Finestra: le 00:00 e le 23:59 di OGGI, ora di Roma.

      Elenca gli impegni di oggi e dividili in due gruppi:
      1. ESITO COMUNICATO — le cui annotazioni contengono una riga che comincia
         con «ESITO:».
      2. ESITO MANCANTE — tutti gli altri, riportando per ciascuno data e ora,
         titolo, e il professionista designato se le annotazioni lo nominano
         (riga «Designato:»).
      Metti per primo il gruppo 2, che è quello che serve. Se è vuoto, dillo con
      una riga sola: sapere che sono stati raccontati tutti vale quanto l'elenco.
    trigger: scheduled
    schedule:
      cron: "30 18 * * 1-5"
      timeZone: Europe/Rome
    outputActions:
      - type: email
        recipients:
          - giuseppe.zileni@hevolus.it     # TODO: i referenti del penale
        subject: "{{taskName}} — {{date}}"
  # ------------------------------------------------------------------------------------------
  # Il briefing, al lunedì mattina
  # ------------------------------------------------------------------------------------------
  # L'orario non è scelto a caso: lo Studio una riunione settimanale la fa già, e il briefing
  # serve se arriva prima, non dopo. Le soglie sui singoli passi del processo restano dove sono
  # — quelle avvisano che una COSA è ferma, questo dice che SETTIMANA è.

  - key: briefing-settimanale-civile
    name: Briefing settimanale civile
    description: Ogni lunedì mattina manda ai referenti il quadro delle udienze della settimana
    agent: calendario-civile
    prompt: |
      Oggi è {{date}} (UTC). Finestra: da oggi ai prossimi sette giorni.

      Restituisci il quadro delle udienze della settimana in ordine di data, e
      in fondo l'elenco di quelle le cui annotazioni non nominano nessun
      professionista.
    trigger: scheduled
    schedule:
      cron: "30 7 * * 1"
      timeZone: Europe/Rome
    outputActions:
      - type: email
        recipients:
          - giuseppe.zileni@hevolus.it     # TODO: i referenti del civile
        subject: "{{taskName}} — {{date}}"

  - key: briefing-settimanale-penale
    name: Briefing settimanale penale
    description: Ogni lunedì mattina manda ai referenti il quadro delle udienze della settimana
    agent: calendario-penale
    prompt: |
      Oggi è {{date}} (UTC). Finestra: da oggi ai prossimi sette giorni.

      Restituisci il quadro delle udienze della settimana in ordine di data, e
      in fondo l'elenco di quelle le cui annotazioni non nominano nessun
      professionista.
    trigger: scheduled
    schedule:
      cron: "30 7 * * 1"
      timeZone: Europe/Rome
    outputActions:
      - type: email
        recipients:
          - giuseppe.zileni@hevolus.it     # TODO: i referenti del penale
        subject: "{{taskName}} — {{date}}"

  # ------------------------------------------------------------------------------------------
  # La riconciliazione, al venerdì
  # ------------------------------------------------------------------------------------------
  # «Nessuna riconciliazione periodica tra carta e digitale» è una delle criticità che lo Studio
  # ha messo per iscritto nella propria procedura. Questo è il passo che la chiude, ed è l'unico
  # agent task del file che non lancia un agente ma un'orchestrazione.
  #
  # La finestra guarda anche indietro di proposito: un disallineamento nato la settimana scorsa
  # è ancora un disallineamento, e guardando solo avanti non lo si vedrebbe mai.

  - key: riconciliazione-settimanale-civile
    name: Riconciliazione settimanale civile
    description: Ogni venerdì confronta casella e calendario e manda ai referenti i disallineamenti
    orchestrator: riconciliazione-civile
    prompt: |
      Oggi è {{date}} (UTC). Finestra: dai sette giorni passati ai trenta giorni futuri.
    trigger: scheduled
    schedule:
      cron: "0 17 * * 5"
      timeZone: Europe/Rome
    outputActions:
      - type: email
        recipients:
          - giuseppe.zileni@hevolus.it     # TODO: i referenti del civile
        subject: "{{taskName}} — {{date}}"

  - key: riconciliazione-settimanale-penale
    name: Riconciliazione settimanale penale
    description: Ogni venerdì confronta casella e calendario e manda ai referenti i disallineamenti
    orchestrator: riconciliazione-penale
    prompt: |
      Oggi è {{date}} (UTC). Finestra: dai sette giorni passati ai trenta giorni futuri.
    trigger: scheduled
    schedule:
      cron: "0 17 * * 5"
      timeZone: Europe/Rome
    outputActions:
      - type: email
        recipients:
          - giuseppe.zileni@hevolus.it     # TODO: i referenti del penale
        subject: "{{taskName}} — {{date}}"

# --------------------------------------------------------------------------------------------
# Il processo
# --------------------------------------------------------------------------------------------

processes:
  - key: presa-in-carico-civile
    publish: true
    owners:
      - giuseppe.zileni@hevolus.it     # TODO: il responsabile del civile
    starterRoles:
      - referente-civile
    webhook:
      enabled: true               # per l'ingresso dalla casella E dalla chat
    spec:
      version: 1
      name: Presa in carico di una comunicazione (civile)
      description: >
        Dalla comunicazione ricevuta — mail di un avvocato, dettato in chat, avviso del
        tribunale — alla pratica giusta: udienza o scadenza sul calendario comune, rinvio
        spostato, attività al professionista, presa visione. Con verifica del referente,
        assegnazione tracciata e conferma.
      criticality: High
      dataSensitivity: Confidential

      activities:
        - id: start
          type: Start
          name: Comunicazione ricevuta
          form:
            - key: testoAvviso
              label: Testo della comunicazione
              type: textarea
              required: true
              description: Il testo come è arrivato — mail, dettato, avviso — senza riscriverlo
            - key: fonte
              label: Da dove arriva
              type: select
              required: true
              options: [mail, chat, cancelleria, riunione, altro]
            - key: materia
              label: Materia
              type: select
              required: true
              options: [Penale, Civile]
            - key: fascicolo
              label: Fascicolo
              type: text
              description: Riferimento interno del fascicolo, se noto
            - key: mittente
              label: Mittente
              type: text

        # La Sorveglianza chiama il webhook anche quando non trova niente, perché le output action
        # non hanno condizioni. L'istanza con «NESSUN AVVISO» si chiude qui.
        - id: nessun-avviso
          type: End
          name: Nessuna comunicazione da prendere in carico

        # Una parola — Udienza, Rinvio, Scadenza, Attività, Visione — proposta al referente, che la
        # conferma o la cambia nel passo dopo scegliendo `tipo`: è quella la variabile dei gateway.
        # Agente senza strumenti: torna in pochi secondi (#1000 non lo riguarda).
        - id: classifica
          type: Task
          name: Classifica la comunicazione
          performer: Automated
          agentTaskName: Classificazione comunicazione
          outputVariable: tipoProposto
          expectedDurationMinutes: 1
          maxLeadTimeMinutes: 30

        - id: estrai
          type: Task
          name: Estrai gli estremi
          performer: Automated
          agentTaskName: Estrazione avviso
          outputVariable: proposta
          expectedDurationMinutes: 2
          # Su un passo automatico la soglia non misura una persona lenta: segnala un'esecuzione che
          # non è tornata (issue #1000). Trenta minuti sono quindici volte la durata attesa.
          maxLeadTimeMinutes: 30

        - id: verifica
          type: Task
          name: Verifica del referente
          performer: HumanOnly
          roleName: Referente agenda civile
          expectedDurationMinutes: 10
          maxLeadTimeMinutes: 480        # mezza giornata lavorativa
          form:
            - key: proposta
              label: Estremi proposti
              type: textarea
              context: true
              description: Quello che l'assistente ha letto, da verificare sul testo
            - key: fonte
              label: Da dove arriva
              type: text
              context: true
            # La proposta del classificatore, in sola lettura; sotto, la scelta del referente. Due
            # chiavi diverse perché un campo modificabile non viene precompilato dal caseData: con
            # una chiave sola il select arrivava vuoto. È su `tipo` che il flusso si biforca.
            - key: tipoProposto
              label: Tipo proposto dall'assistente
              type: text
              context: true
            - key: tipo
              label: Di che si tratta
              type: select
              required: true
              options: [Udienza, Rinvio, Scadenza, Attività, Visione]
              description: >
                Udienza nuova, rinvio di una già fissata, scadenza con data scritta, attività da
                fare, o solo da prendere visione. Di norma è il tipo proposto qui sopra.
            - key: datiCompleti
              label: Estremi completi e corretti
              type: bool
            - key: dataUdienza
              label: Data (udienza, nuova udienza, o scadenza)
              type: date
            - key: oraUdienza
              label: Ora
              type: text
            - key: sede
              label: Sede e sezione
              type: text
            - key: tipoAdempimento
              label: Cosa va fatto
              type: text
              description: Udienza di comparizione, deposito memoria, notifica, chiamare il CTU…

        - id: chiarimenti
          type: Task
          name: Richiedi chiarimenti
          performer: HumanOnly
          roleName: Referente agenda civile
          expectedDurationMinutes: 15
          maxLeadTimeMinutes: 2880       # due giorni: è il passo che si dimentica più spesso
          form:
            - key: proposta
              label: Estremi proposti
              type: textarea
              context: true
            - key: richiestaInviata
              label: Richiesta di chiarimento inviata
              type: bool
              required: true
            - key: noteChiarimento
              label: A chi e cosa è stato chiesto
              type: textarea

        # --- Presa visione: c'è da leggere, non da registrare ---
        - id: visione
          type: Task
          name: Presa visione del referente
          performer: HumanOnly
          roleName: Referente agenda civile
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 1440
          form:
            - key: proposta
              label: Comunicazione
              type: textarea
              context: true
            - key: presaVisione
              label: Presa visione
              type: bool
              required: true
            - key: noteVisione
              label: Annotazioni
              type: textarea

        # --- Udienza nuova, scadenza, attività: si assegna a una persona ---
        - id: assegna
          type: Task
          name: Assegna al professionista
          performer: HumanOnly
          roleName: Referente agenda civile
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 1440
          form:
            - key: tipo
              label: Di che si tratta
              type: text
              context: true
            - key: dataUdienza
              label: Data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: professionista
              label: Professionista incaricato
              type: user
              required: true
              description: Riceverà il compito direttamente nella sua lista

        # Attività senza data: un compito alla persona, niente calendario.
        - id: compito-attivita
          type: Task
          name: Attività da fare
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: proposta
              label: Cosa va fatto
              type: textarea
              context: true
            - key: tipoAdempimento
              label: Attività
              type: text
              context: true
            - key: fatto
              label: Fatto
              type: bool
              required: true
            - key: noteAttivita
              label: Esito o annotazioni
              type: textarea

        - id: registra
          type: Task
          name: Registra sul calendario comune
          # Udienza nuova e scadenza: lo stesso agente, il tipo nel prompt. Sta PRIMA della
          # conferma del professionista perché la conferma serva anche a questo.
          performer: Automated
          agentTaskName: Registrazione udienza civile
          outputVariable: esitoRegistrazione
          expectedDurationMinutes: 2
          # Agente con server MCP dentro un processo: è esattamente il caso dell'issue #1000. Senza
          # soglia, una registrazione mai tornata lascerebbe l'udienza fuori dall'agenda in silenzio.
          maxLeadTimeMinutes: 30

        - id: conferma
          type: Task
          name: Conferma del professionista
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: tipo
              label: Di che si tratta
              type: text
              context: true
            - key: dataUdienza
              label: Data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: tipoAdempimento
              label: Cosa va fatto
              type: text
              context: true
            - key: proposta
              label: Estremi e altre attività menzionate
              type: textarea
              context: true
            - key: esitoRegistrazione
              label: Calendario comune
              type: textarea
              context: true
              description: >
                Cosa ha fatto l'assistente sul calendario. La prima riga dice tutto: REGISTRATO,
                GIÀ PRESENTE o NON REGISTRATO — in quest'ultimo caso NON è in agenda.
            - key: presaVisione
              label: Presa visione
              type: bool
              required: true
            - key: terminiDaPresidiare
              label: Termini da presidiare
              type: textarea
              description: I termini collegati, scritti dal professionista.

        # --- Rinvio: si sposta l'impegno che c'è, non se ne crea un altro ---
        - id: aggiorna
          type: Task
          name: Indica l'udienza da spostare
          performer: HumanOnly
          roleName: Referente agenda civile
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 480
          form:
            - key: dataUdienza
              label: Nuova data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: udienzaPrecedente
              label: Udienza da spostare
              type: text
              required: true
              description: Link all'evento a calendario, oppure numero di ruolo e data precedente
            - key: professionista
              label: Professionista che segue il fascicolo
              type: user
              required: true
              description: Riceverà l'avviso del rinvio nella sua lista

        - id: sposta
          type: Task
          name: Sposta l'udienza sul calendario comune
          performer: Automated
          agentTaskName: Spostamento udienza civile
          outputVariable: esitoSpostamento
          expectedDurationMinutes: 2
          maxLeadTimeMinutes: 30          # vedi «registra»: stesso agente, stesso rischio (#1000)

        - id: avvisa-rinvio
          type: Task
          name: Avviso del rinvio al professionista
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: dataUdienza
              label: Nuova data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: udienzaPrecedente
              label: Udienza spostata
              type: text
              context: true
            - key: proposta
              label: Estremi e altre attività menzionate
              type: textarea
              context: true
            - key: esitoSpostamento
              label: Calendario comune
              type: textarea
              context: true
              description: >
                SPOSTATO: l'impegno è sulla nuova data. NON REGISTRATO: l'impegno precedente non è
                stato trovato, e il calendario va sistemato a mano.
            - key: presaVisioneRinvio
              label: Presa visione del rinvio
              type: bool
              required: true
            - key: terminiDaPresidiare
              label: Termini da presidiare
              type: textarea
              description: >
                Sulla NUOVA data: un rinvio sposta anche i termini collegati, ed è il caso in cui
                è più facile dimenticarne uno.

        - id: fine
          type: End
          name: Pratica chiusa

      gateways:
        - id: filtro
          type: Exclusive
          name: C'è una comunicazione?
        - id: completezza
          type: Exclusive
          name: Estremi completi?
        - id: smista
          type: Exclusive
          name: Di che si tratta?
        - id: dopo-assegnazione
          type: Exclusive
          name: Va in calendario?

      # Le condizioni su `tipo` confrontano per stringa senza distinguere le maiuscole. Il flusso
      # senza condizione è il default, e in entrambi i gateway porta a un compito UMANO: da
      # «smista» all'assegnazione, da «dopo-assegnazione» all'attività. Un valore imprevisto del
      # classificatore finisce davanti a una persona, mai davanti all'agente che scrive in agenda.
      flows:
        - from: start
          to: filtro
        - from: filtro
          to: nessun-avviso
          condition: { var: testoAvviso, op: eq, value: NESSUN AVVISO }
          label: nessuna comunicazione
        - from: filtro
          to: classifica
          label: comunicazione
        - from: classifica
          to: estrai
        - from: estrai
          to: verifica
        - from: verifica
          to: completezza
        - from: completezza
          to: chiarimenti
          condition: { var: datiCompleti, op: eq, value: false }
          label: da chiarire
        - from: chiarimenti
          to: verifica
        - from: completezza
          to: smista
          label: completi
        - from: smista
          to: aggiorna
          condition: { var: tipo, op: eq, value: Rinvio }
          label: rinvio
        - from: smista
          to: visione
          condition: { var: tipo, op: eq, value: Visione }
          label: presa visione
        - from: smista
          to: assegna
          label: udienza, scadenza, attività
        - from: visione
          to: fine
        - from: assegna
          to: dopo-assegnazione
        # Le condizioni portano al calendario; il default è il compito a una persona. Così un
        # valore imprevisto del classificatore (un accento perso, una parola in più) finisce
        # davanti a qualcuno, non davanti all'agente che scrive in agenda.
        - from: dopo-assegnazione
          to: registra
          condition: { var: tipo, op: eq, value: Udienza }
          label: udienza
        - from: dopo-assegnazione
          to: registra
          condition: { var: tipo, op: eq, value: Scadenza }
          label: scadenza
        - from: dopo-assegnazione
          to: compito-attivita
          label: attività
        - from: compito-attivita
          to: fine
        - from: registra
          to: conferma
        - from: conferma
          to: fine
        - from: aggiorna
          to: sposta
        - from: sposta
          to: avvisa-rinvio
        - from: avvisa-rinvio
          to: fine

  - key: presa-in-carico-penale
    publish: true
    owners:
      - giuseppe.zileni@hevolus.it     # TODO: il responsabile del penale
    starterRoles:
      - referente-penale
    webhook:
      enabled: true               # per l'ingresso dalla casella E dalla chat
    spec:
      version: 1
      name: Presa in carico di una comunicazione (penale)
      description: >
