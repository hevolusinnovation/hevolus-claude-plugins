agentTasks:
  # Il primo passo automatico del processo, uguale per i tre ingressi: una parola.
  - key: classificazione
    name: Classificazione comunicazione
    description: Dice se la comunicazione è un'udienza, un rinvio, una scadenza, un'attività o una presa visione
    agent: classificatore
    prompt: |
      {{testoAvviso}}

  - key: estrazione-avviso
    name: Estrazione avviso
    description: Legge la comunicazione ricevuta e ne propone gli estremi
    agent: agenda
    prompt: |
      Estrai gli estremi dalla seguente comunicazione.
      Tipo: {{tipoProposto}}. Fonte: {{fonte}}. Materia: {{materia}}. Fascicolo: {{fascicolo}}.

      {{testoAvviso}}

  # Un passo automatico condiviso dai quattro processi: scrive la comunicazione di rinvio che
  # la CallActivity consegna alla presa in carico. Non ha strumenti e non decide niente —
  # riformatta campi che il professionista ha appena compilato.
  - key: redazione-rinvio
    name: Redazione comunicazione di rinvio
    description: Scrive in una riga il rinvio comunicato dal professionista, per riaprire la presa in carico
    agent: redattore
    prompt: |
      Parti: {{parti}}
      Numero di ruolo o fascicolo: {{fascicolo}}
      Autorità, sede e sezione: {{sede}}
      Data dell'udienza tenuta: {{dataUdienza}}
      Nuova data: {{nuovaData}}
      Nuova ora: {{nuovaOra}}
      Termini assegnati: {{terminiAssegnati}}
      Adempimenti o annotazioni: {{noteEsito}}

  # ------------------------------------------------------------------------------------------
  # L'ingresso: nessuno incolla più il testo di un avviso
  # ------------------------------------------------------------------------------------------
  # Ogni minuto il sorvegliante guarda la casella. L'ingresso ha DUE vie, e la differenza fra le
  # due è il motivo per cui ci sono entrambe:
  #
  #   · l'**output action webhook** consegna il testo che l'agente restituisce, SEMPRE, a ogni
  #     giro, senza che nessuno debba deciderlo. È deterministica. Apre la pratica della PRIMA
  #     voce, e la apre anche quando il modello non fa nient'altro di quello che gli è stato
  #     chiesto;
  #   · `apri_pratica_<dipartimento>`, lo stesso strumento della chat, apre le pratiche delle voci
  #     SUCCESSIVE — «da segnare» ne elenca due, il giro dei rinvii altrettante. Dalla v29 non
  #     porta più la materia: la dice la casella da cui il messaggio arriva.
  #
  # La v23 aveva tolto l'output action e affidato tutto allo strumento. Il primo giro di flusso
  # con la posta vera (17/09, 5 casi su 9) ha mostrato perché non si può: l'agente restituiva il
  # riepilogo «Civile, 14/10, rossi/alfa» **senza chiamare lo strumento**, e la pratica non
  # esisteva. Lo strumento chiamato a mano rispondeva `accepted` in un secondo: non era rotto,
  # era il modello a non chiamarlo. Un ingresso che dipende da una decisione del modello perde
  # comunicazioni, e qui una comunicazione persa è un termine perso.
  #
  # Il prezzo di tornare all'output action è l'istanza «NESSUN AVVISO» a ogni giro a vuoto, che
  # il gateway `filtro` chiude subito: rumore nella pagina Processi, in cambio di un ingresso che
  # non dipende da nessuno. È il baratto giusto in questo verso, e ora si paga due volte —
  # una per casella.
  #
  # La latenza è l'intervallo del cron. Per reagire nell'attimo servirebbe il push: issue #991.

  - key: sorveglianza-posta-civile
    name: Sorveglianza posta civile
    description: Ogni minuto cerca avvisi nuovi e avvia la presa in carico
    agent: sorveglianza-civile
    prompt: |
      Adesso è {{now}} (UTC).

      Cerca con posta_non_letta i messaggi arrivati negli ultimi due minuti. Prendi
      il primo da passare — qualunque comunicazione su un procedimento, anche una
      da prendere solo in visione — e segui le tue regole: la prima voce la apre il
      testo che restituisci, le voci successive le apri con apri_pratica_civile;
      poi, se il mittente è interno, rispondi; per ultimo chiamalo segna_letto, e
      dopo segna_letto non rileggi la posta: restituisci il testo della prima voce
      di quel messaggio. La finestra è più larga dell'intervallo di proposito:
      meglio riconsiderare un messaggio che perderlo fra due giri, e il segno di
      lettura dice quali sono già passati.

      Mittenti interni: gli indirizzi dei domini dello Studio che ti sono indicati
      negli strumenti. A loro, e solo a loro,
      rispondi con questo testo:
      «Presa in carico: la tua comunicazione è stata registrata e un referente
      dell'agenda la verificherà. [FASE DI TEST: se hai reinviato la stessa mail
      come messaggio nuovo, è stata vista come nuova e ha aperto una seconda
      pratica.]»
      La parte fra parentesi quadre va inclusa solo se la fase di test è «sì»;
      oggi è: sì.
    trigger: scheduled
    schedule:
      cron: "* * * * *"
      timeZone: Europe/Rome
    # Un giro al minuto sono 1440 esecuzioni al giorno: senza questa riga la piattaforma si ferma
    # alla centesima, poco prima delle due di notte, e la casella resta senza sorveglianza fino a
    # mezzanotte UTC.
    executionPolicy:
      maxDailyExecutions: 2000
    outputActions:
      - type: webhook
        url: processes.presa-in-carico-civile.webhook
        body:
          testoAvviso: "{{agentResponse}}"
          fonte: mail
          # Non è più un valore di comodo: questa casella è quella del civile, e la materia la dice
          # la casella. Fino alla v28 il corpo diceva «Civile» sempre — il modello è fisso e per
          # riga non si può cambiare — e il referente la correggeva a mano un giorno sì e l'altro
          # pure.
          materia: "Civile"
          fascicolo: "da attribuire"

  - key: sorveglianza-posta-penale
    name: Sorveglianza posta penale
    description: Ogni minuto cerca avvisi nuovi e avvia la presa in carico
    agent: sorveglianza-penale
    prompt: |
      Adesso è {{now}} (UTC).

      Cerca con posta_non_letta i messaggi arrivati negli ultimi due minuti. Prendi
      il primo da passare — qualunque comunicazione su un procedimento, anche una
      da prendere solo in visione — e segui le tue regole: la prima voce la apre il
      testo che restituisci, le voci successive le apri con apri_pratica_penale;
      poi, se il mittente è interno, rispondi; per ultimo chiamalo segna_letto, e
      dopo segna_letto non rileggi la posta: restituisci il testo della prima voce
      di quel messaggio. La finestra è più larga dell'intervallo di proposito:
      meglio riconsiderare un messaggio che perderlo fra due giri, e il segno di
      lettura dice quali sono già passati.

      Mittenti interni: gli indirizzi dei domini dello Studio che ti sono indicati
      negli strumenti. A loro, e solo a loro,
      rispondi con questo testo:
      «Presa in carico: la tua comunicazione è stata registrata e un referente
      dell'agenda la verificherà. [FASE DI TEST: se hai reinviato la stessa mail
      come messaggio nuovo, è stata vista come nuova e ha aperto una seconda
      pratica.]»
      La parte fra parentesi quadre va inclusa solo se la fase di test è «sì»;
      oggi è: sì.
    trigger: scheduled
    schedule:
      cron: "* * * * *"
      timeZone: Europe/Rome
    # Un giro al minuto sono 1440 esecuzioni al giorno: senza questa riga la piattaforma si ferma
    # alla centesima, poco prima delle due di notte, e la casella resta senza sorveglianza fino a
    # mezzanotte UTC.
    executionPolicy:
      maxDailyExecutions: 2000
    outputActions:
      - type: webhook
        url: processes.presa-in-carico-penale.webhook
        body:
          testoAvviso: "{{agentResponse}}"
          fonte: mail
          # Non è più un valore di comodo: questa casella è quella del penale, e la materia la dice
          # la casella. Fino alla v28 il corpo diceva «Civile» sempre — il modello è fisso e per
          # riga non si può cambiare — e il referente la correggeva a mano un giorno sì e l'altro
          # pure.
          materia: "Penale"
          fascicolo: "da attribuire"

  # ------------------------------------------------------------------------------------------
  # La scrittura sul calendario, dentro il processo
  # ------------------------------------------------------------------------------------------
  # Girano dopo la verifica del referente e dopo che un professionista è stato indicato: i dati
  # sono quelli del modulo, non quelli letti dall'agente. `proposta` (la lettura dell'avviso) va
  # nel prompt per il numero di ruolo e le parti, che il modulo di verifica non ha come campi.
  # ⚠️ `{{professionista}}` è il valore di un campo di tipo utente: se arriva come id e non come
  # nome, nelle note dell'evento comparirà l'id — da guardare alla prima esecuzione vera.

  - key: registrazione-udienza-civile
    name: Registrazione udienza civile
    description: Registra sul calendario comune un'udienza nuova o una scadenza appena assegnata
    agent: registrazione-civile
    prompt: |
      Da registrare: {{tipo}} (udienza nuova, oppure scadenza).
      Data: {{dataUdienza}}
      Ora: {{oraUdienza}}
      Autorità, sede e sezione: {{sede}}
      Tipo di adempimento: {{tipoAdempimento}}
      Professionista incaricato: {{professionista}}
      Fascicolo: {{fascicolo}}

      Estremi letti dall'avviso e verificati dal referente (numero di ruolo, parti, giudice):
      {{proposta}}

  - key: spostamento-udienza-civile
    name: Spostamento udienza civile
    description: Sposta sul calendario comune un'udienza rinviata, senza crearne una nuova
    agent: registrazione-civile
    prompt: |
      Rinvio: sposta l'impegno già in calendario.
      Udienza precedente (da cercare): {{udienzaPrecedente}}
      Nuova data: {{dataUdienza}}
      Nuova ora: {{oraUdienza}}
      Autorità, sede e sezione: {{sede}}

      Estremi letti dall'avviso e verificati dal referente (numero di ruolo, parti):
      {{proposta}}


  - key: registrazione-udienza-penale
    name: Registrazione udienza penale
    description: Registra sul calendario comune un'udienza nuova o una scadenza appena assegnata
    agent: registrazione-penale
    prompt: |
      Da registrare: {{tipo}} (udienza nuova, oppure scadenza).
      Data: {{dataUdienza}}
      Ora: {{oraUdienza}}
      Autorità, sede e sezione: {{sede}}
      Tipo di adempimento: {{tipoAdempimento}}
      Professionista incaricato: {{professionista}}
      Fascicolo: {{fascicolo}}

      Estremi letti dall'avviso e verificati dal referente (numero di ruolo, parti, giudice):
      {{proposta}}

  - key: spostamento-udienza-penale
    name: Spostamento udienza penale
    description: Sposta sul calendario comune un'udienza rinviata, senza crearne una nuova
    agent: registrazione-penale
    prompt: |
      Rinvio: sposta l'impegno già in calendario.
      Udienza precedente (da cercare): {{udienzaPrecedente}}
      Nuova data: {{dataUdienza}}
      Nuova ora: {{oraUdienza}}
      Autorità, sede e sezione: {{sede}}

      Estremi letti dall'avviso e verificati dal referente (numero di ruolo, parti):
      {{proposta}}


  # ------------------------------------------------------------------------------------------
  # La designazione sul calendario, e l'esito che ci torna sopra
  # ------------------------------------------------------------------------------------------
  # Girano dentro il processo della designazione, e usano lo stesso agente che scrive il
  # calendario. Nessuno dei due crea un impegno: l'udienza della settimana prossima è già in
  # agenda, e la riunione decide solo chi ci va.
  #
  # L'annotazione dell'esito non è cosmetica: è lo stato su cui lavora la chiamata delle 18:30,
  # che distingue le udienze di oggi già raccontate da quelle di cui non si sa ancora niente.
  # Senza una traccia sull'impegno, «chi non ha ancora comunicato l'esito» non sarebbe una
  # domanda a cui il calendario sa rispondere.

  - key: abbinamento-designazione-civile
    name: Abbinamento designazione civile
    description: Trova l'impegno già a calendario e ci annota il professionista designato
    agent: registrazione-civile
    prompt: |
      DESIGNAZIONE: annota sull'impegno chi ci va. Non creare nessun impegno nuovo.
      Data dell'udienza: {{dataUdienza}}
      Ora: {{oraUdienza}}
      Autorità, sede e sezione: {{sede}}
      Parti: {{parti}}
      Fascicolo o numero di ruolo: {{fascicolo}}
      Professionista designato: {{professionistaNome}}

      Riga come è stata dettata in riunione:
      {{testoRiga}}

  - key: annotazione-esito-civile
    name: Annotazione esito civile
    description: Scrive l'esito dell'udienza sull'impegno a calendario
    agent: registrazione-civile
    prompt: |
      ESITO: annota com'è andata sull'impegno già a calendario. Non spostare niente
      e non creare nessun impegno nuovo, nemmeno se l'udienza è stata rinviata: il
      rinvio lo registra la presa in carico, che parte da sola subito dopo.
      Data dell'udienza tenuta: {{dataUdienza}}
      Parti: {{parti}}
      Fascicolo o numero di ruolo: {{fascicolo}}
      Professionista: {{professionistaNome}}

      Esito: {{esito}}
      Nuova data (se rinviata): {{nuovaData}}
      Nuova ora (se indicata): {{nuovaOra}}
      Termini assegnati: {{terminiAssegnati}}
      Adempimenti o annotazioni: {{noteEsito}}

  - key: abbinamento-designazione-penale
    name: Abbinamento designazione penale
    description: Trova l'impegno già a calendario e ci annota il professionista designato
    agent: registrazione-penale
    prompt: |
      DESIGNAZIONE: annota sull'impegno chi ci va. Non creare nessun impegno nuovo.
      Data dell'udienza: {{dataUdienza}}
      Ora: {{oraUdienza}}
      Autorità, sede e sezione: {{sede}}
      Parti: {{parti}}
      Fascicolo o numero di ruolo: {{fascicolo}}
      Professionista designato: {{professionistaNome}}

      Riga come è stata dettata in riunione:
      {{testoRiga}}

