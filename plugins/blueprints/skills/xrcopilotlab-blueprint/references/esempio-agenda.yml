            - key: fascicolo
              label: Fascicolo
              type: text
              description: Riferimento interno del fascicolo, se noto
            - key: mittente
              label: Mittente
              type: text

        # La Sorveglianza chiama il webhook anche quando non trova niente, perché le output action
        # non hanno condizioni. L'istanza con «NESSUN AVVISO» si chiude qui.
        - id: nessun-avviso
          type: End
          name: Nessuna comunicazione da prendere in carico

        # Una parola — Udienza, Rinvio, Scadenza, Attività, Visione — proposta al referente, che la
        # conferma o la cambia nel passo dopo scegliendo `tipo`: è quella la variabile dei gateway.
        # Agente senza strumenti: torna in pochi secondi (#1000 non lo riguarda).
        - id: classifica
          type: Task
          name: Classifica la comunicazione
          performer: Automated
          agentTaskName: Classificazione comunicazione
          outputVariable: tipoProposto
          expectedDurationMinutes: 1
          maxLeadTimeMinutes: 30

        - id: estrai
          type: Task
          name: Estrai gli estremi
          performer: Automated
          agentTaskName: Estrazione avviso
          outputVariable: proposta
          expectedDurationMinutes: 2
          # Su un passo automatico la soglia non misura una persona lenta: segnala un'esecuzione che
          # non è tornata (issue #1000). Trenta minuti sono quindici volte la durata attesa.
          maxLeadTimeMinutes: 30

        - id: verifica
          type: Task
          name: Verifica del referente
          performer: HumanOnly
          roleName: Referente agenda penale
          expectedDurationMinutes: 10
          maxLeadTimeMinutes: 480        # mezza giornata lavorativa
          form:
            - key: proposta
              label: Estremi proposti
              type: textarea
              context: true
              description: Quello che l'assistente ha letto, da verificare sul testo
            - key: fonte
              label: Da dove arriva
              type: text
              context: true
            # La proposta del classificatore, in sola lettura; sotto, la scelta del referente. Due
