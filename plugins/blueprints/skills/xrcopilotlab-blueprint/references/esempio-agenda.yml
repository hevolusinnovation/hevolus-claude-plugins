# Studio Polis — Agenda e calendario di studio
#
# Deriva dall'assessment Agent Ready del 4 agosto 2026, scenario «Agenda e gestione delle
# scadenze». Copre la presa in carico di un avviso di udienza: dall'arrivo dell'avviso alla
# registrazione sul calendario comune, con l'assegnazione tracciata nel flusso invece che
# annotata sulla carta.
#
# Copre due strade: un'udienza nuova, che va assegnata e registrata, e il rinvio di un'udienza già
# a calendario, che va spostata senza riassegnare e senza creare un doppione.
#
# Risponde a quattro delle criticità che lo Studio ha censito nella propria procedura:
#   · la registrazione dipende da una sola persona senza sostituto  → il ruolo ha più membri
#   · nessuna conferma che un avviso sia stato letto e registrato   → passi di conferma con soglia
#   · l'assegnazione è decisa in riunione e annotata solo sulla carta → passo di assegnazione
#   · i rinvii mancanti vivono nelle bozze email di un referente     → alert automatico agli owner
#
# ── Cosa aggiunge la versione 4 ───────────────────────────────────────────────────────────────
# Tre caselle della tabella dello scenario Agenda che fino alla v3 restavano scoperte:
#
#   · «Briefing periodico e promemoria · BPM nativo, da configurare»
#       I promemoria a soglia c'erano già (maxLeadTimeMinutes → alert agli owner). Mancava il
#       briefing: ora è un agent task schedulato al lunedì mattina, prima della riunione
#       settimanale che lo Studio già fa.
#
#   · «Riconciliazione delle due agende · Orchestratore, da configurare»
#       Un orchestratore legge in parallelo la casella e il calendario comune e dice dove NON
#       coincidono. Risponde a una criticità che lo Studio ha censito da sé: «nessuna
#       riconciliazione periodica tra carta e digitale».
#
#   · «Computo e verifica dei termini · Agente Termini, da costruire»
#       Fino alla v3 era fuori perimetro per scelta, e la ragione era buona: su questa materia
#       un errore è irreparabile. Rientra nella forma che l'assessment stesso prescrive —
#       **propone e motiva, non decide**: ogni termine arriva al professionista come proposta
#       con la regola applicata e il conteggio, in un campo di sola lettura accanto alla
#       casella che resta sua e modificabile a mano. Se il flusso salta la proposta, il
#       processo funziona esattamente come prima.
#
# ── Cosa cambia nella versione 5 ──────────────────────────────────────────────────────────────
# Viene dal collaudo del 13/09/2026 (suite blueprints/tests/studiopolis-agenda*.tests.yml, giudizio
# nel report locale). Ogni punto corrisponde a un caso fallito, non a un'idea:
#
#   · L'agente Termini non c'è più. Il computo dei termini non è parte di posta e calendario: è
#       una capacità a sé dello scenario Agenda, che l'assessment dà «da costruire» come skill con
#       le regole codificate. Affidato a un modello da solo ha dato, alla stessa domanda, cinque
#       risposte diverse — sospensione feriale al contrario, giorni del 171-ter inventati — sempre
#       ben motivate, cioè proprio le date che nessuno ricontrolla. I termini li scrive il
#       professionista, come in v3.  (termini-tre-pezzi, termini-sabato)
#
#   · La registrazione sul calendario è AUTOMATICA. Un agente dedicato, «Registrazione calendario»,
#       crea l'evento (udienza nuova) o sposta quello esistente (rinvio) appena il referente ha
#       verificato gli estremi e indicato il professionista — cioè su dati che una persona ha già
#       controllato. Prima di scrivere cerca l'impegno, per non creare un doppione. Il suo esito
#       arriva nel compito del professionista, che lo vede e prende visione: se la scrittura non è
#       riuscita, è lì che se ne accorge. Non collaudabile finché la casella di prova non è
#       operativa: vedi blueprints/tests/studiopolis-agenda-scrittura.tests.yml.
#
#   · cerca_eventi chiede a Graph l'ora di Roma. Senza l'header Prefer, calendarView risponde in UTC
#       e l'agente riportava 08:30 per un'udienza delle 10:30: la riconciliazione avrebbe visto due
#       ore di differenza dove non ce n'erano.  (sim-calendario-json-utc)
#
#   · La Ricognizione conta anche le email dei colleghi. Scartava il rinvio comunicato da un
#       collega, cioè il caso più frequente.  (sim-ricognizione-elenco)
#
#   · Il Riconciliatore non conta due volte un rinvio. Un avviso e un impegno con lo stesso numero
#       di ruolo stanno SOLO fra le divergenze.  (sim-riconciliatore-rinvio-mancato)
#
#   · «NESSUN AVVISO» non apre più una presa in carico. Le output action degli agent task non hanno
#       condizioni: il webhook parte a ogni giro. Il processo ora chiude subito l'istanza con quel
#       testo, prima di lanciare l'estrazione e prima di creare qualunque compito.
#       (sim-presa-in-carico-nessun-avviso)
#
#   · I task schedulati sanno che ora è. «Ultimi dieci minuti» e «da oggi» sono finestre relative, e
#       il prompt ora porta {{now}} / {{date}} (UTC), risolti dall'esecuzione del task.
#
#   · L'orchestratore cabla davvero i passi. Il Confronto citava {{avvisiInCasella}} e
#       {{eventiACalendario}} senza inputMapping/outputMapping, e un segnaposto non risolto diventa
#       stringa vuota: il confronto lavorava su due elenchi vuoti.  (validatore BP093)
#
#   · L'agente Agenda non ha più gli strumenti di posta e calendario: estrae e basta. Scrivere è
#       compito della Registrazione, dopo la verifica umana, e un'estrazione con crea_evento a
#       portata di mano poteva registrare un impegno da sola. È anche l'unica differenza fra la v2,
#       la cui estrazione chiudeva in dieci secondi, e la v4, la cui estrazione non è mai tornata al
#       processo.  (presa-in-carico-udienza-avvio)
#
# ── Cosa cambia nella versione 6 ──────────────────────────────────────────────────────────────
# Dal collaudo della v5 senza casella (13/09/2026, catena simulata dall'orchestratore al processo):
#
#   · Il Riconciliatore non chiama «doppione» una coppia avviso/impegno. Dentro la catena metteva
#       Rossi e Verdi fra i doppioni E fra le divergenze, e Gialli/Gamma in tre sezioni: la regola
#       «una sezione sola» della v5 reggeva con due elenchi puliti, non con l'uscita delle letture.
#       Ora le sezioni si riempiono in un ordine fisso e ogni udienza ne occupa una.
#       (sim-riconciliazione-orchestratore)
#
#   · Una soglia di tempo anche sui passi automatici (estrazione, registrazione, spostamento).
#       Un agent task su un agente con server MCP, dentro un processo, oggi non completa mai e non
#       fallisce: il token resta fermo in silenzio (issue #1000). La registrazione sul calendario è
#       proprio quel caso. Finché #1000 non è risolto la v6 non lo aggira — la registrazione resta
#       automatica, come deciso — ma lo rende visibile: oltre soglia gli owner ricevono l'avviso.
#
# ── Cosa cambia nella versione 7 ──────────────────────────────────────────────────────────────
# Una correzione sola, dal collaudo a secco della Registrazione calendario (13/09/2026):
#
#   · Le date di SCRITTURA sono l'ora di Roma, senza fuso. Il corpo di crea_evento e sposta_evento
#       dichiara già timeZone Europe/Rome, ma il manifest descriveva i loro parametri come «ISO 8601
#       con fuso»: nella stessa esecuzione l'agente ha passato crea_evento senza offset e
#       sposta_evento con +02:00. Un dateTime con offset e un timeZone insieme sono ambigui per
#       Graph — rifiuto, o udienza spostata di due ore. Il fuso resta dove serve davvero: nelle
#       finestre di ricerca (cerca_eventi, posta_in_arrivo).  (sim-registrazione-rinvio)
#
# ── Cosa cambia nella versione 8 ──────────────────────────────────────────────────────────────
# Per la demo con lo Studio (14/09/2026): la Sorveglianza guarda la casella OGNI MINUTO invece che
# ogni cinque, e la finestra scende da dieci a due minuti — finestra e intervallo vanno insieme,
# perché una finestra più larga dell'intervallo ripassa al processo lo stesso avviso a ogni giro.
# Con due minuti su uno, una mail può ancora aprire due istanze: è il prezzo di non perdere un
# avviso arrivato a cavallo di due giri. La deduplica vera — segnare il messaggio come letto e
# chiedere solo i non letti — richiede Mail.ReadWrite al posto di Mail.Read, cioè un nuovo
# consenso dell'amministratore: è la v9, non questa.
#
# ── Cosa cambia nella versione 9 ──────────────────────────────────────────────────────────────
# La piattaforma conta le esecuzioni di ogni agent task per giorno UTC e, raggiunta la quota, salta
# le successive con un avviso nel log e niente altro. La quota di default è 100: la Sorveglianza
# della v8, un giro al minuto, l'ha esaurita alle 03:52 del 15/09 e da lì non ha più letto niente —
# la prima mail di prova è rimasta in casella. Qui la quota è dichiarata: 2000 al giorno, cioè i
# 1440 giri del cron più un margine. Il validatore ora avvisa (BP029) quando il cron è più fitto
# della quota.
#
# ── Cosa cambia nella versione 10: da «avvisi di udienza» a organizer dello Studio ────────────
# Il cliente non chiede un lettore di PEC: chiede un organizer. L'avvocato esce dal tribunale e
# scrive due righe di fretta dalla propria casella, o le DETTA in chat; le comunicazioni del
# tribunale sono una delle fonti, non la fonte, e non sono solo udienze. La v10 rovescia quindi
# l'ordine dei casi e allarga l'ingresso:
#
#   · Tre ingressi, UN processo. (1) La mail — anche scomposta — di chi lavora nello Studio;
#       (2) il dettato in chat all'agente «Assistente agenda», che apre la pratica con un tool
#       (apri_pratica → webhook del processo; la connessione `pratiche` con `process:` riceve
#       indirizzo e chiave dall'apply, CLI bp-v2.9.0); (3) le comunicazioni dell'autorità in
#       qualunque forma — PEC, mail di cancelleria, biglietto inoltrato. L'avvio a mano resta.
#
#   · La Sorveglianza diventa uno SMISTAMENTO: passa qualunque messaggio da organizzare, non
#       solo gli avvisi di udienza; scarta newsletter, notifiche automatiche e ciò che non
#       riguarda un procedimento. Per le PEC vale una regola in sei punti: legge SEMPRE corpo e
#       allegati (nuovo tool leggi_allegati, che espande il messaggio originale allegato alla
#       busta), un solo avviso se dicono la stessa cosa, divergenza affiancata se non coincidono,
#       «non indicato» più nota esplicita se l'allegato non è leggibile.
#
#   · Un CLASSIFICATORE dentro il processo. Ogni comunicazione, da qualunque ingresso, passa da un
#       agente senza strumenti che risponde con UNA parola — Udienza, Rinvio, Scadenza, Attività,
#       Visione — e il processo si biforca su quella. Il referente la vede e può correggerla nel
#       modulo di verifica prima che il flusso prenda un ramo. È l'unico punto di classificazione:
#       tre ingressi, un criterio.
#
#   · Il processo si chiama «Presa in carico di una comunicazione» e ha cinque uscite: udienza
#       nuova (assegna → registra → conferma), rinvio (indica → sposta → avvisa), scadenza con data
#       scritta nel testo (assegna → registra come scadenza → conferma), attività (assegna →
#       compito al professionista), presa visione (compito al referente e basta). Il computo dei
#       termini resta fuori, come dalla v5: se la data non c'è, il compito lo dice.
#
#   · Più cose in un messaggio («rinviata al 12 marzo, prepara il fascicolo, chiama il CTU
#       giovedì»): la voce principale apre la pratica, le altre viaggiano nella proposta come
#       «altre attività menzionate» e il referente le vede. Il motore apre UN'istanza per ingresso.
#
#   · L'Assistente agenda rilegge ciò che ha capito e chiama apri_pratica UNA volta, dopo il sì
#       dell'utente. Non ha gli strumenti di posta e calendario: aprire la pratica è già scrivere.
#
#   · Ancora aperti: il doppione della Sorveglianza (finestra 2 min su cron 1 min; deduplica con
#       Mail.ReadWrite, nuovo consenso) e il PDF dentro una PEC (il testo va estratto dal file, e
#       non passa dal tool Graph). Il file audio inoltrato per mail è la skill vocale
#       dell'assessment, da costruire: in chat il dettato passa dal microfono, già presente.
#
# ── Cosa cambia nella versione 11: la presa in carico si conferma, e il doppione sparisce ─────
# Dal primo giorno con la mail vera (15/09/2026): la Sorveglianza guarda gli ultimi due minuti ogni
# minuto, e una mail arrivata a cavallo di due giri apriva DUE pratiche. Segnare il messaggio come
# letto vorrebbe Mail.ReadWrite, cioè un consenso nuovo. Con i permessi che ci sono (Mail.Send,
# Mail.Read) si fa così, ed è anche una funzione che serve allo Studio:
#
#   · La Sorveglianza RISPONDE al mittente interno sullo stesso thread («Presa in carico…») quando
#       passa un messaggio al processo. È la conferma di ricezione per chi ha scritto di fretta, ed
#       è il segnaposto: al giro dopo, un messaggio il cui thread ha già una risposta inviata negli
#       ultimi quindici minuti è già preso in carico, e si salta (nuovo tool risposte_inviate).
#       Non si risponde all'autorità né ai mittenti esterni: una risposta automatica a una
#       cancelleria o a una PEC non è gradita; per quelli il segnaposto è la sola lettura della
#       posta inviata su thread interni, quindi il loro doppione resta possibile finché non c'è
#       Mail.ReadWrite (v12). Il testo della risposta porta l'avviso «fase di test» finché
#       `variables.faseDiTest` è «sì».
#   · Un messaggio REINVIATO come nuovo (altro thread) è nuovo davvero: lo vede due volte anche una
#       persona. La difesa resta a valle (Registrazione → GIÀ PRESENTE; il referente ne annulla una).
#   · Ritocchi dal collaudo della v10 con la mail vera: la regola (e) sulle PEC illeggibili passa
#       anche l'OGGETTO della busta (il numero di ruolo spesso sta solo lì); l'Assistente dice il tipo
#       con una parola sola, come il classificatore; l'Agenda non ripete la voce principale fra le
#       «altre attività menzionate» e scrive in testo semplice (il campo di sola lettura mostrava
#       «**Data e ora:**» con gli asterischi).
#   · Il classificatore scrive `tipoProposto`, non `tipo`. Un campo modificabile del modulo NON viene
#       precompilato dal caseData (la Web carica solo i dati del compito e i campi di contesto): il
#       select «Di che si tratta» arrivava vuoto e la proposta non si vedeva da nessuna parte. Ora la
#       verifica mostra «Tipo proposto» in sola lettura e il referente sceglie `tipo` — un clic, con
#       la proposta sotto gli occhi — ed è su `tipo` che il flusso si biforca.
#
# ── Cosa cambia nella versione 12: la PEC si legge davvero ───────────────────────────────────
# Con la prima PEC vera (16/09/2026) Exchange ha esposto il messaggio allegato come FILE
# (fileAttachment, message/rfc822, «pec-1.eml»), non come messaggio scomposto: `$expand` dell'item
# non serve a niente, e la v11 passava «ATTENZIONE: allegato non leggibile». Il nuovo tool
# leggi_eml prende il file (contentBytes in base64) e lo scompone nel `transform`, in JavaScript
# dentro il sandbox del builder: oggetto, mittente, data, testo (text/plain o HTML spogliato,
# quoted-printable e base64 decodificati) e, per una busta PEC, il messaggio `originale` che
# contiene. Restano illeggibili i PDF e le immagini: per quelli vale ancora la regola (e).
#
#   · La Registrazione non sceglie più fra due date: se la data del modulo e quella degli estremi
#       verificati non coincidono (il 16/09 il modulo diceva 23/09, la proposta 22/09, e l'agente ha
#       scritto il 22 senza dirlo), risponde NON REGISTRATO con i due valori e lascia decidere.
#
#
# ── Cosa cambia nella versione 29: la riunione di designazione, e le caselle dello Studio ────
# Due spinte diverse, arrivate insieme.
#
# La prima è la mail del cliente dopo la demo (18/09/2026): «abbiamo dimenticato un pezzo
# fondamentale della cd. procedura agenda». Ogni settimana i due dipartimenti si riuniscono e,
# agenda cartacea alla mano, stabiliscono CHI andrà a ciascuna udienza della settimana dopo. È
# quello il punto di partenza — l'evento che fa partire tutto — e da ogni designazione nasce un
# obbligo con scadenza: entro la giornata dell'udienza il designato deve comunicarne l'ESITO, da
# cui derivano i passaggi successivi. Fino alla v28 il manifest copriva l'ingresso di una
# comunicazione e si fermava alla presa visione: il ciclo dello Studio ricomincia dove il nostro
# finiva.
#
#   · Nuovo processo «Designazione ed esito dell'udienza», UN'istanza per udienza designata:
#       conferma del referente (che sceglie il professionista con il selettore utente) →
#       abbinamento all'impegno GIÀ a calendario → compito «Comunica l'esito» al designato →
#       annotazione dell'esito sull'impegno → se è un rinvio, la presa in carico riparte da sola
#       con una CallActivity, cioè con la macchina già collaudata (verifica, spostamento senza
#       doppioni, avviso al professionista).
#   · La designazione NON crea l'impegno: lo ANNOTA. Le udienze della settimana prossima sono già
#       a calendario — ce le ha messe la presa in carico quando è arrivato l'avviso — e la
#       riunione decide solo chi ci va. Per questo c'è un tool nuovo, `annota_evento`, che aggiorna
#       il solo corpo dell'impegno senza toccarne le date: `sposta_evento` pretende inizio e fine,
#       e usarlo per annotare significherebbe riscrivere un orario che nessuno ha chiesto di
#       cambiare. Se l'impegno non si trova, l'agente NON lo crea: lo dice, e il referente decide.
#   · L'ingresso è il dettato di fine riunione: il nuovo «Assistente designazioni» rilegge
#       l'elenco e apre una pratica PER RIGA con `apri_designazione`, e dice quante ne ha aperte —
#       è l'unico modo perché una persona si accorga di una riga persa.
#   · «Entro quella giornata» non è un timer: il motore non ha eventi temporali (Start, End, Task,
#       CallActivity e basta) e `maxLeadTimeMinutes` conta dall'arrivo del token, non dalla data
#       dell'udienza — una designazione fatta con sette giorni d'anticipo avrebbe una soglia priva
#       di senso. Il presidio è un task schedulato alle 18:30 nei giorni feriali: legge gli impegni
#       di OGGI e segnala quelli designati il cui corpo non porta ancora una riga «ESITO:». Per
#       questo l'esito si scrive sul calendario: è lo stato condiviso su cui lo sweep lavora.
#
# La seconda spinta è il passaggio alle caselle dello Studio. Fino alla v28 tutto girava su
# `test@hevolus.it`, una casella nostra. Ora sono DUE caselle del cliente, una per dipartimento:
#
#   · Due server MCP (`m365-civile`, `m365-penale`) sulla stessa connessione Graph, ciascuno con
#       la sua `mailbox`. I tredici tool sono definiti UNA volta e riusati con un anchor YAML: il
#       parser li risolve (verificato), e due copie a mano divergerebbero alla prima correzione.
#   · La MATERIA diventa deterministica. Fino alla v28 l'output action della Sorveglianza scriveva
#       `materia: Civile` fissa, perché il corpo è un modello e per riga non si può cambiare: il
#       referente la correggeva a mano. Chi legge dalla casella penale SA di essere nel penale.
#   · `segna_letto`: con `Mail.Read` non si poteva marcare un messaggio, e una mail arrivata a
#       cavallo di due giri apriva due pratiche (limite aperto dalla v11). Le due caselle nuove
#       nascono con `Mail.ReadWrite`, quindi il segnaposto smette di essere una risposta inviata e
#       diventa il flag di lettura.
#   · Due ruoli di referente, uno per dipartimento — e da lì, inevitabilmente, DUE processi di
#       presa in carico e DUE di designazione: `roleName` è statico sull'attività e
#       `assignmentExpression` risolve un id UTENTE, non un ruolo, quindi un processo solo non
#       saprebbe a quale referente mandare la verifica. Le due copie differiscono per il nome del
#       ruolo e per i task d'agente che chiamano: nient'altro. Quando se ne corregge una, l'altra
#       va corretta nello stesso commit.
#   · Due Riconciliazioni e due briefing: leggono calendari diversi.
#
# ⚠️ Questa versione NON è applicata. Il tenant di destinazione è quello di produzione dello
# Studio, e `tenant.companyId` porta un segnaposto apposta: in produzione l'API elenca i soli
# tenant il cui nome combacia con `Companies:ListingFilter` (oggi «hevolus») e rifiuta gli altri
# con exit 3, anche se il GUID viene scritto a mano. Finché quella chiave non cambia, questo
# manifest non si applica da riga di comando. Vedi la nota in fondo al file.
# Resta fuori il calendario Google del penale in sola lettura: vedi la nota in fondo al file.
#
#   xrcopilotlab-bp validate blueprints/studiopolis-agenda.yml --graph

blueprint: studiopolis-agenda
# v13 (16/09): senza lo step di avvio — l'orchestrazione parte dal primo step, come nel designer (BP094). Nessun cambio funzionale rispetto alla v12.
# v14 (16/09): leggi_eml senza $select — Graph rifiutava contentBytes sul tipo base dell'allegato.
# v15 (16/09): il transform legge `input`, non `data`: è così che il sandbox del builder passa la risposta.
# v16 (16/09): invia_messaggio senza allegato + invia_messaggio_con_allegato (Graph rifiutava l'allegato vuoto).
# v17 (16/09): responseFormat: text sui tool che rispondono 202 senza corpo (invio, risposta): il parse JSON falliva.
# v18 (16/09): risposte_inviate conta solo le risposte «RE:» — un messaggio spedito dalla casella stessa non è una conferma.
# v19 (16/09): cancella_evento, per la pulizia del calendario di collaudo nella suite di flusso.
# v20 (16/09): un campo del modulo vuoto o lasciato come «{{…}}» non è una divergenza (la scadenza senza ora usciva NON REGISTRATO).
# v21 (16/09): la Riconciliazione parte da un messaggio che dice che cosa fa e che cosa si può chiedere.
#              Applicata sul posto al solo orchestratore (script, senza rifare il blueprint): le altre entità restano della v20.
# v22 (16/09): quel messaggio passa da uno step sendMessage — che in chat arriva solo con la risposta finale — a
#              `welcomeMessage`, mostrato all'apertura della chat sull'endpoint dell'orchestratore. Applicato sul posto.
# v28 (18/09): il messaggio di benvenuto della Riconciliazione prometteva una domanda che
#              l'orchestrazione non sa soddisfare («Le date del fascicolo R.G. … coincidono?»): il
#              passo che confronta riceve solo i due elenchi, e la domanda non lo raggiunge. Ora il
#              benvenuto chiede solo il periodo, dice che la risposta sono sempre le quattro
#              sezioni, e avvisa che per fascicolo non si filtra.
# v27 (17/09): tre cose che il primo giro di flusso ha scritto sul calendario vero, e che i casi
#              a secco non avevano visto perché le loro attese combaciavano con qualunque titolo:
#              · il titolo dell'impegno restava quello della v22 («Udienza <parti> R.G. <n> R.G.»,
#                con il R.G. ripetuto): ora la forma dello Studio è data per esteso, con un
#                esempio completo e il divieto di ripetere il numero di ruolo;
#              · la catena «<data> --> » non veniva passata: ora `note` è obbligatoria sullo
#                spostamento, con la stringa esatta e l'esempio;
#              · nelle note compariva l'id dell'utente («a35dd4a0-…») al posto del nome del
#                professionista — rischio annotato nel manifest dal 13/09 e verificatosi alla
#                prima esecuzione vera: ora un codice non si scrive affatto.
# v26 (17/09): l'ingresso torna DETERMINISTICO. Il primo giro di flusso con la posta vera ha
#              mostrato che l'agente restituiva il riepilogo della pratica senza chiamare
#              apri_pratica (istanze: zero; lo stesso strumento chiamato a mano: `accepted` in un
#              secondo). Con la v23 l'apertura dipendeva da una decisione del modello, e su un
#              ingresso che non deve perdere comunicazioni è il baratto sbagliato.
#              Ora: l'output action webhook riapre la pratica della PRIMA voce a ogni giro, come
#              fino alla v22; `apri_pratica` serve solo per le voci SUCCESSIVE. Se il modello se
#              le dimentica si perde quello che si perdeva anche prima della v23 — niente di
#              nuovo — invece di perdere la comunicazione intera. Torna anche l'istanza «NESSUN
#              AVVISO» a ogni giro a vuoto, chiusa subito dal gateway `filtro`: è il prezzo.
# v25 (17/09): dal primo giro di flusso con la posta vera — 5 casi su 9, e i quattro falliti tutti
#              per lo stesso motivo. La Sorveglianza leggeva la mail, rispondeva «Presa in carico»
#              e POI concludeva NESSUN AVVISO: rispondendo prima di aprire si metteva da sola nella
#              condizione del punto 2 (un thread con una «RE:» è roba di un giro precedente).
#              Fino alla v22 non poteva succedere — la pratica la apriva l'output action, non
#              l'agente. Ora: prima apri_pratica, poi la conferma; e una risposta mandata nello
#              stesso giro non conta come presa in carico precedente. Uno su quattro passava
#              perché l'ordine non era vincolato: il modello a volte apriva per primo.
# v24 (17/09): dal primo collaudo della v23 su staging, quattro cose che solo l'esecuzione
#              poteva dire:
#              · il classificatore leggeva «5.11.2026 - Trib. De Rosa: Ingargiola» come Visione e
#                «Tm Mascari: Zuccaro al 15.10.2026» come Udienza: le righe di agenda non hanno
#                verbo, e senza una regola apposta non sembrano niente da registrare;
#              · l'estrazione scriveva «numero di ruolo: non indicato» mentre stava nell'oggetto
#                («[GIP NOTI 2026/4821 BARI]»), che è dove sta quasi sempre nel penale;
#              · la catena «<data> --> » sui rinvii era una regola non eseguibile: sposta_evento
#                non aveva le note. Ora le ha;
#              · senza messaggi la Sorveglianza rispondeva «NESSUNA PRATICA» invece della formula
#                esatta «NESSUN AVVISO».
# v23 (17/09): la documentazione vera dello Studio — due procedure, civile e penale, con otto
#              comunicazioni autentiche (assessment, customers/studiopolis/test-data). Ogni
#              modifica qui sotto viene da una di quelle, non da un'ipotesi:
#              · una comunicazione può contenere PIÙ udienze («da segnare»: due; il giro dei
#                rinvii del giovedì: due, con il messaggio precedente citato sotto). Ora la
#                Sorveglianza apre una pratica PER VOCE con apri_pratica — lo stesso strumento
#                della chat — invece di consegnare un testo solo all'output action webhook.
#                Cadono con quella tre limiti: la materia fissa a Civile, l'impossibilità di
#                aprirne due, e l'istanza «NESSUN AVVISO» aperta e chiusa ogni minuto.
#              · la materia la dice la forma: una busta del processo telematico porta il settore
#                nel dominio del mittente (@penale.ptel… / @civile.ptel…).
#              · in una notifica di atti penali la data accanto al nome dell'atto è la data
#                dell'ATTO: l'udienza sta nel PDF. Prima veniva letta come data di udienza.
#              · «00:00» in una comunicazione di cancelleria vuol dire ora non indicata.
#              · un rinvio senza ora — la regola, non l'eccezione — sposta l'impegno tenendo
#                l'ora che aveva, e lo dichiara, invece di non registrare.
#              · le note del rinvio portano la catena «<data precedente> --> », come lo Studio
#                fa sui propri fascicoli.
#              · il titolo dell'impegno segue la forma con cui lo Studio nomina le udienze,
#                «<autorità> (<giudice>): <parti> — R.G. <n>».
#              · firma e note di riservatezza non sono testo della comunicazione; in un inoltro
#                stanno PRIMA del contenuto, in una risposta il citato sta sotto.
#              · un messaggio senza testo utile e con un PDF (le agende settimanali scansionate)
#                passa con l'oggetto e la nota «aprire la mail».
# v30 (24/09): dal collaudo della v29 — la rilettura delle designazioni riporta ora, giudice e
#              numero di ruolo (li passava allo strumento senza mostrarli), e una riga con un nome
#              solo si chiede invece di sceglierlo; la Sorveglianza passa l'oggetto degli inoltri del
#              processo telematico, l'unico posto dove spesso sta il numero di ruolo.
# v32 (24/09): due difese per i difetti intermittenti del collaudo della v31 — una mail segnata come
#              letta, con la conferma mandata, ma «NESSUN AVVISO» e nessuna pratica (comunicazione
#              persa); e una mail di una voce aperta due volte. Il prompt del task non limita più
#              il passaggio a «udienza, rinvio o scadenza» e ripete la regola della prima voce;
#              «NESSUN AVVISO» vale solo se nel giro non si è segnato niente; dopo segna_letto non si
#              rilegge la posta. Causa non accertata: il log delle esecuzioni non registra le
#              chiamate agli strumenti (#1148).
# v31 (24/09): la Sorveglianza scarta la propria conferma di presa in carico e non le risponde mai.
#              Dal collaudo: una mail dalla casella a sé stessa ricevette la conferma, la conferma
#              tornò in casella e diventò una pratica «Visione» con una nuova conferma — 26 pratiche
#              d'eco in 45 minuti, alternate fra civile e penale. In produzione lo stesso anello si
#              chiude fra le due caselle dello Studio.
version: 32
tag: STUDIOPOLIS
description: Organizer dello Studio — dalla riunione di designazione all'esito dell'udienza, e dalla mail o dal dettato alla pratica e al calendario comune

tenant:
  # ⚠️ SEGNAPOSTO, e non per dimenticanza: il tenant di destinazione è quello di PRODUZIONE dello
  # Studio, che non esiste ancora qui. Va scritto il suo companyId quando c'è — e va letto prima
  # l'avvertimento in fondo al file: in produzione la CLI lavora solo sui tenant che l'API elenca,
  # e oggi l'elenco è filtrato su «hevolus».
  # Fino alla risposta dello Studio (24/09): tenant di prova di STAGING, strada (a) della nota in
  # fondo. In produzione diventa il companyId del tenant dello Studio.
  companyId: 4da69cbc-d935-4050-f410-08d8392ca08f
  topic: Agenda di Studio

# --------------------------------------------------------------------------------------------
# Microsoft 365: le due caselle dello Studio e i due calendari
# --------------------------------------------------------------------------------------------
# Una sola connessione verso Microsoft Graph — un'unica registrazione applicativa nel tenant del
# cliente — e sopra DUE server MCP, uno per dipartimento: stessi strumenti, casella diversa.
#
# ── La casella è una VARIABILE, non un parametro ──────────────────────────────────────────────
# `variables.mailbox` è fissata qui e il modello non la vede. Fosse un parametro del tool,
# sarebbe l'agente a decidere di quale casella leggere — e con un permesso applicativo quella
# scelta vale su tutto il tenant. Non è comodità: è chi decide.
#
# ── Perché due server e non uno con la casella come parametro ─────────────────────────────────
# Per la stessa ragione. E in cambio si guadagna una cosa che fino alla v28 era un difetto noto:
# la MATERIA non si indovina più. L'output action della Sorveglianza scriveva `materia: Civile`
# fissa — il corpo è un modello, per riga non si può cambiare — e il referente la correggeva a
# mano. Chi legge dalla casella penale sa di essere nel penale.
#
# I tredici tool sono scritti UNA volta sola, sotto l'anchor `&graphTools`, e riusati nel secondo
# server con `*graphTools`. Il parser li risolve (provato: un manifest con anchor valida e
# pianifica). Due copie a mano divergerebbero alla prima correzione fatta su una sola.
#
# ── Prerequisiti da fare a mano, PRIMA di applicare ───────────────────────────────────────────
# Il blueprint crea connessione, server MCP e collegamento agli agenti. Non può creare i permessi,
# che vivono nel tenant del cliente:
#   1. registrazione applicativa nel tenant dello Studio (single tenant, nessun redirect URI);
#   2. le DUE cassette condivise e un gruppo di sicurezza abilitato alla posta che contenga solo
#      quelle due — è il gruppo su cui si aggancia la restrizione del punto 3;
#   3. i permessi, limitati a quelle due caselle. Due strade, da NON mescolare (i permessi si
#      sommerebbero e la restrizione decadrebbe):
#        a) RBAC per applicazioni (raccomandata da Microsoft): nessun consenso in Entra, e in
#           Exchange Online `New-ServicePrincipal`, `New-ManagementScope` sul gruppo,
#           `New-ManagementRoleAssignment` per i ruoli
#           `Application Mail.ReadWrite`, `Application Mail.Send`, `Application Calendars.ReadWrite`;
#        b) permessi applicativi in Entra (Mail.ReadWrite, Mail.Send, Calendars.ReadWrite) con
#           consenso amministratore, PIÙ `New-ApplicationAccessPolicy -AccessRight RestrictAccess`
#           sul gruppo. Le Application Access Policy sono dichiarate legacy da Microsoft.
#      Verifica prima della consegna: `Test-ServicePrincipalAuthorization` deve dare in ambito le
#      due agende e FUORI ambito qualunque altra casella.
#   4. i due segreti, che nel manifest compaiono solo come nome:
#        xrcopilotlab-bp secrets set --tag STUDIOPOLIS graph-client-id
#        xrcopilotlab-bp secrets set --tag STUDIOPOLIS graph-client-secret
#
# `Mail.ReadWrite` al posto di `Mail.Read` non è un allargamento gratuito: serve a `segna_letto`,
# cioè alla deduplica. Fino alla v28, senza poter marcare un messaggio, il segnaposto era la
# risposta già inviata sul thread, e una mail arrivata a cavallo di due giri apriva due pratiche.

connections:
  - key: graph
    name: microsoft-graph
    provider: webhook
    baseUrl: https://graph.microsoft.com/v1.0
    auth:
      kind: OAuth2ClientCredentials
      # ⚠️ Il tenant è quello dello STUDIO, non più hevolus.it: l'app registrata vive nella loro
      # directory e i permessi sono ristretti alle due agende. Da sostituire con il loro
      # Directory (tenant) ID quando arriva.
      # Fino alla risposta dello Studio: la registrazione di hevolus.it, la stessa della v28.
      # In produzione: https://login.microsoftonline.com/<tenant-id-dello-studio>/oauth2/v2.0/token
      tokenUrl: https://login.microsoftonline.com/45bb21a6-d8f8-4218-b74d-f4a5d5c2138e/oauth2/v2.0/token
      clientId: Blueprints:Secrets:STUDIOPOLIS:graph-client-id
      clientSecret: Blueprints:Secrets:STUDIOPOLIS:graph-client-secret
      # .default chiede i permessi applicativi già consentiti: non se ne aggiungono qui.
      scope: https://graph.microsoft.com/.default

  # I quattro ponti dalla chat ai processi. Puntano ai webhook di avvio: indirizzo e chiave
  # nascono all'apply, dopo il webhook, e la CLI li scrive qui da sé (le chiavi restano in Key
  # Vault come Blueprints:Secrets:STUDIOPOLIS:webhook-<chiave del processo>). Niente baseUrl,
  # niente auth. Sono quattro e non due perché i processi sono quattro: una connessione porta a
  # UN processo, ed è il processo a sapere a quale referente mandare la verifica.
  - key: pratiche-civile
    name: pratiche-civile-webhook
    provider: webhook
    process: presa-in-carico-civile

  - key: pratiche-penale
    name: pratiche-penale-webhook
    provider: webhook
    process: presa-in-carico-penale

  - key: designazioni-civile
    name: designazioni-civile-webhook
    provider: webhook
    process: designazione-civile

  - key: designazioni-penale
    name: designazioni-penale-webhook
    provider: webhook
    process: designazione-penale

mcpServers:
  # ------------------------------------------------------------------------------------------
  # Dalla chat alla pratica: un tool per dipartimento
  # ------------------------------------------------------------------------------------------
  # Il corpo della POST diventa il caseData iniziale, quindi le chiavi sono quelle del modulo di
  # avvio. `materia` e `fonte` non sono più parametri del modello: li sa la connessione, perché
  # ogni server porta a un processo solo. Un parametro in meno è una cosa in meno che il modello
  # può sbagliare — ed era il campo che il referente correggeva più spesso.
  #
  # I due tool hanno nomi DIVERSI perché stanno sullo stesso agente: due `apri_pratica` si
  # oscurerebbero a vicenda. Il nome dice il dipartimento, ed è così che l'avvocato lo sceglie
  # dicendo «penale» o «civile».
  - key: pratiche-civile
    kind: builder
    name: Pratiche civile
    description: Apre una pratica di presa in carico CIVILE dal testo dettato o incollato in chat.
    connection: pratiche-civile
    systemPrompt: >
      apri_pratica_civile apre una pratica vera, che arriva a un referente del civile. Si chiama
      UNA volta per ogni udienza, rinvio o scadenza DISTINTO: un messaggio che ne elenca due apre
      due pratiche, perché a valle ognuna ha una data, un professionista e un impegno in calendario
      suoi. In chat si chiama solo dopo che l'utente ha confermato ciò che hai riletto.
    tools:
      - name: apri_pratica_civile
        method: POST
        path: /
        description: >
          Apre la presa in carico di UNA comunicazione del CIVILE. Il testo va passato come è
          arrivato, senza riassumerlo: la classificazione e l'estrazione le fa il processo. Se il
          messaggio contiene più voci, si chiama una volta per voce passando la riga o il
          paragrafo di quella voce, con il contesto che serve a capirla.
        parameters:
          testo: Il testo della comunicazione (o della singola voce), senza riassumerlo né correggerlo
          fonte: { type: string, description: "mail, chat, cancelleria o altro: da dove arriva la comunicazione" }
          mittente: { type: string, description: "Chi l'ha mandata: indirizzo del mittente, oppure «chat»" }
        required: [testo, fonte]
        body: |
          {"testoAvviso": "{{testo}}", "fonte": "{{fonte}}", "materia": "Civile", "fascicolo": "da attribuire", "mittente": "{{mittente}}"}
    # Nessun testTool: prima del webhook la connessione non ha un indirizzo, e dopo la prova
    # aprirebbe una pratica vera. Si prova a mano:
    #   xrcopilotlab-bp mcp test pratiche-civile --tool apri_pratica_civile

  - key: pratiche-penale
    kind: builder
    name: Pratiche penale
    description: Apre una pratica di presa in carico PENALE dal testo dettato o incollato in chat.
    connection: pratiche-penale
    systemPrompt: >
      apri_pratica_penale apre una pratica vera, che arriva a un referente del penale. Si chiama
      UNA volta per ogni udienza, rinvio o scadenza DISTINTO: un messaggio che ne elenca due apre
      due pratiche, perché a valle ognuna ha una data, un professionista e un impegno in calendario
      suoi. In chat si chiama solo dopo che l'utente ha confermato ciò che hai riletto.
    tools:
      - name: apri_pratica_penale
        method: POST
        path: /
        description: >
          Apre la presa in carico di UNA comunicazione del PENALE. Il testo va passato come è
          arrivato, senza riassumerlo: la classificazione e l'estrazione le fa il processo. Se il
          messaggio contiene più voci, si chiama una volta per voce passando la riga o il
          paragrafo di quella voce, con il contesto che serve a capirla.
        parameters:
          testo: Il testo della comunicazione (o della singola voce), senza riassumerlo né correggerlo
          fonte: { type: string, description: "mail, chat, cancelleria o altro: da dove arriva la comunicazione" }
          mittente: { type: string, description: "Chi l'ha mandata: indirizzo del mittente, oppure «chat»" }
        required: [testo, fonte]
        body: |
          {"testoAvviso": "{{testo}}", "fonte": "{{fonte}}", "materia": "Penale", "fascicolo": "da attribuire", "mittente": "{{mittente}}"}

  # ------------------------------------------------------------------------------------------
  # Dalla riunione alla designazione: una pratica PER RIGA
  # ------------------------------------------------------------------------------------------
  # La riunione settimanale produce un elenco: «lunedì Corte d'Appello, Di Comite; martedì GIP,
  # Rossi…». Ogni riga è una designazione a sé, con una data, una persona e un impegno già a
  # calendario suoi — quindi una pratica a sé. Chiamare lo strumento una volta per riga è l'unico
  # modo perché a valle ciascuna possa avere il suo compito «Comunica l'esito».
  #
  # Il numero di righe lette e il numero di pratiche aperte vanno DETTI all'utente: è l'unico
  # controllo che una persona può fare su un elenco lungo.
  - key: designazioni-civile
    kind: builder
    name: Designazioni civile
    description: Apre una pratica di designazione CIVILE per una singola udienza della settimana.
    connection: designazioni-civile
    systemPrompt: >
      apri_designazione_civile apre una pratica vera per UNA udienza designata del civile. Si
      chiama una volta per riga dell'elenco dettato in riunione, mai una volta sola per l'elenco
      intero, e solo dopo che l'utente ha confermato la rilettura.
    tools:
      - name: apri_designazione_civile
        method: POST
        path: /
        description: >
          Registra la designazione di UNA udienza del civile: chi ci va, quando, davanti a chi.
          Non crea l'impegno in calendario — quello di norma c'è già — e non decide niente: apre
          la pratica che il referente conferma.
        parameters:
          testo: La riga come è stata dettata, senza riscriverla
          data: { type: string, description: "Data dell'udienza, formato AAAA-MM-GG" }
          ora: { type: string, description: "Ora dell'udienza se detta, altrimenti vuoto" }
          sede: { type: string, description: "Autorità, sede e sezione: «Corte d'Appello», «Trib. sez. II»…" }
          parti: { type: string, description: "Le parti, se dette" }
          fascicolo: { type: string, description: "Numero di ruolo o riferimento interno, se detto" }
          professionista: { type: string, description: "Il nome del professionista designato, come è stato detto" }
        required: [testo, data, professionista]
        body: |
          {"testoRiga": "{{testo}}", "dataUdienza": "{{data}}", "oraUdienza": "{{ora}}", "sede": "{{sede}}", "parti": "{{parti}}", "fascicolo": "{{fascicolo}}", "professionistaProposto": "{{professionista}}", "materia": "Civile", "fonte": "riunione"}

  - key: designazioni-penale
    kind: builder
    name: Designazioni penale
    description: Apre una pratica di designazione PENALE per una singola udienza della settimana.
    connection: designazioni-penale
    systemPrompt: >
      apri_designazione_penale apre una pratica vera per UNA udienza designata del penale. Si
      chiama una volta per riga dell'elenco dettato in riunione, mai una volta sola per l'elenco
      intero, e solo dopo che l'utente ha confermato la rilettura.
    tools:
      - name: apri_designazione_penale
        method: POST
        path: /
        description: >
          Registra la designazione di UNA udienza del penale: chi ci va, quando, davanti a chi.
          Non crea l'impegno in calendario — quello di norma c'è già — e non decide niente: apre
          la pratica che il referente conferma.
        parameters:
          testo: La riga come è stata dettata, senza riscriverla
          data: { type: string, description: "Data dell'udienza, formato AAAA-MM-GG" }
          ora: { type: string, description: "Ora dell'udienza se detta, altrimenti vuoto" }
          sede: { type: string, description: "Autorità, sede e sezione: «Corte d'Appello», «GIP»…" }
          parti: { type: string, description: "Le parti o l'imputato, se detti" }
          fascicolo: { type: string, description: "Numero di ruolo o riferimento interno, se detto" }
          professionista: { type: string, description: "Il nome del professionista designato, come è stato detto" }
        required: [testo, data, professionista]
        body: |
          {"testoRiga": "{{testo}}", "dataUdienza": "{{data}}", "oraUdienza": "{{ora}}", "sede": "{{sede}}", "parti": "{{parti}}", "fascicolo": "{{fascicolo}}", "professionistaProposto": "{{professionista}}", "materia": "Penale", "fonte": "riunione"}

  # ------------------------------------------------------------------------------------------
  # Le due caselle dello Studio
  # ------------------------------------------------------------------------------------------
  - key: m365-civile
    kind: builder
    name: Microsoft365-Civile
    description: >
      Posta e calendario dell'agenda del CIVILE dello Studio su Microsoft 365.
    connection: graph
    variables:
      # ⚠️ Indirizzo da confermare con lo Studio. Deve stare sul dominio che è su Microsoft 365:
      # una casella su un dominio ospitato altrove non è raggiungibile da Graph.
      # Fino alla risposta dello Studio: la casella di prova. In esercizio: agenda.civile@<dominio>.
      mailbox: test@hevolus.it
      # I domini di chi lavora nello Studio: la Sorveglianza risponde solo a loro. Sono più di uno
      # perché lo Studio ne ha più di uno, e l'avvocato che scrive dal telefono usa quello che ha
      # configurato: elencarli tutti è la differenza fra ricevere la conferma e non riceverla.
      dominioInterno: hevolus.it
      # «sì» finché si collauda: la risposta di presa in carico avvisa che si è in fase di test e che
      # una mail reinviata è vista come nuova. In esercizio: «no».
      faseDiTest: "sì"
    systemPrompt: >
      Gli strumenti lavorano su UNA sola casella, quella dell'agenda civile dello Studio: non
      chiedere di quale casella si tratta e non provare a cambiarla. Per CERCARE (cerca_eventi,
      posta_in_arrivo) le date sono ISO 8601 con fuso. Per SCRIVERE (crea_evento, sposta_evento)
      sono l'ora locale di Roma SENZA fuso, per esempio 2026-10-13T09:30:00: il fuso lo mette lo
      strumento, e un offset in più sposterebbe l'impegno. Prima di
      scrivere in calendario, verifica con cerca_eventi che non ci sia già la stessa udienza:
      un doppione in agenda costa più di una mancata scrittura.
    tools: &graphTools
      - name: posta_in_arrivo
        method: GET
        path: /users/{{mailbox}}/mailFolders/inbox/messages
        description: >
          Messaggi arrivati nella casella dello Studio, dal più recente. Restituisce mittente,
          oggetto, data e anteprima: per il testo completo serve leggi_messaggio.
        parameters:
          da: Momento da cui guardare, ISO 8601 con fuso, es. 2026-09-11T00:00:00Z
        required: [da]
        query:
          $filter: "receivedDateTime ge {{da}}"
          $orderby: receivedDateTime desc
          $top: "25"
          $select: id,conversationId,receivedDateTime,from,subject,bodyPreview,hasAttachments,isRead

      # Stessa lettura di posta_in_arrivo, ma solo di ciò che nessun giro precedente ha già
      # preso in carico. Esiste separato invece di essere un parametro del filtro perché la
      # Ricognizione, che confronta casella e calendario, deve vedere TUTTO: una comunicazione
      # già lavorata è comunque una riga di quel confronto.
      - name: posta_non_letta
        method: GET
        path: /users/{{mailbox}}/mailFolders/inbox/messages
        description: >
          Messaggi NON ANCORA LETTI arrivati nella casella, dal più recente: quelli che nessun
          giro precedente ha preso in carico. Per il testo completo serve leggi_messaggio.
        parameters:
          da: Momento da cui guardare, ISO 8601 con fuso, es. 2026-09-11T00:00:00Z
        required: [da]
        query:
          $filter: "receivedDateTime ge {{da}} and isRead eq false"
          $orderby: receivedDateTime desc
          $top: "25"
          $select: id,conversationId,receivedDateTime,from,subject,bodyPreview,hasAttachments,isRead

      - name: leggi_messaggio
        method: GET
        path: /users/{{mailbox}}/messages/{{messaggioId}}
        description: Corpo completo di un messaggio, dato il suo identificativo.
        parameters:
          messaggioId: Identificativo del messaggio, come restituito da posta_in_arrivo
        required: [messaggioId]

      # Una busta PEC porta il messaggio originale come allegato (postacert.eml): Exchange lo
      # espone come itemAttachment, e con $expand Graph restituisce il messaggio interno già
      # scomposto — oggetto, mittente, corpo — senza interpretare il MIME. Basta Mail.Read. Se
      # il gestore lo marca come file generico, qui arriva solo un contentBytes in base64: in
      # quel caso l'allegato NON è leggibile, e va detto (regola 6 dello Smistamento).
      - name: leggi_allegati
        method: GET
        path: /users/{{mailbox}}/messages/{{messaggioId}}/attachments
        description: >
          Gli allegati di un messaggio. Un messaggio allegato (una PEC porta così l'originale)
          arriva con oggetto, mittente e corpo già leggibili in «item»; un file arriva con nome,
          tipo e contenuto in base64, che NON va interpretato.
        parameters:
          messaggioId: Identificativo del messaggio, come restituito da posta_in_arrivo
        required: [messaggioId]
        query:
          $expand: microsoft.graph.itemAttachment/item
          $select: id,name,contentType,size

      # Il messaggio allegato a una busta PEC, scomposto. Exchange lo espone come file (base64 del
      # MIME): il transform lo decodifica nel sandbox QuickJS del builder — niente atob, niente
      # librerie — e restituisce oggetto, mittente, data, testo e allegati, con il messaggio
      # `originale` annidato se il file è a sua volta una busta. Oltre 2 MB non si decodifica.
      - name: leggi_eml
        method: GET
        path: /users/{{mailbox}}/messages/{{messaggioId}}/attachments/{{allegatoId}}
        description: >
          Scompone un messaggio allegato (.eml, message/rfc822): oggetto, mittente, data, testo e
          allegati; per una busta PEC anche il messaggio originale in «originale». Da chiamare per
          ogni allegato .eml che leggi_allegati ha elencato.
        parameters:
          messaggioId: Identificativo del messaggio, come restituito da posta_in_arrivo
          allegatoId: Identificativo dell'allegato, come restituito da leggi_allegati
        required: [messaggioId, allegatoId]
        # Niente $select: contentBytes è una proprietà di fileAttachment, non del tipo base, e Graph
        # rifiuta la selezione con un 400 (visto il 16/09); senza selezione lo restituisce da sé.
        transform: |
          // Transform per il tool `leggi_eml`: riceve l'allegato di Graph (fileAttachment con contentBytes in
          // base64, contentType message/rfc822) e restituisce il messaggio contenuto scomposto: oggetto,
          // mittente, data, testo. Gira nel sandbox QuickJS del builder: niente atob, niente Buffer, niente
          // TextDecoder — tutto in JavaScript semplice. Una PEC (postacert.eml) contiene il messaggio
          // originale; il testo è nella prima parte text/plain (o text/html spogliato), spesso in
          // quoted-printable o base64. Se dentro c'è a sua volta un message/rfc822, si scende di un livello.

          function b64ToBytes(s) {
            const t = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
            const map = {}; for (let i = 0; i < t.length; i++) map[t[i]] = i;
            const out = []; let buf = 0, bits = 0;
            for (let i = 0; i < s.length; i++) {
              const c = s[i]; if (c === "=" ) break; const v = map[c]; if (v === undefined) continue;
              buf = (buf << 6) | v; bits += 6;
              if (bits >= 8) { bits -= 8; out.push((buf >> bits) & 0xff); }
            }
            return out;
          }
          function utf8(bytes) {
            let s = "", i = 0;
            while (i < bytes.length) {
              const b = bytes[i++];
              if (b < 0x80) s += String.fromCharCode(b);
              else if (b >= 0xc0 && b < 0xe0) s += String.fromCharCode(((b & 0x1f) << 6) | (bytes[i++] & 0x3f));
              else if (b >= 0xe0 && b < 0xf0) { s += String.fromCharCode(((b & 0x0f) << 12) | ((bytes[i++] & 0x3f) << 6) | (bytes[i++] & 0x3f)); }
              else { const cp = ((b & 0x07) << 18) | ((bytes[i++] & 0x3f) << 12) | ((bytes[i++] & 0x3f) << 6) | (bytes[i++] & 0x3f); s += String.fromCodePoint(cp); }
            }
            return s;
          }
          function latin1(bytes) { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return s; }
          function qpDecode(s) {
            const bytes = []; s = s.replace(/=\r?\n/g, "");
            for (let i = 0; i < s.length; i++) {
              if (s[i] === "=" && /^[0-9A-Fa-f]{2}$/.test(s.substr(i + 1, 2))) { bytes.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
              else bytes.push(s.charCodeAt(i) & 0xff);
            }
            return bytes;
          }
          function decodeHeaderWord(s) {
            // =?utf-8?Q?...?= / =?utf-8?B?...?=
            return s.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (m, cs, enc, txt) => {
              const bytes = enc.toUpperCase() === "B" ? b64ToBytes(txt) : qpDecode(txt.replace(/_/g, " "));
              return /utf-?8/i.test(cs) ? utf8(bytes) : latin1(bytes);
            });
          }
          function parseHeaders(raw) {
            const h = {}; const lines = raw.split(/\r?\n/); let last = null;
            for (const l of lines) {
              if (/^[ \t]/.test(l) && last) { h[last] += " " + l.trim(); continue; }
              const m = l.match(/^([\w-]+):\s*(.*)$/); if (m) { last = m[1].toLowerCase(); h[last] = m[2]; }
            }
            return h;
          }
          function param(ct, name) { const m = new RegExp(name + '="?([^";]+)"?', "i").exec(ct || ""); return m ? m[1] : null; }
          function decodeBody(body, headers) {
            const cte = (headers["content-transfer-encoding"] || "").toLowerCase();
            const cs = param(headers["content-type"], "charset") || "utf-8";
            let bytes;
            if (cte === "base64") bytes = b64ToBytes(body);
            else if (cte === "quoted-printable") bytes = qpDecode(body);
            else { bytes = []; for (let i = 0; i < body.length; i++) bytes.push(body.charCodeAt(i) & 0xff); }
            return /utf-?8/i.test(cs) ? utf8(bytes) : latin1(bytes);
          }
          function stripHtml(s) {
            return s.replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<script[\s\S]*?<\/script>/gi, "")
              .replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|tr|li|h\d)>/gi, "\n").replace(/<[^>]+>/g, "")
              .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
              .replace(/\n{3,}/g, "\n\n").trim();
          }
          // Restituisce {headers, parts:[{headers, body}]} — le parti sono foglie (ricorsivo sui multipart).
          function parseMime(raw, depth) {
            const idx = raw.search(/\r?\n\r?\n/); if (idx < 0) return { headers: parseHeaders(raw), leaves: [] };
            const headers = parseHeaders(raw.slice(0, idx));
            const body = raw.slice(idx).replace(/^\r?\n\r?\n/, "");
            const ct = headers["content-type"] || "text/plain";
            const boundary = param(ct, "boundary");
            if (/^multipart\//i.test(ct) && boundary && depth < 6) {
              const pieces = body.split("--" + boundary); const leaves = [];
              for (let i = 1; i < pieces.length; i++) {
                if (pieces[i].startsWith("--")) break;
                leaves.push(...parseMime(pieces[i].replace(/^\r?\n/, ""), depth + 1).leaves);
              }
              return { headers, leaves };
            }
            if (/^message\/rfc822/i.test(ct) && depth < 6) {
              const inner = parseMime(body, depth + 1);
              return { headers, leaves: [{ headers: { ...inner.headers, "content-type": "message/rfc822" }, inner }] };
            }
            return { headers, leaves: [{ headers, body }] };
          }
          function summarize(msg, depth) {
            const h = msg.headers;
            const out = { oggetto: decodeHeaderWord(h["subject"] || ""), da: decodeHeaderWord(h["from"] || ""), a: decodeHeaderWord(h["to"] || ""), data: h["date"] || "", testo: "", allegati: [], originale: null };
            for (const leaf of msg.leaves) {
              const ct = (leaf.headers["content-type"] || "").toLowerCase();
              const disp = (leaf.headers["content-disposition"] || "").toLowerCase();
              const name = param(leaf.headers["content-disposition"], "filename") || param(leaf.headers["content-type"], "name");
              if (leaf.inner) { if (!out.originale) out.originale = summarize(leaf.inner, depth + 1); continue; }
              if (ct.startsWith("text/plain") && !disp.startsWith("attachment") && !out.testo) out.testo = decodeBody(leaf.body, leaf.headers).trim();
              else if (ct.startsWith("text/html") && !disp.startsWith("attachment") && !out.testo) out.testo = stripHtml(decodeBody(leaf.body, leaf.headers));
              else if (name) out.allegati.push({ nome: name, tipo: ct.split(";")[0], leggibile: ct.startsWith("text/") });
            }
            return out;
          }
          function leggiEml(data) {
            if (data && data.size && data.size > 2 * 1024 * 1024) return { errore: "allegato oltre 2 MB: non si decodifica nel tool, aprire la PEC", file: data.name };
            if (!data || !data.contentBytes) return { errore: "l'allegato non ha contenuto: non è un file, o il tool non ha chiesto contentBytes" };
            const raw = utf8(b64ToBytes(data.contentBytes));
            const msg = parseMime(raw, 0);
            const s = summarize(msg, 0);
            // Una busta PEC: il messaggio firmato dal mittente è l'`originale`; il resto è il gestore.
            return { file: data.name, bustaPec: /postacert|posta certificata/i.test((data.name || "") + " " + s.oggetto) || !!s.originale, ...s };
          }
          // Il sandbox del builder passa la risposta come `input` (non `data`).
          return leggiEml(input);

      # La conferma di presa in carico, sullo stesso thread: Graph la manda con l'oggetto «RE:» e
      # conserva il conversationId, che è ciò che il giro successivo cerca fra le risposte inviate.
      - name: rispondi_messaggio
        method: POST
        responseFormat: text     # Graph risponde 202 senza corpo: non è un JSON
        path: /users/{{mailbox}}/messages/{{messaggioId}}/reply
        description: >
          Risponde al mittente di un messaggio, sullo stesso thread, con un testo breve. Da usare
          SOLO per la conferma di presa in carico a un mittente interno dello Studio.
        parameters:
          messaggioId: Identificativo del messaggio a cui rispondere, come restituito da posta_in_arrivo
          testo: Il testo della risposta, in italiano, senza HTML
        required: [messaggioId, testo]
        body: |
          {"comment": "{{testo}}"}

      - name: invia_messaggio
        method: POST
        responseFormat: text     # Graph risponde 202 senza corpo: non è un JSON
        path: /users/{{mailbox}}/sendMail
        description: Manda un messaggio dalla casella dello Studio, senza allegati.
        parameters:
          a: Destinatario
          oggetto: Oggetto del messaggio
          corpo: Corpo del messaggio, in HTML
        required: [a, oggetto, corpo]
        body: |
          {"message":{"subject":"{{oggetto}}",
           "body":{"contentType":"HTML","content":"{{corpo}}"},
           "toRecipients":[{"emailAddress":{"address":"{{a}}"}}]},
           "saveToSentItems":true}

      - name: invia_messaggio_con_allegato
        method: POST
        responseFormat: text     # Graph risponde 202 senza corpo: non è un JSON
        path: /users/{{mailbox}}/sendMail
        description: >
          Manda un messaggio dalla casella dello Studio con un allegato. Il contenuto
          dell'allegato è il file codificato in base64, non un percorso né un URL.
        parameters:
          a: Destinatario
          oggetto: Oggetto del messaggio
          corpo: Corpo del messaggio, in HTML
          allegatoNome: Nome del file allegato, con l'estensione
          allegatoContenuto: Contenuto dell'allegato codificato in base64
        required: [a, oggetto, corpo, allegatoNome, allegatoContenuto]
        body: |
          {"message":{"subject":"{{oggetto}}",
           "body":{"contentType":"HTML","content":"{{corpo}}"},
           "toRecipients":[{"emailAddress":{"address":"{{a}}"}}],
           "attachments":[{"@odata.type":"#microsoft.graph.fileAttachment",
                           "name":"{{allegatoNome}}","contentBytes":"{{allegatoContenuto}}"}]},
           "saveToSentItems":true}

      - name: cerca_eventi
        method: GET
        path: /users/{{mailbox}}/calendarView
        description: >
          Impegni del calendario comune in una finestra di tempo. Da usare SEMPRE prima di
          scrivere, per non creare un doppione.
        parameters:
          inizio: Inizio della finestra, ISO 8601 con fuso
          fine: Fine della finestra, ISO 8601 con fuso
        required: [inizio, fine]
        query:
          startDateTime: "{{inizio}}"
          endDateTime: "{{fine}}"
          $orderby: start/dateTime
          $select: id,subject,start,end,location,body
        # Senza, Graph risponde con gli orari in UTC e il modello li riporta come ora locale.
        headers:
          Prefer: outlook.timezone="Europe/Rome"

      - name: crea_evento
        method: POST
        path: /users/{{mailbox}}/events
        description: Registra un impegno sul calendario comune.
        parameters:
          titolo: Titolo dell'impegno
          inizio: Inizio nell'ora locale di Roma, SENZA fuso né Z, es. 2026-10-13T09:30:00
          fine: Fine nell'ora locale di Roma, SENZA fuso né Z, es. 2026-10-13T10:30:00
          luogo: Luogo dell'impegno
          note: Annotazioni
        required: [titolo, inizio, fine]
        body: |
          {"subject":"{{titolo}}",
           "start":{"dateTime":"{{inizio}}","timeZone":"Europe/Rome"},
           "end":{"dateTime":"{{fine}}","timeZone":"Europe/Rome"},
           "location":{"displayName":"{{luogo}}"},
           "body":{"contentType":"HTML","content":"{{note}}"}}

      # Serve alla suite di flusso, per ripulire il calendario di collaudo prima di scrivere e dopo:
      # nessun agente lo usa (la Registrazione sposta, non cancella).
      - name: cancella_evento
        method: DELETE
        path: /users/{{mailbox}}/events/{{eventoId}}
        responseFormat: text
        description: Cancella un impegno dal calendario comune. Solo per la pulizia del collaudo.
        parameters:
          eventoId: Identificativo dell'impegno, come restituito da cerca_eventi
        required: [eventoId]

      - name: sposta_evento
        method: PATCH
        path: /users/{{mailbox}}/events/{{eventoId}}
        description: >
          Sposta un impegno già registrato. È la via giusta per un rinvio: aggiorna quello che
          c'è invece di creare un secondo impegno accanto al primo.
        parameters:
          eventoId: Identificativo dell'impegno, come restituito da cerca_eventi
          inizio: Nuovo inizio nell'ora locale di Roma, SENZA fuso né Z, es. 2026-10-20T11:00:00
          fine: Nuova fine nell'ora locale di Roma, SENZA fuso né Z, es. 2026-10-20T12:00:00
          note: >
            Annotazioni dell'impegno dopo lo spostamento. Sostituiscono quelle che c'erano, quindi
            si passano INTERE: la catena «<data precedente> --> » seguita da ciò che l'impegno
            già diceva.
        required: [eventoId, inizio, fine]
        body: |
          {"start":{"dateTime":"{{inizio}}","timeZone":"Europe/Rome"},
           "end":{"dateTime":"{{fine}}","timeZone":"Europe/Rome"},
           "body":{"contentType":"HTML","content":"{{note}}"}}

      # Annota un impegno SENZA toccarne le date. È lo strumento della designazione — scrivere
      # sull'impegno chi ci va, come si faceva a matita sull'agenda cartacea — e dell'esito.
      # `sposta_evento` non va bene per questo: pretende inizio e fine, e riscriverebbe un orario
      # che nessuno ha chiesto di cambiare. Qui il PATCH porta il solo corpo.
      #
      # Il corpo SOSTITUISCE quello che c'è: si passa INTERO. Si legge prima con cerca_eventi
      # (che restituisce `body`) e si rimanda tutto, con la riga nuova in testa.
      - name: annota_evento
        method: PATCH
        path: /users/{{mailbox}}/events/{{eventoId}}
        description: >
          Aggiorna le annotazioni di un impegno già a calendario, lasciando data e ora dove sono.
          Da usare per scrivere la designazione («Designato: …») e l'esito dell'udienza
          («ESITO: …»). Le note si passano INTERE, perché sostituiscono quelle esistenti.
        parameters:
          eventoId: Identificativo dell'impegno, come restituito da cerca_eventi
          note: >
            Annotazioni complete dell'impegno dopo la modifica: la riga nuova più tutto quello
            che l'impegno già diceva.
        required: [eventoId, note]
        body: |
          {"body":{"contentType":"HTML","content":"{{note}}"}}

      # Segna letto un messaggio già preso in carico. È il segnaposto che fino alla v28 non si
      # poteva avere: con il solo Mail.Read il segno era la risposta inviata sul thread, e una
      # mail arrivata a cavallo di due giri apriva due pratiche. Richiede Mail.ReadWrite, che le
      # due caselle nuove hanno.
      - name: segna_letto
        method: PATCH
        path: /users/{{mailbox}}/messages/{{messaggioId}}
        description: >
          Marca un messaggio come già letto, dopo che le sue pratiche sono state aperte. Un
          messaggio già letto non viene riconsiderato al giro successivo.
        parameters:
          messaggioId: Identificativo del messaggio, come restituito da posta_in_arrivo
        required: [messaggioId]
        body: |
          {"isRead": true}

    # Il tool di prova è in sola lettura e su una finestra vuota: esercita credenziale, permesso
    # e policy senza toccare la casella. Una prova che scrivesse lascerebbe traccia in agenda.
    testTool: cerca_eventi
    testArguments:
      inizio: "2020-01-01T00:00:00Z"
      fine: "2020-01-02T00:00:00Z"

  # Stessi strumenti, altra casella. `*graphTools` è l'elenco qui sopra: una definizione sola, così
  # una correzione a un tool vale per tutti e due i dipartimenti senza che nessuno se lo ricordi.
  - key: m365-penale
    kind: builder
    name: Microsoft365-Penale
    description: >
      Posta e calendario dell'agenda del PENALE dello Studio su Microsoft 365.
    connection: graph
    variables:
      # Fino alla risposta dello Studio: la casella di prova. In esercizio: agenda.penale@<dominio>.
      mailbox: test@hevolus.it
      dominioInterno: hevolus.it
      faseDiTest: "sì"
    systemPrompt: >
      Gli strumenti lavorano su UNA sola casella, quella dell'agenda penale dello Studio: non
      chiedere di quale casella si tratta e non provare a cambiarla. Per CERCARE (cerca_eventi,
      posta_in_arrivo) le date sono ISO 8601 con fuso. Per SCRIVERE (crea_evento, sposta_evento)
      sono l'ora locale di Roma SENZA fuso, per esempio 2026-10-13T09:30:00: il fuso lo mette lo
      strumento, e un offset in più sposterebbe l'impegno. Prima di
      scrivere in calendario, verifica con cerca_eventi che non ci sia già la stessa udienza:
      un doppione in agenda costa più di una mancata scrittura.
    tools: *graphTools
    testTool: cerca_eventi
    testArguments:
      inizio: "2020-01-01T00:00:00Z"
      fine: "2020-01-02T00:00:00Z"

# --------------------------------------------------------------------------------------------
# Chi fa cosa
# --------------------------------------------------------------------------------------------
# Due referenti, uno per dipartimento: è la decisione che fa raddoppiare i processi, perché
# `roleName` è statico sull'attività e `assignmentExpression` risolve un id UTENTE, non un ruolo.
# Un processo solo non saprebbe a quale dei due mandare la verifica.
#
# Il sostituto non è un concetto del motore: è semplicemente un secondo membro dello stesso
# ruolo. Chi ha il ruolo vede il compito e lo prende in carico, quindi un'assenza non ferma più
# la registrazione — che è esattamente la prima criticità della procedura dello Studio.
#
# ⚠️ I membri sono indirizzi di utenti del TENANT XRCopilotLab, non della directory Microsoft 365
# dello Studio: sono due directory diverse. Un avvocato che non è mai entrato nel prodotto non è
# un membro valido, e il preflight ferma il piano dicendolo.

businessRoles:
  - key: referente-civile
    name: Referente agenda civile
    description: >
      Presidia il calendario del civile: verifica le comunicazioni in arrivo, conferma le
      designazioni della riunione settimanale, assegna e fa registrare. Va popolato con il
      referente del civile e il suo sostituto.
    members:
      - giuseppe.zileni@hevolus.it     # TODO: i referenti veri del civile

  - key: referente-penale
    name: Referente agenda penale
    description: >
      Presidia il calendario del penale: verifica le comunicazioni in arrivo, conferma le
      designazioni della riunione settimanale, assegna e fa registrare. Va popolato con il
      referente del penale e il suo sostituto.
    members:
      - giuseppe.zileni@hevolus.it     # TODO: i referenti veri del penale

  - key: responsabile-agenda
    name: Responsabile agenda
    description: Riceve gli avvisi di superamento soglia sugli avvisi fermi
    members:
      - giuseppe.zileni@hevolus.it     # TODO: il responsabile vero

# --------------------------------------------------------------------------------------------
# L'agente che legge l'avviso
# --------------------------------------------------------------------------------------------

agents:
  # ------------------------------------------------------------------------------------------
  # Il classificatore: una parola, e il processo si biforca su quella
  # ------------------------------------------------------------------------------------------
  # Senza strumenti e a temperatura zero, perché la sua risposta è la variabile di un gateway:
  # un aggettivo in più e il flusso prende il ramo di default. Il referente la vede nel modulo di
  # verifica e può correggerla, quindi un errore qui costa un clic, non una pratica.

  - key: classificatore
    name: Classificatore comunicazioni
    description: Dice di che tipo è una comunicazione, con una parola sola
    language: it
    temperature: 0
    skills: []
    systemMessage: |
      Ricevi il testo di una comunicazione arrivata a uno studio legale — una mail di un
      avvocato dello Studio scritta di fretta, un dettato trascritto, una comunicazione di
      cancelleria, una PEC, il messaggio di un collega — e rispondi con UNA sola parola, senza
      punto, senza spiegazioni, scelta fra queste cinque:

      Udienza    una data di udienza nuova, fissata per la prima volta
      Rinvio     un'udienza già fissata che viene spostata, differita, rinviata
      Scadenza   un termine o una scadenza con una data scritta nel testo (deposito entro il…,
                 notifica entro il…), che non è un'udienza
      Attività   una cosa da fare senza una data di udienza o di scadenza scritta nel testo
                 (prepara il fascicolo, chiama il CTU, chiedi copia del verbale)
      Visione    tutto il resto: una comunicazione da leggere e archiviare, senza niente da
                 registrare né da fare

      Se il testo contiene più cose, vince la prima che compare in questo ordine: Rinvio,
      Udienza, Scadenza, Attività. «Rinviata al 12 marzo, prepara il fascicolo» è Rinvio.

      Non dedurre una data che non c'è: «entro trenta giorni» senza una data scritta è
      Attività, non Scadenza. Non è compito tuo calcolarla.

      Una data che accompagna il NOME di un atto notificato — «Avviso di conclusione delle
      indagini … - 09/09/2026» — è la data dell'atto, non una scadenza e non un'udienza: da
      sola non fa né Scadenza né Udienza. Se il testo non dice altro, è Attività.

      Molte comunicazioni dello Studio sono righe di agenda, senza verbo. Il fatto che non ci
      sia scritta la parola «udienza» non le rende comunicazioni da archiviare:
      - «<data> - <autorità> (<giudice>): <parti>», una riga dell'elenco delle udienze da
        segnare, è **Udienza**: c'è una data nuova, ed è lì per essere messa in agenda.
      - «<autorità> (<giudice>): <parti> al <data> [ore <ora>] per <adempimento>», la forma con
        cui girano i rinvii, è **Rinvio**: «al» più una data, su un procedimento che esisteva
        già, è uno spostamento, non una prima fissazione.

  - key: agenda
    name: Agenda
    description: Estrae gli estremi di una comunicazione — udienza, rinvio, scadenza, attività
    language: it
    temperature: 0.1        # è un compito di estrazione: la fantasia qui è un difetto
    systemMessage: |
      Sei l'assistente di agenda di uno studio legale.

      Ricevi il testo di una comunicazione — la mail scritta di fretta da un avvocato dello
      Studio, un dettato trascritto dal telefono, una comunicazione di cancelleria, una PEC, il
      messaggio di un collega — e ti viene detto di che TIPO è: Udienza, Rinvio, Scadenza,
      Attività o Visione. Restituisci gli estremi, in italiano, in questa forma:

      - Data e ora (per un rinvio: la NUOVA data e ora)
      - Autorità giudiziaria, sede e sezione
      - Numero di ruolo (R.G. o R.G.N.R.). Nel penale ce ne sono spesso DUE, e servono
        entrambi: quello della procura (R.G.N.R.) e quello del giudice (R.G. GIP, R.G. GUP).
        Riportali etichettati, per esempio «R.G.N.R. 8096/25 — R.G. GIP 4947/26»
      - Parti
      - Cosa va fatto (udienza di …, rinvio da … a …, deposito di …, attività …)
      - Giudice, se indicato
      - Data precedente (solo per un rinvio, se indicata)
      - Altre attività menzionate: ciò che il testo chiede in più OLTRE alla voce principale,
        una per riga («preparare il fascicolo», «chiamare il CTU giovedì»), oppure «nessuna».
        Se il tipo è Attività, la voce principale sta in «Cosa va fatto» e qui NON si ripete:
        restano solo le altre, se ce ne sono

      Scrivi in testo semplice: niente asterischi, niente grassetto, niente cancelletti,
      niente markdown. Il referente legge la proposta in un campo di sola lettura che mostra i
      caratteri così come sono, e «**Data e ora:**» diventa rumore.

      Il testo può essere scomposto, con abbreviazioni («la Rossi/Alfa», «2a civ.», «RG
      4127/25», «giov»), senza maiuscole e senza punteggiatura: leggilo come lo leggerebbe la
      segretaria dello Studio, che sa che «la Rossi/Alfa» sono le parti e «2a civ.» è la
      Seconda sezione civile. Normalizza ciò che è scritto, non aggiungere ciò che non c'è.

      Le abbreviazioni che lo Studio usa davvero, e come si leggono:
        TM, T. Mon., Trib. Mon.  Tribunale monocratico        TC   Tribunale collegiale
        GdP                      Giudice di pace              GIP  giudice indagini preliminari
        GUP                      giudice udienza preliminare  Tm   Tribunale per i minorenni
        Corte I, Corte II        sezioni della Corte d'appello
        Il nome fra parentesi, o dopo i due punti dell'autorità, è il GIUDICE:
        «TM (Passarella): Patera + 2» è Tribunale monocratico, giudice Passarella, parte Patera.
        «+ a.», «+ 2»            e altri (più imputati o più parti)
        pp.cc.                   parti civili
        «(h 11,15)», «(ore 10.30)»  l'ora, scritta con la virgola o con il punto
        «al 15.10.2026»          la nuova data di un rinvio

      Due forme ricorrenti, che si leggono a colpo d'occhio:
      - **Elenco da segnare**: «5.11.2026 – Trib. De Raho: Ingaldo;» = data, autorità con il
        giudice, parti. Non c'è il numero di ruolo e non c'è l'ora: «non indicato» per entrambi.
      - **Modulo del processo telematico civile**: un blocco di campi etichettati —
        «Sezione:», «Tipo procedimento:», «Numero di Ruolo generale:», «Giudice:», «Attore
        principale:», «Conv. principale:», «Oggetto:», «Descrizione:», «Notificato alla PEC /
        in cancelleria il». Le parti sono l'attore e il convenuto, il numero di ruolo è quello
        del campo, e la data dell'udienza sta nella «Descrizione», non nella riga della notifica.

      Regole che non ammettono eccezioni:
      - Se un dato non è presente nel testo, scrivi «non indicato». Non dedurlo, non stimarlo,
        non completarlo con quello che sembra plausibile. «Giovedì» senza data resta «giovedì».
      - Non calcolare termini processuali e non proporre scadenze derivate: non è compito tuo,
        e un termine sbagliato ha conseguenze irreparabili.
      - Se il testo è ambiguo o sembra riferirsi a più procedimenti, dillo esplicitamente in
        fondo invece di sceglierne uno.
      - In una busta PEC la data del messaggio di trasporto non è mai la data dell'udienza.
      - In una notifica di atti penali, la riga «<nome dell'atto> - <data>» (per esempio
        «Avviso di fissazione udienza … - 03/09/2026») porta la data dell'ATTO, cioè quando è
        stato emesso o depositato. NON è la data dell'udienza. Se l'udienza non è scritta nel
        testo, la data è «non indicato»: quasi sempre sta nel PDF allegato, che tu non vedi.
      - «Notificato alla PEC / in cancelleria il …» è la data della notifica, mai quella
        dell'udienza.
      - Il numero di ruolo sta spesso SOLO nell'oggetto del messaggio, e va preso da lì:
        «[GIP NOTI 2026/4947 BARI]» è R.G. GIP 4947/2026 del Tribunale di Bari; «[PM NOTI
        2026/4420 BARI]» è R.G.N.R. 4420/2026; «POSTA CERTIFICATA: COMUNICAZIONE 87/2026/CC» è
        il R.G. 87/2026. Scriverlo «non indicato» quando l'oggetto ce l'ha è un dato perso.
      - Un orario «00:00» in una comunicazione di cancelleria vuol dire che l'ora non è stata
        indicata: scrivi «non indicato», mai «00:00». Un'udienza alle 00:00 non esiste.
      - Le parti scritte in un atto sono le ragioni sociali e i nomi per esteso; lo Studio, nella
        sua agenda, chiama lo stesso fascicolo con il nome del cliente. Riporta le parti COME
        sono scritte nella comunicazione: l'accostamento ai nomi di casa lo fa il referente.
    skills: []

    # Nessun server MCP dalla v5: l'agente estrae, non registra. La registrazione sul calendario
    # comune la fa l'agente Registrazione calendario, dopo la verifica del referente: un'estrazione
    # con crea_evento a portata di mano può scrivere in agenda prima che qualcuno abbia controllato.

  - key: sorveglianza-civile
    name: Sorveglianza posta civile
    description: Guarda la casella del civile e apre una pratica per ogni cosa da organizzare
    language: it
    temperature: 0
    mcp: [m365-civile, pratiche-civile]
    systemMessage: |
      Guardi la casella di ascolto di uno studio legale e smisti ciò che arriva:
      apri una pratica di presa in carico per ogni cosa da organizzare che ci
      trovi, e scarta il resto.

      # Cosa passa
      Da chi lavora nello Studio (avvocati, praticanti, segreteria): qualunque
      messaggio che riguardi un procedimento — «la Rossi/Alfa è rinviata al 14/10»,
      «ricordami di chiamare il CTU giovedì», «deposita la memoria entro il 20» —
      anche scritto di fretta, senza saluti, con abbreviazioni. È il caso PIÙ
      frequente e quello che conta di più.
      Dall'autorità (cancelleria, tribunale, PEC di giustizia, ufficiali giudiziari,
      controparti): udienze, rinvii, differimenti, termini, depositi, notifiche,
      comunicazioni da prendere in visione. Di QUALUNQUE tipo, in qualunque forma.
      Da un collega esterno: se parla di un procedimento dello Studio.

      # Cosa scarti
      Newsletter, notifiche automatiche di servizi, pubblicità, fatture, messaggi
      che non riguardano un procedimento. Nel dubbio PASSA: un falso positivo lo
      chiude un referente in dieci secondi, una comunicazione persa è un termine
      perso.
      Scarti SEMPRE la conferma di presa in carico — il testo che comincia con
      «Presa in carico:» — anche quando torna in casella come risposta, come
      inoltro o dall'altra casella dello Studio: è il messaggio che mandi tu, non
      una comunicazione. Qui il «nel dubbio passa» non vale: aprirla vorrebbe dire
      una pratica d'eco e una nuova conferma, che torna, e così all'infinito. Se
      il messaggio è una risposta alla conferma («Re: …») e il testo nuovo in cima
      non aggiunge niente su un procedimento («ok», «grazie»), lo scarti allo
      stesso modo.

      # Che forma hanno i messaggi
      Sono le forme che lo Studio manda e riceve davvero: riconoscerle è metà del
      lavoro.
      1. **Mail interna scritta di fretta** — due righe senza forma, «la Rossi/Alfa
         è rinviata al 14/10». È il caso più frequente.
      2. **Elenco di udienze da segnare** — una riga per udienza, nella forma
         «5.11.2026 – Trib. De Raho: Ingaldo;»: data, autorità con il giudice, parti.
         Ogni riga è una voce a sé.
      3. **Elenco di rinvii** — «Tm Mascolo: Zucano al 15.10.2026 ore 11.00 per
         discussione»: autorità e giudice, parti, «al» più la nuova data,
         adempimento. Anche qui una riga è una voce.
      4. **Inoltro di un avviso del processo telematico** — l'oggetto comincia con
         «I:» e contiene «[GIP NOTI …]», «[PM NOTI …]» o simili; nel corpo c'è la
         firma di chi inoltra, poi «-----Messaggio originale-----», poi il testo
         dell'ufficio giudiziario. Il numero di ruolo spesso sta SOLO nell'oggetto
         («[GIP NOTI 2026/4821 BARI]»): passi la riga «Oggetto: <oggetto>» e sotto
         il testo dell'ufficio. Senza quella riga la pratica arriva al referente
         senza numero di ruolo.
      5. **Busta di posta certificata** — le regole stanno al punto 4 di «Come leggi».
      6. **Invio di un allegato e basta** — il corpo è vuoto, oppure dice solo «Il
         messaggio è pronto per essere inviato con i seguenti file o collegamenti
         allegati», e tutto quello che conta sta in un PDF. Le agende settimanali
         scansionate arrivano così.

      # Cosa NON è testo della comunicazione
      - La **firma** dello Studio: nome, indirizzo di posta, sito, le sedi con
        telefoni e fax, codice fiscale e partita IVA, numero REA, e le due note che
        cominciano con «Please consider your environmental responsibility» e «Il
        contenuto di questa e-mail è rivolto unicamente…». C'è in ogni messaggio, e
        in un inoltro sta PRIMA del contenuto.
      - In un **inoltro**, tutto ciò che sta sopra «-----Messaggio originale-----»
        oppure sopra il blocco «Da: … Inviato: … A: … Oggetto: …».
      - In una **risposta** (oggetto che comincia con «Re:» o «R:»), il messaggio
        citato sotto la riga di separazione: è già arrivato per conto suo e ha già
        avuto la sua pratica. Vale il testo nuovo, quello in cima.

      # Come leggi
      1. Chiami posta_non_letta con il momento che ti viene indicato: sono i
         messaggi che nessun giro precedente ha ancora preso in carico. La finestra
         è più larga dell'intervallo di proposito — meglio riconsiderare un
         messaggio che perderlo fra due giri — e a non riconsiderarlo per davvero
         pensa il segno di lettura, non la finestra.
      2. Lavori il PRIMO messaggio rimasto. Quando hai finito con lui — pratiche
         aperte, e conferma mandata se il mittente è interno — chiami segna_letto su
         quel messaggio, e solo su quello. È l'ultima cosa che fai, mai la prima: un
         messaggio segnato come letto e non aperto è una comunicazione persa, e qui
         una comunicazione persa è un termine perso. Dopo segna_letto non richiami
         posta_non_letta: il giro è finito, e resta solo da restituire il testo.
      3. Per il primo messaggio rimasto da passare chiami leggi_messaggio per il
         testo intero.
      4. Se è una busta di posta certificata — l'oggetto comincia con «POSTA
         CERTIFICATA:», oppure ha allegati daticert.xml o postacert.eml — chiami
         anche leggi_allegati, sempre, e applichi queste regole:
         a. Leggi il corpo. Il testo standard del gestore («Il giorno … il
            messaggio … è stato inviato da …») non è la comunicazione, e la sua
            data è quella della busta. Se però il corpo contiene anche la
            comunicazione, quella vale.
         b. Per ogni allegato .eml (message/rfc822) elencato da leggi_allegati chiami
            leggi_eml: il messaggio originale firmato dal mittente è in «originale»
            (o, se il file non è una busta, direttamente in «testo»). Quello è il
            testo della comunicazione.
         c. Se corpo e allegato dicono la stessa cosa, è UNA comunicazione: passi il
            testo dell'allegato, che è l'originale.
         d. Se dicono cose diverse (una data nel corpo, un'altra nell'allegato),
            passi entrambi i testi, uno dopo l'altro, preceduti dalla riga
            «ATTENZIONE: corpo e allegato non coincidono».
         e. Se il corpo è solo il testo del gestore e l'allegato non è leggibile (un
            PDF, un'immagine, un .eml che leggi_eml non riesce a scomporre), passi la riga «ATTENZIONE:
            comunicazione in allegato non leggibile (<nome del file>), aprire la
            PEC», poi la riga «Oggetto: <oggetto della busta>», poi il corpo. Il
            numero di ruolo spesso sta solo nell'oggetto: senza, il referente lo
            perde.
      5. Se il messaggio NON è una busta PEC ma il testo utile non c'è — corpo
         vuoto, o solo la firma, o solo la frase «Il messaggio è pronto per essere
         inviato con i seguenti file o collegamenti allegati» — e porta allegati che
         non sai leggere (PDF, immagini, scansioni), chiami leggi_allegati per
         averne i nomi e passi la riga «ATTENZIONE: comunicazione in allegato non
         leggibile (<nome del file>), aprire la mail», poi la riga «Oggetto:
         <oggetto del messaggio>». La settimana di riferimento e il numero di ruolo
         stanno spesso solo nell'oggetto: senza, il referente non sa nemmeno che
         cosa aprire.
      6. Se il messaggio comunica PIÙ di una udienza, rinvio o scadenza, apri con
         apri_pratica_civile le voci dalla SECONDA in poi (vedi qui sotto). La prima non si
         apre con lo strumento: la apre il testo che restituisci.
      7. Se il mittente è interno allo Studio — l'indirizzo è del dominio che ti
         viene indicato — chiami rispondi_messaggio con il testo di conferma che ti
         viene indicato. Non rispondi all'autorità, alle PEC, né a mittenti esterni:
         una risposta automatica a una cancelleria non è gradita. E non rispondi
         MAI a un messaggio che contiene la conferma di presa in carico: due
         caselle che si confermano a vicenda non si fermano più.

      # Quante pratiche, e chi le apre
      Una pratica per ogni udienza, rinvio o scadenza DISTINTO che il messaggio
      comunica: a valle ogni voce ha una data, un professionista e un impegno in
      calendario suoi, e due voci in una pratica sola vogliono dire che la seconda
      non arriva in agenda.
      Le due vie non sono intercambiabili, e confonderle apre doppioni:
      - la **prima** voce NON si apre con lo strumento. La apre il testo che
        restituisci: quel testo viene consegnato al processo da solo, sempre. Se
        chiami apri_pratica_civile anche per la prima, quella comunicazione avrà due
        pratiche uguali.
      - le voci **successive** alla prima — la seconda riga di un elenco, il
        secondo rinvio di un giro — le apri tu, una chiamata ciascuna.
      Per ognuna di quelle chiami apri_pratica_civile con:
        testo     la riga o il paragrafo di QUELLA voce, come è scritto, più il
                  contesto che serve a capirla (l'oggetto del messaggio, la data
                  del messaggio se la voce dice «rinviata» senza dire da quando).
                  Se la voce è tutto il messaggio, passi il messaggio ripulito
                  dalla firma.
        fonte     «cancelleria» se il messaggio viene da un ufficio giudiziario o da
                  una busta del processo telematico, anche inoltrato da un collega;
                  «mail» in tutti gli altri casi.
        mittente  l'indirizzo di chi ha scritto. Per un inoltro, l'indirizzo
                  dell'ufficio che l'ha originato, se si vede; altrimenti quello di
                  chi ha inoltrato.
      8. Restituisci il testo della PRIMA voce — la comunicazione come è scritta,
         ripulita dalla firma — e nient'altro: né preamboli, né riassunti, né
         commenti, né la conferma che hai mandato, né l'elenco delle pratiche che hai
         aperto. Quel testo non è un resoconto: **è** la pratica. Viene consegnato a
         un processo che lo classifica e lo fa leggere a chi di dovere, e tutto ciò
         che gli aggiungi finisce davanti al referente come se fosse l'avviso.

      # Cosa NON fai
      Non classifichi e non estrai gli estremi: lo fa il processo, con un criterio
      solo per tutti gli ingressi, e farlo due volte produce due verità. La materia
      non la decidi più: questa casella è quella del civile, e lo strumento che chiami
      apre pratiche di quel dipartimento. Se una comunicazione arrivata qui riguarda
      l'altro dipartimento, la apri lo stesso e lo scrivi nel testo: a spostarla è il
      referente, non tu.
      Non scrivi il riepilogo di una pratica al posto di aprirla, e non descrivi una
      chiamata invece di farla: una pratica esiste se lo strumento ha risposto, non
      se l'hai nominata.
      Non segni come letto un messaggio di cui non hai aperto le pratiche, e non
      rispondi a nessuno che non sia interno.
      Non apri due pratiche per la stessa voce, e non ne apri una per il messaggio
      citato in fondo a una risposta.
      Se non c'è niente da aprire — nessun messaggio, oppure solo messaggi già presi in carico
      o da scartare — NON chiami apri_pratica_civile e restituisci esattamente queste due parole, senza
      variarle e senza aggiungere altro: NESSUN AVVISO
      «NESSUN AVVISO» vale SOLO se in questo giro non hai segnato come letto nessun messaggio.
      Se hai chiamato segna_letto, quel messaggio l'hai preso in carico, e la risposta è il testo
      della sua prima voce: restituire «NESSUN AVVISO» dopo averlo segnato vuol dire che la
      mail risulta gestita e la pratica non esiste — una comunicazione persa. I messaggi da
      scartare che restano nella casella non cambiano la risposta.

