            # una chiave sola il select arrivava vuoto. È su `tipo` che il flusso si biforca.
            - key: tipoProposto
              label: Tipo proposto dall'assistente
              type: text
              context: true
            - key: tipo
              label: Di che si tratta
              type: select
              required: true
              options: [Udienza, Rinvio, Scadenza, Attività, Visione]
              description: >
                Udienza nuova, rinvio di una già fissata, scadenza con data scritta, attività da
                fare, o solo da prendere visione. Di norma è il tipo proposto qui sopra.
            - key: datiCompleti
              label: Estremi completi e corretti
              type: bool
            - key: dataUdienza
              label: Data (udienza, nuova udienza, o scadenza)
              type: date
            - key: oraUdienza
              label: Ora
              type: text
            - key: sede
              label: Sede e sezione
              type: text
            - key: tipoAdempimento
              label: Cosa va fatto
              type: text
              description: Udienza di comparizione, deposito memoria, notifica, chiamare il CTU…

        - id: chiarimenti
          type: Task
          name: Richiedi chiarimenti
          performer: HumanOnly
          roleName: Referente agenda penale
          expectedDurationMinutes: 15
          maxLeadTimeMinutes: 2880       # due giorni: è il passo che si dimentica più spesso
          form:
            - key: proposta
              label: Estremi proposti
              type: textarea
              context: true
            - key: richiestaInviata
              label: Richiesta di chiarimento inviata
              type: bool
              required: true
            - key: noteChiarimento
              label: A chi e cosa è stato chiesto
              type: textarea

        # --- Presa visione: c'è da leggere, non da registrare ---
        - id: visione
          type: Task
          name: Presa visione del referente
          performer: HumanOnly
          roleName: Referente agenda penale
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 1440
          form:
            - key: proposta
              label: Comunicazione
              type: textarea
              context: true
            - key: presaVisione
              label: Presa visione
              type: bool
              required: true
            - key: noteVisione
              label: Annotazioni
              type: textarea

        # --- Udienza nuova, scadenza, attività: si assegna a una persona ---
        - id: assegna
          type: Task
          name: Assegna al professionista
          performer: HumanOnly
          roleName: Referente agenda penale
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 1440
          form:
            - key: tipo
              label: Di che si tratta
              type: text
              context: true
            - key: dataUdienza
              label: Data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: professionista
              label: Professionista incaricato
              type: user
              required: true
              description: Riceverà il compito direttamente nella sua lista

        # Attività senza data: un compito alla persona, niente calendario.
        - id: compito-attivita
          type: Task
          name: Attività da fare
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: proposta
              label: Cosa va fatto
              type: textarea
              context: true
            - key: tipoAdempimento
              label: Attività
              type: text
              context: true
            - key: fatto
              label: Fatto
              type: bool
              required: true
            - key: noteAttivita
              label: Esito o annotazioni
              type: textarea

        - id: registra
          type: Task
          name: Registra sul calendario comune
          # Udienza nuova e scadenza: lo stesso agente, il tipo nel prompt. Sta PRIMA della
          # conferma del professionista perché la conferma serva anche a questo.
          performer: Automated
          agentTaskName: Registrazione udienza penale
          outputVariable: esitoRegistrazione
          expectedDurationMinutes: 2
          # Agente con server MCP dentro un processo: è esattamente il caso dell'issue #1000. Senza
          # soglia, una registrazione mai tornata lascerebbe l'udienza fuori dall'agenda in silenzio.
          maxLeadTimeMinutes: 30

        - id: conferma
          type: Task
          name: Conferma del professionista
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: tipo
              label: Di che si tratta
              type: text
              context: true
            - key: dataUdienza
              label: Data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: tipoAdempimento
              label: Cosa va fatto
              type: text
              context: true
            - key: proposta
              label: Estremi e altre attività menzionate
              type: textarea
              context: true
            - key: esitoRegistrazione
              label: Calendario comune
              type: textarea
              context: true
              description: >
                Cosa ha fatto l'assistente sul calendario. La prima riga dice tutto: REGISTRATO,
                GIÀ PRESENTE o NON REGISTRATO — in quest'ultimo caso NON è in agenda.
            - key: presaVisione
              label: Presa visione
              type: bool
              required: true
            - key: terminiDaPresidiare
              label: Termini da presidiare
              type: textarea
              description: I termini collegati, scritti dal professionista.

        # --- Rinvio: si sposta l'impegno che c'è, non se ne crea un altro ---
        - id: aggiorna
          type: Task
          name: Indica l'udienza da spostare
          performer: HumanOnly
          roleName: Referente agenda penale
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 480
          form:
            - key: dataUdienza
              label: Nuova data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: udienzaPrecedente
              label: Udienza da spostare
              type: text
              required: true
              description: Link all'evento a calendario, oppure numero di ruolo e data precedente
            - key: professionista
              label: Professionista che segue il fascicolo
              type: user
              required: true
              description: Riceverà l'avviso del rinvio nella sua lista

        - id: sposta
          type: Task
          name: Sposta l'udienza sul calendario comune
          performer: Automated
          agentTaskName: Spostamento udienza penale
          outputVariable: esitoSpostamento
          expectedDurationMinutes: 2
          maxLeadTimeMinutes: 30          # vedi «registra»: stesso agente, stesso rischio (#1000)

        - id: avvisa-rinvio
          type: Task
          name: Avviso del rinvio al professionista
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: dataUdienza
              label: Nuova data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: udienzaPrecedente
              label: Udienza spostata
              type: text
              context: true
            - key: proposta
              label: Estremi e altre attività menzionate
              type: textarea
              context: true
            - key: esitoSpostamento
              label: Calendario comune
              type: textarea
              context: true
              description: >
                SPOSTATO: l'impegno è sulla nuova data. NON REGISTRATO: l'impegno precedente non è
                stato trovato, e il calendario va sistemato a mano.
            - key: presaVisioneRinvio
              label: Presa visione del rinvio
              type: bool
              required: true
            - key: terminiDaPresidiare
              label: Termini da presidiare
              type: textarea
              description: >
                Sulla NUOVA data: un rinvio sposta anche i termini collegati, ed è il caso in cui
                è più facile dimenticarne uno.

        - id: fine
          type: End
          name: Pratica chiusa

      gateways:
        - id: filtro
          type: Exclusive
          name: C'è una comunicazione?
        - id: completezza
          type: Exclusive
          name: Estremi completi?
        - id: smista
          type: Exclusive
          name: Di che si tratta?
        - id: dopo-assegnazione
          type: Exclusive
          name: Va in calendario?

      # Le condizioni su `tipo` confrontano per stringa senza distinguere le maiuscole. Il flusso
      # senza condizione è il default, e in entrambi i gateway porta a un compito UMANO: da
      # «smista» all'assegnazione, da «dopo-assegnazione» all'attività. Un valore imprevisto del
      # classificatore finisce davanti a una persona, mai davanti all'agente che scrive in agenda.
      flows:
        - from: start
          to: filtro
        - from: filtro
          to: nessun-avviso
          condition: { var: testoAvviso, op: eq, value: NESSUN AVVISO }
          label: nessuna comunicazione
        - from: filtro
          to: classifica
          label: comunicazione
        - from: classifica
          to: estrai
        - from: estrai
          to: verifica
        - from: verifica
          to: completezza
        - from: completezza
          to: chiarimenti
          condition: { var: datiCompleti, op: eq, value: false }
          label: da chiarire
        - from: chiarimenti
          to: verifica
        - from: completezza
          to: smista
          label: completi
        - from: smista
          to: aggiorna
          condition: { var: tipo, op: eq, value: Rinvio }
          label: rinvio
        - from: smista
          to: visione
          condition: { var: tipo, op: eq, value: Visione }
          label: presa visione
        - from: smista
          to: assegna
          label: udienza, scadenza, attività
        - from: visione
          to: fine
        - from: assegna
          to: dopo-assegnazione
        # Le condizioni portano al calendario; il default è il compito a una persona. Così un
        # valore imprevisto del classificatore (un accento perso, una parola in più) finisce
        # davanti a qualcuno, non davanti all'agente che scrive in agenda.
        - from: dopo-assegnazione
          to: registra
          condition: { var: tipo, op: eq, value: Udienza }
          label: udienza
        - from: dopo-assegnazione
          to: registra
          condition: { var: tipo, op: eq, value: Scadenza }
          label: scadenza
        - from: dopo-assegnazione
          to: compito-attivita
          label: attività
        - from: compito-attivita
          to: fine
        - from: registra
          to: conferma
        - from: conferma
          to: fine
        - from: aggiorna
          to: sposta
        - from: sposta
          to: avvisa-rinvio
        - from: avvisa-rinvio
          to: fine

  # ------------------------------------------------------------------------------------------
  # La designazione, e l'esito che ne deriva
  # ------------------------------------------------------------------------------------------
  # Il processo che mancava, e che il cliente ha indicato come «il punto di partenza»: la
  # riunione settimanale decide chi va a ciascuna udienza, e da quella designazione nasce
  # l'obbligo di raccontare com'è andata entro la giornata.
  #
  # Un'istanza per udienza designata, non per riunione: a valle ogni udienza ha una persona, una
  # data e un impegno suoi, e un compito che deve arrivare a UN professionista. Un'istanza sola
  # per l'intera riunione non saprebbe a chi mandare venti compiti diversi — il motore non ha
  # attività multi-istanza.
  #
  # Quello che questo processo NON fa: creare l'impegno. L'udienza della settimana prossima è già
  # a calendario, ce l'ha messa la presa in carico quando è arrivato l'avviso. Qui si annota chi
  # ci va, come si faceva a matita sull'agenda cartacea. Se l'impegno non si trova, l'agente lo
  # dice e non inventa: il referente lo legge nel compito dell'esito e sistema a mano.

  - key: designazione-civile
    publish: true
    owners:
      - giuseppe.zileni@hevolus.it     # TODO: destinatario vero degli alert di soglia
    starterRoles:
      - referente-civile
    webhook:
      enabled: true               # per l'ingresso dal dettato in chat
    spec:
      version: 1
      name: Designazione ed esito dell'udienza (civile)
      description: >
        Dalla riunione settimanale del civile: chi va a quale udienza, l'annotazione sul
        calendario comune, e l'esito che il designato comunica entro la giornata — da cui,
        se l'udienza è stata rinviata, riparte da sola la presa in carico.
      criticality: High
      dataSensitivity: Confidential

      activities:
        - id: start
          type: Start
          name: Designazione ricevuta
          form:
            - key: testoRiga
              label: Riga della designazione
              type: textarea
              required: true
              description: Come è stata dettata in riunione, senza riscriverla
            - key: dataUdienza
              label: Data dell'udienza
              type: date
              required: true
            - key: oraUdienza
              label: Ora
              type: text
            - key: sede
              label: Autorità, sede e sezione
              type: text
            - key: parti
              label: Parti
              type: text
            - key: fascicolo
              label: Fascicolo o numero di ruolo
              type: text
            - key: professionistaProposto
              label: Professionista designato in riunione
              type: text
            - key: materia
              label: Materia
              type: select
              options: [Penale, Civile]
            - key: fonte
              label: Da dove arriva
              type: select
              options: [riunione, chat, altro]

        # Un clic per designazione: il referente sceglie la persona con il selettore utente —
        # `assignmentExpression` risolve un id UTENTE, e un nome dettato non assegna niente — e
        # ricopia il nome per il calendario. Sono due campi e non uno per la ragione già vista
        # con `tipoProposto`/`tipo` (v11): un campo modificabile non viene precompilato dal
        # caseData, quindi la proposta si mostra in sola lettura accanto al campo da compilare.
        - id: conferma
          type: Task
          name: Conferma della designazione
          performer: HumanOnly
          roleName: Referente agenda civile
          expectedDurationMinutes: 2
          maxLeadTimeMinutes: 1440
          form:
            - key: testoRiga
              label: Riga della designazione
              type: textarea
              context: true
            - key: dataUdienza
              label: Data dell'udienza
              type: date
              context: true
            - key: oraUdienza
              label: Ora
              type: text
              context: true
            - key: sede
              label: Autorità, sede e sezione
              type: text
              context: true
            - key: parti
              label: Parti
              type: text
              context: true
            - key: professionistaProposto
              label: Designato in riunione
              type: text
              context: true
            - key: professionista
              label: Professionista incaricato
              type: user
              required: true
              description: Riceverà il compito di comunicare l'esito, il giorno dell'udienza
            - key: professionistaNome
              label: Nome da scrivere in agenda
              type: text
              required: true
              description: >
                Di norma è il designato qui sopra. In calendario va il nome, mai un codice.
            - key: designazioneConfermata
              label: Data, autorità e parti sono corrette
              type: bool
              required: true

        - id: correzione
          type: Task
          name: Correggi gli estremi della designazione
          performer: HumanOnly
          roleName: Referente agenda civile
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 1440
          form:
            - key: testoRiga
              label: Riga della designazione
              type: textarea
              context: true
            - key: dataUdienza
              label: Data dell'udienza
              type: date
              required: true
            - key: oraUdienza
              label: Ora
              type: text
            - key: sede
              label: Autorità, sede e sezione
              type: text
            - key: parti
              label: Parti
              type: text
            - key: fascicolo
              label: Fascicolo o numero di ruolo
              type: text

        - id: abbina
          type: Task
          name: Annota la designazione sul calendario
          performer: Automated
          agentTaskName: Abbinamento designazione civile
          outputVariable: esitoAbbinamento
          expectedDurationMinutes: 2
          # Agente con server MCP dentro un processo: è il caso dell'issue #1000, dove un'esecuzione
          # che non torna lascia il token fermo in silenzio. La soglia lo rende visibile.
          maxLeadTimeMinutes: 30

        # Il compito compare nella lista del designato appena la designazione è confermata, cioè
        # fino a una settimana prima dell'udienza: è esattamente ciò che il cliente chiede — «il
        # sistema sappia che nella giornata di lunedì Andrea sarà in udienza».
        #
        # ⚠️ La soglia qui NON è la scadenza. `maxLeadTimeMinutes` conta dall'arrivo del token, non
        # dalla data dell'udienza, e il motore non ha eventi temporali: sette giorni sono un
        # fondo scala, non un impegno. La scadenza vera — «entro quella giornata» — la presidia il
        # task schedulato «Chiamata esiti», che alle 18:30 guarda gli impegni di oggi.
        - id: esito
          type: Task
          name: Comunica l'esito dell'udienza
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 10080
          form:
            - key: dataUdienza
              label: Data dell'udienza
              type: date
              context: true
            - key: sede
              label: Autorità, sede e sezione
              type: text
              context: true
            - key: parti
              label: Parti
              type: text
              context: true
            - key: testoRiga
              label: Designazione
              type: textarea
              context: true
            - key: esitoAbbinamento
              label: Calendario comune
              type: textarea
              context: true
              description: >
                Cosa ha trovato l'assistente sul calendario. Se dice NON TROVATA, l'impegno non
                c'è e va sistemato a mano.
            - key: esito
              label: Com'è andata
              type: select
              required: true
              options: [Rinviata, Trattenuta in decisione, Definita, Non tenuta, Altro]
            - key: nuovaData
              label: Nuova data (se rinviata)
              type: date
            - key: nuovaOra
              label: Nuova ora (se indicata)
              type: text
            - key: terminiAssegnati
              label: Termini assegnati
              type: textarea
              description: >
                Scritti dal professionista. Il sistema non li calcola: su questa materia un
                errore non si recupera.
            - key: noteEsito
              label: Adempimenti e annotazioni
              type: textarea

        - id: annota-esito
          type: Task
          name: Annota l'esito sul calendario
          performer: Automated
          agentTaskName: Annotazione esito civile
          outputVariable: esitoAnnotazione
          expectedDurationMinutes: 2
          maxLeadTimeMinutes: 30

        - id: redigi-rinvio
          type: Task
          name: Scrivi la comunicazione di rinvio
          performer: Automated
          agentTaskName: Redazione comunicazione di rinvio
          outputVariable: testoRinvio
          expectedDurationMinutes: 1
          maxLeadTimeMinutes: 30

        # Il rinvio non si registra qui: lo registra la presa in carico, con la verifica del
        # referente e lo spostamento senza doppioni che sono già collaudati. La CallActivity apre
        # quell'istanza e ne aspetta la fine, così l'albero dice a colpo d'occhio da dove viene la
        # pratica. Il mapping copia valori ({"destinazione": "sorgente"}): non compone testo, ed è
        # la ragione per cui il passo qui sopra esiste.
        - id: deriva-rinvio
          type: CallActivity
          name: Riapre la presa in carico per il rinvio
          calledProcessName: Presa in carico di una comunicazione (civile)
          inputMapping:
            testoAvviso: testoRinvio
            fonte: fonte
            materia: materia
            fascicolo: fascicolo
          expectedDurationMinutes: 60
          maxLeadTimeMinutes: 2880

        - id: fine
          type: End
          name: Designazione chiusa

      gateways:
        - id: conferma-ok
          type: Exclusive
          name: Estremi corretti?
        - id: derivazioni
          type: Exclusive
          name: Che cosa ne deriva?

      # Il flusso senza condizione è il default, e in entrambi i gateway porta avanti la strada
      # normale: una designazione confermata prosegue, un esito che non è un rinvio chiude. Un
      # valore imprevisto non manda mai un token in un ramo che scrive.
      flows:
        - from: start
          to: conferma
        - from: conferma
          to: conferma-ok
        - from: conferma-ok
          to: correzione
          condition: { var: designazioneConfermata, op: eq, value: false }
          label: da correggere
        - from: correzione
          to: conferma
        - from: conferma-ok
          to: abbina
          label: confermata
        - from: abbina
          to: esito
        - from: esito
          to: annota-esito
        - from: annota-esito
          to: derivazioni
        - from: derivazioni
          to: redigi-rinvio
          condition: { var: esito, op: eq, value: Rinviata }
          label: rinviata
        - from: redigi-rinvio
          to: deriva-rinvio
        - from: deriva-rinvio
          to: fine
        - from: derivazioni
          to: fine
          label: niente da riaprire

  # ------------------------------------------------------------------------------------------
  # La designazione, e l'esito che ne deriva
  # ------------------------------------------------------------------------------------------
