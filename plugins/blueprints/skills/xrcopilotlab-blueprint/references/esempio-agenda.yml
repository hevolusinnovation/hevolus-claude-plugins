  # dice e non inventa: il referente lo legge nel compito dell'esito e sistema a mano.

  - key: designazione-penale
    publish: true
    owners:
      - giuseppe.zileni@hevolus.it     # TODO: destinatario vero degli alert di soglia
    starterRoles:
      - referente-penale
    webhook:
      enabled: true               # per l'ingresso dal dettato in chat
    spec:
      version: 1
      name: Designazione ed esito dell'udienza (penale)
      description: >
        Dalla riunione settimanale del penale: chi va a quale udienza, l'annotazione sul
        calendario comune, e l'esito che il designato comunica entro la giornata — da cui,
        se l'udienza è stata rinviata, riparte da sola la presa in carico.
      criticality: High
      dataSensitivity: Confidential

      activities:
