# Studio Polis — Agenda e calendario di studio
#
# Deriva dall'assessment Agent Ready del 4 agosto 2026, scenario «Agenda e gestione delle
# scadenze». Copre la presa in carico di un avviso di udienza: dall'arrivo dell'avviso alla
# registrazione sul calendario comune, con l'assegnazione tracciata nel flusso invece che
# annotata sulla carta.
#
# Copre due strade: un'udienza nuova, che va assegnata e registrata, e il rinvio di un'udienza già
# a calendario, che va spostata senza riassegnare e senza creare un doppione.
#
# Risponde a quattro delle criticità che lo Studio ha censito nella propria procedura:
#   · la registrazione dipende da una sola persona senza sostituto  → il ruolo ha più membri
#   · nessuna conferma che un avviso sia stato letto e registrato   → passi di conferma con soglia
#   · l'assegnazione è decisa in riunione e annotata solo sulla carta → passo di assegnazione
#   · i rinvii mancanti vivono nelle bozze email di un referente     → alert automatico agli owner
#
# ── Cosa aggiunge la versione 4 ───────────────────────────────────────────────────────────────
# Tre caselle della tabella dello scenario Agenda che fino alla v3 restavano scoperte:
#
#   · «Briefing periodico e promemoria · BPM nativo, da configurare»
#       I promemoria a soglia c'erano già (maxLeadTimeMinutes → alert agli owner). Mancava il
#       briefing: ora è un agent task schedulato al lunedì mattina, prima della riunione
#       settimanale che lo Studio già fa.
#
#   · «Riconciliazione delle due agende · Orchestratore, da configurare»
#       Un orchestratore legge in parallelo la casella e il calendario comune e dice dove NON
#       coincidono. Risponde a una criticità che lo Studio ha censito da sé: «nessuna
#       riconciliazione periodica tra carta e digitale».
#
#   · «Computo e verifica dei termini · Agente Termini, da costruire»
#       Fino alla v3 era fuori perimetro per scelta, e la ragione era buona: su questa materia
#       un errore è irreparabile. Rientra nella forma che l'assessment stesso prescrive —
#       **propone e motiva, non decide**: ogni termine arriva al professionista come proposta
#       con la regola applicata e il conteggio, in un campo di sola lettura accanto alla
#       casella che resta sua e modificabile a mano. Se il flusso salta la proposta, il
#       processo funziona esattamente come prima.
#
# ── Cosa cambia nella versione 5 ──────────────────────────────────────────────────────────────
# Viene dal collaudo del 13/09/2026 (suite blueprints/tests/studiopolis-agenda*.tests.yml, giudizio
# nel report locale). Ogni punto corrisponde a un caso fallito, non a un'idea:
#
#   · L'agente Termini non c'è più. Il computo dei termini non è parte di posta e calendario: è
#       una capacità a sé dello scenario Agenda, che l'assessment dà «da costruire» come skill con
#       le regole codificate. Affidato a un modello da solo ha dato, alla stessa domanda, cinque
#       risposte diverse — sospensione feriale al contrario, giorni del 171-ter inventati — sempre
#       ben motivate, cioè proprio le date che nessuno ricontrolla. I termini li scrive il
#       professionista, come in v3.  (termini-tre-pezzi, termini-sabato)
#
#   · La registrazione sul calendario è AUTOMATICA. Un agente dedicato, «Registrazione calendario»,
#       crea l'evento (udienza nuova) o sposta quello esistente (rinvio) appena il referente ha
#       verificato gli estremi e indicato il professionista — cioè su dati che una persona ha già
#       controllato. Prima di scrivere cerca l'impegno, per non creare un doppione. Il suo esito
#       arriva nel compito del professionista, che lo vede e prende visione: se la scrittura non è
#       riuscita, è lì che se ne accorge. Non collaudabile finché la casella di prova non è
#       operativa: vedi blueprints/tests/studiopolis-agenda-scrittura.tests.yml.
#
#   · cerca_eventi chiede a Graph l'ora di Roma. Senza l'header Prefer, calendarView risponde in UTC
#       e l'agente riportava 08:30 per un'udienza delle 10:30: la riconciliazione avrebbe visto due
#       ore di differenza dove non ce n'erano.  (sim-calendario-json-utc)
#
#   · La Ricognizione conta anche le email dei colleghi. Scartava il rinvio comunicato da un
#       collega, cioè il caso più frequente.  (sim-ricognizione-elenco)
#
#   · Il Riconciliatore non conta due volte un rinvio. Un avviso e un impegno con lo stesso numero
#       di ruolo stanno SOLO fra le divergenze.  (sim-riconciliatore-rinvio-mancato)
#
#   · «NESSUN AVVISO» non apre più una presa in carico. Le output action degli agent task non hanno
#       condizioni: il webhook parte a ogni giro. Il processo ora chiude subito l'istanza con quel
#       testo, prima di lanciare l'estrazione e prima di creare qualunque compito.
#       (sim-presa-in-carico-nessun-avviso)
#
#   · I task schedulati sanno che ora è. «Ultimi dieci minuti» e «da oggi» sono finestre relative, e
#       il prompt ora porta {{now}} / {{date}} (UTC), risolti dall'esecuzione del task.
#
#   · L'orchestratore cabla davvero i passi. Il Confronto citava {{avvisiInCasella}} e
#       {{eventiACalendario}} senza inputMapping/outputMapping, e un segnaposto non risolto diventa
#       stringa vuota: il confronto lavorava su due elenchi vuoti.  (validatore BP093)
#
#   · L'agente Agenda non ha più gli strumenti di posta e calendario: estrae e basta. Scrivere è
#       compito della Registrazione, dopo la verifica umana, e un'estrazione con crea_evento a
#       portata di mano poteva registrare un impegno da sola. È anche l'unica differenza fra la v2,
#       la cui estrazione chiudeva in dieci secondi, e la v4, la cui estrazione non è mai tornata al
#       processo.  (presa-in-carico-udienza-avvio)
#
# ── Cosa cambia nella versione 6 ──────────────────────────────────────────────────────────────
# Dal collaudo della v5 senza casella (13/09/2026, catena simulata dall'orchestratore al processo):
#
#   · Il Riconciliatore non chiama «doppione» una coppia avviso/impegno. Dentro la catena metteva
#       Rossi e Verdi fra i doppioni E fra le divergenze, e Gialli/Gamma in tre sezioni: la regola
#       «una sezione sola» della v5 reggeva con due elenchi puliti, non con l'uscita delle letture.
#       Ora le sezioni si riempiono in un ordine fisso e ogni udienza ne occupa una.
#       (sim-riconciliazione-orchestratore)
#
#   · Una soglia di tempo anche sui passi automatici (estrazione, registrazione, spostamento).
#       Un agent task su un agente con server MCP, dentro un processo, oggi non completa mai e non
#       fallisce: il token resta fermo in silenzio (issue #1000). La registrazione sul calendario è
#       proprio quel caso. Finché #1000 non è risolto la v6 non lo aggira — la registrazione resta
#       automatica, come deciso — ma lo rende visibile: oltre soglia gli owner ricevono l'avviso.
#
# ── Cosa cambia nella versione 7 ──────────────────────────────────────────────────────────────
# Una correzione sola, dal collaudo a secco della Registrazione calendario (13/09/2026):
#
#   · Le date di SCRITTURA sono l'ora di Roma, senza fuso. Il corpo di crea_evento e sposta_evento
#       dichiara già timeZone Europe/Rome, ma il manifest descriveva i loro parametri come «ISO 8601
#       con fuso»: nella stessa esecuzione l'agente ha passato crea_evento senza offset e
#       sposta_evento con +02:00. Un dateTime con offset e un timeZone insieme sono ambigui per
#       Graph — rifiuto, o udienza spostata di due ore. Il fuso resta dove serve davvero: nelle
#       finestre di ricerca (cerca_eventi, posta_in_arrivo).  (sim-registrazione-rinvio)
#
# ── Cosa cambia nella versione 8 ──────────────────────────────────────────────────────────────
# Per la demo con lo Studio (14/09/2026): la Sorveglianza guarda la casella OGNI MINUTO invece che
# ogni cinque, e la finestra scende da dieci a due minuti — finestra e intervallo vanno insieme,
# perché una finestra più larga dell'intervallo ripassa al processo lo stesso avviso a ogni giro.
# Con due minuti su uno, una mail può ancora aprire due istanze: è il prezzo di non perdere un
# avviso arrivato a cavallo di due giri. La deduplica vera — segnare il messaggio come letto e
# chiedere solo i non letti — richiede Mail.ReadWrite al posto di Mail.Read, cioè un nuovo
# consenso dell'amministratore: è la v9, non questa.
#
# ── Cosa cambia nella versione 9 ──────────────────────────────────────────────────────────────
# La piattaforma conta le esecuzioni di ogni agent task per giorno UTC e, raggiunta la quota, salta
# le successive con un avviso nel log e niente altro. La quota di default è 100: la Sorveglianza
# della v8, un giro al minuto, l'ha esaurita alle 03:52 del 15/09 e da lì non ha più letto niente —
# la prima mail di prova è rimasta in casella. Qui la quota è dichiarata: 2000 al giorno, cioè i
# 1440 giri del cron più un margine. Il validatore ora avvisa (BP029) quando il cron è più fitto
# della quota.
#
# ── Cosa cambia nella versione 10: da «avvisi di udienza» a organizer dello Studio ────────────
# Il cliente non chiede un lettore di PEC: chiede un organizer. L'avvocato esce dal tribunale e
# scrive due righe di fretta dalla propria casella, o le DETTA in chat; le comunicazioni del
# tribunale sono una delle fonti, non la fonte, e non sono solo udienze. La v10 rovescia quindi
# l'ordine dei casi e allarga l'ingresso:
#
#   · Tre ingressi, UN processo. (1) La mail — anche scomposta — di chi lavora nello Studio;
#       (2) il dettato in chat all'agente «Assistente agenda», che apre la pratica con un tool
#       (apri_pratica → webhook del processo; la connessione `pratiche` con `process:` riceve
#       indirizzo e chiave dall'apply, CLI bp-v2.9.0); (3) le comunicazioni dell'autorità in
#       qualunque forma — PEC, mail di cancelleria, biglietto inoltrato. L'avvio a mano resta.
#
#   · La Sorveglianza diventa uno SMISTAMENTO: passa qualunque messaggio da organizzare, non
#       solo gli avvisi di udienza; scarta newsletter, notifiche automatiche e ciò che non
#       riguarda un procedimento. Per le PEC vale una regola in sei punti: legge SEMPRE corpo e
#       allegati (nuovo tool leggi_allegati, che espande il messaggio originale allegato alla
#       busta), un solo avviso se dicono la stessa cosa, divergenza affiancata se non coincidono,
#       «non indicato» più nota esplicita se l'allegato non è leggibile.
#
#   · Un CLASSIFICATORE dentro il processo. Ogni comunicazione, da qualunque ingresso, passa da un
#       agente senza strumenti che risponde con UNA parola — Udienza, Rinvio, Scadenza, Attività,
#       Visione — e il processo si biforca su quella. Il referente la vede e può correggerla nel
#       modulo di verifica prima che il flusso prenda un ramo. È l'unico punto di classificazione:
#       tre ingressi, un criterio.
#
#   · Il processo si chiama «Presa in carico di una comunicazione» e ha cinque uscite: udienza
#       nuova (assegna → registra → conferma), rinvio (indica → sposta → avvisa), scadenza con data
#       scritta nel testo (assegna → registra come scadenza → conferma), attività (assegna →
#       compito al professionista), presa visione (compito al referente e basta). Il computo dei
#       termini resta fuori, come dalla v5: se la data non c'è, il compito lo dice.
#
#   · Più cose in un messaggio («rinviata al 12 marzo, prepara il fascicolo, chiama il CTU
#       giovedì»): la voce principale apre la pratica, le altre viaggiano nella proposta come
#       «altre attività menzionate» e il referente le vede. Il motore apre UN'istanza per ingresso.
#
#   · L'Assistente agenda rilegge ciò che ha capito e chiama apri_pratica UNA volta, dopo il sì
#       dell'utente. Non ha gli strumenti di posta e calendario: aprire la pratica è già scrivere.
#
#   · Ancora aperti: il doppione della Sorveglianza (finestra 2 min su cron 1 min; deduplica con
#       Mail.ReadWrite, nuovo consenso) e il PDF dentro una PEC (il testo va estratto dal file, e
#       non passa dal tool Graph). Il file audio inoltrato per mail è la skill vocale
#       dell'assessment, da costruire: in chat il dettato passa dal microfono, già presente.
#
# ── Cosa cambia nella versione 11: la presa in carico si conferma, e il doppione sparisce ─────
# Dal primo giorno con la mail vera (15/09/2026): la Sorveglianza guarda gli ultimi due minuti ogni
# minuto, e una mail arrivata a cavallo di due giri apriva DUE pratiche. Segnare il messaggio come
# letto vorrebbe Mail.ReadWrite, cioè un consenso nuovo. Con i permessi che ci sono (Mail.Send,
# Mail.Read) si fa così, ed è anche una funzione che serve allo Studio:
#
#   · La Sorveglianza RISPONDE al mittente interno sullo stesso thread («Presa in carico…») quando
#       passa un messaggio al processo. È la conferma di ricezione per chi ha scritto di fretta, ed
#       è il segnaposto: al giro dopo, un messaggio il cui thread ha già una risposta inviata negli
#       ultimi quindici minuti è già preso in carico, e si salta (nuovo tool risposte_inviate).
#       Non si risponde all'autorità né ai mittenti esterni: una risposta automatica a una
#       cancelleria o a una PEC non è gradita; per quelli il segnaposto è la sola lettura della
#       posta inviata su thread interni, quindi il loro doppione resta possibile finché non c'è
#       Mail.ReadWrite (v12). Il testo della risposta porta l'avviso «fase di test» finché
#       `variables.faseDiTest` è «sì».
#   · Un messaggio REINVIATO come nuovo (altro thread) è nuovo davvero: lo vede due volte anche una
#       persona. La difesa resta a valle (Registrazione → GIÀ PRESENTE; il referente ne annulla una).
#   · Ritocchi dal collaudo della v10 con la mail vera: la regola (e) sulle PEC illeggibili passa
#       anche l'OGGETTO della busta (il numero di ruolo spesso sta solo lì); l'Assistente dice il tipo
#       con una parola sola, come il classificatore; l'Agenda non ripete la voce principale fra le
#       «altre attività menzionate» e scrive in testo semplice (il campo di sola lettura mostrava
#       «**Data e ora:**» con gli asterischi).
#   · Il classificatore scrive `tipoProposto`, non `tipo`. Un campo modificabile del modulo NON viene
#       precompilato dal caseData (la Web carica solo i dati del compito e i campi di contesto): il
#       select «Di che si tratta» arrivava vuoto e la proposta non si vedeva da nessuna parte. Ora la
#       verifica mostra «Tipo proposto» in sola lettura e il referente sceglie `tipo` — un clic, con
#       la proposta sotto gli occhi — ed è su `tipo` che il flusso si biforca.
#
# ── Cosa cambia nella versione 12: la PEC si legge davvero ───────────────────────────────────
# Con la prima PEC vera (16/09/2026) Exchange ha esposto il messaggio allegato come FILE
# (fileAttachment, message/rfc822, «pec-1.eml»), non come messaggio scomposto: `$expand` dell'item
# non serve a niente, e la v11 passava «ATTENZIONE: allegato non leggibile». Il nuovo tool
# leggi_eml prende il file (contentBytes in base64) e lo scompone nel `transform`, in JavaScript
# dentro il sandbox del builder: oggetto, mittente, data, testo (text/plain o HTML spogliato,
# quoted-printable e base64 decodificati) e, per una busta PEC, il messaggio `originale` che
# contiene. Restano illeggibili i PDF e le immagini: per quelli vale ancora la regola (e).
#
#   · La Registrazione non sceglie più fra due date: se la data del modulo e quella degli estremi
#       verificati non coincidono (il 16/09 il modulo diceva 23/09, la proposta 22/09, e l'agente ha
#       scritto il 22 senza dirlo), risponde NON REGISTRATO con i due valori e lascia decidere.
#
# Resta fuori il calendario Google del penale in sola lettura: vedi la nota in fondo al file.
#
#   xrcopilotlab-bp validate blueprints/studiopolis-agenda.yml --graph

blueprint: studiopolis-agenda
# v13 (16/09): senza lo step di avvio — l'orchestrazione parte dal primo step, come nel designer (BP094). Nessun cambio funzionale rispetto alla v12.
# v14 (16/09): leggi_eml senza $select — Graph rifiutava contentBytes sul tipo base dell'allegato.
# v15 (16/09): il transform legge `input`, non `data`: è così che il sandbox del builder passa la risposta.
# v16 (16/09): invia_messaggio senza allegato + invia_messaggio_con_allegato (Graph rifiutava l'allegato vuoto).
# v17 (16/09): responseFormat: text sui tool che rispondono 202 senza corpo (invio, risposta): il parse JSON falliva.
# v18 (16/09): risposte_inviate conta solo le risposte «RE:» — un messaggio spedito dalla casella stessa non è una conferma.
# v19 (16/09): cancella_evento, per la pulizia del calendario di collaudo nella suite di flusso.
# v20 (16/09): un campo del modulo vuoto o lasciato come «{{…}}» non è una divergenza (la scadenza senza ora usciva NON REGISTRATO).
version: 20
tag: STUDIOPOLIS
description: Organizer dello Studio — dalla mail, dal dettato in chat o dalla comunicazione del tribunale alla pratica e al calendario comune

tenant:
  companyId: 4da69cbc-d935-4050-f410-08d8392ca08f
  topic: Agenda di Studio

# --------------------------------------------------------------------------------------------
# Microsoft 365: la casella di ascolto e il calendario comune
# --------------------------------------------------------------------------------------------
# Una sola connessione verso Microsoft Graph, e sopra un server MCP che espone quello che serve
# allo Studio: leggere la posta in arrivo, mandare una risposta anche con un allegato, leggere e
# scrivere il calendario comune.
#
# ── La casella è una VARIABILE, non un parametro ──────────────────────────────────────────────
# `variables.mailbox` è fissata qui e il modello non la vede. Fosse un parametro del tool,
# sarebbe l'agente a decidere di quale casella leggere — e con un permesso applicativo quella
# scelta vale su tutto il tenant. Non è comodità: è chi decide.
#
# ── Prerequisiti da fare a mano, PRIMA di applicare ───────────────────────────────────────────
# Il blueprint crea connessione, server MCP e collegamento all'agente. Non può creare i permessi:
#   1. registrazione applicativa nel tenant hevolus.it;
#   2. permessi APPLICATIVI di Microsoft Graph, con consenso amministratore:
#        Mail.Read           leggere la posta in arrivo
#        Mail.Send           rispondere, con o senza allegati
#        Calendars.ReadWrite leggere e scrivere il calendario comune
#   3. ⚠️ Application Access Policy in Exchange Online che limiti l'app a QUESTA casella:
#        New-ApplicationAccessPolicy -AppId <appId> `
#          -PolicyScopeGroupId test@hevolus.it -AccessRight RestrictAccess
#      Senza, quei tre permessi leggono e scrivono la posta e il calendario di CHIUNQUE nel
#      tenant. Va fatta prima del consenso, e copre tutte e tre le risorse perché vivono tutte
#      in Exchange. Gli allegati viaggiano dentro la chiamata di invio: nessun permesso sui file.
#   4. i due segreti, che nel manifest compaiono solo come nome:
#        xrcopilotlab-bp secrets set --tag STUDIOPOLIS graph-client-id
#        xrcopilotlab-bp secrets set --tag STUDIOPOLIS graph-client-secret
#
# Il tenant id nell'URL del token è quello di hevolus.it. `test@hevolus.it` è la casella di
# collaudo: per andare in esercizio si cambia `variables.mailbox` e si rifà la policy.

connections:
  - key: graph
    name: microsoft-graph
    provider: webhook
    baseUrl: https://graph.microsoft.com/v1.0
    auth:
      kind: OAuth2ClientCredentials
      tokenUrl: https://login.microsoftonline.com/45bb21a6-d8f8-4218-b74d-f4a5d5c2138e/oauth2/v2.0/token
      clientId: Blueprints:Secrets:STUDIOPOLIS:graph-client-id
      clientSecret: Blueprints:Secrets:STUDIOPOLIS:graph-client-secret
      # .default chiede i permessi applicativi già consentiti: non se ne aggiungono qui.
      scope: https://graph.microsoft.com/.default

  # Il ponte dalla chat alla pratica. Punta al webhook di avvio del processo: indirizzo e chiave
  # nascono all'apply, dopo il webhook, e la CLI li scrive qui da sé (la chiave resta in Key Vault
  # come Blueprints:Secrets:STUDIOPOLIS:webhook-presa-in-carico). Niente baseUrl, niente auth.
  - key: pratiche
    name: pratiche-webhook
    provider: webhook
    process: presa-in-carico

mcpServers:
  # Un solo tool, che fa una cosa sola: apre la pratica. Lo usa l'Assistente agenda in chat; il
  # corpo della POST diventa il caseData iniziale, quindi le chiavi sono quelle del modulo di avvio.
  - key: pratiche
    kind: builder
    name: Pratiche
    description: Apre una pratica di presa in carico dal testo dettato o incollato in chat.
    connection: pratiche
    systemPrompt: >
      apri_pratica apre una pratica vera, che arriva a un referente dello Studio: chiamalo UNA
      volta per comunicazione, e solo dopo che l'utente ha confermato ciò che hai riletto.
    tools:
      - name: apri_pratica
        method: POST
        path: /
        description: >
          Apre la presa in carico di una comunicazione. Il testo va passato INTEGRALE, come
          l'utente l'ha detto o incollato: la classificazione e l'estrazione le fa il processo.
        parameters:
          testo: Il testo integrale della comunicazione, senza riassumerlo né correggerlo
          materia: { type: string, description: "Penale oppure Civile; se non si sa, Civile" }
        required: [testo]
        body: |
          {"testoAvviso": "{{testo}}", "fonte": "chat", "materia": "{{materia}}", "fascicolo": "da attribuire", "mittente": "chat"}
    # Nessun testTool: prima del webhook la connessione non ha un indirizzo, e dopo la prova
    # aprirebbe una pratica. Si prova a mano: xrcopilotlab-bp mcp test pratiche --tool apri_pratica

  - key: m365
    kind: builder
    name: Microsoft365-MCP
    description: >
      Posta e calendario della casella di ascolto dello Studio su Microsoft 365.
    connection: graph
    variables:
      mailbox: test@hevolus.it
      # Il dominio di chi lavora nello Studio: la Sorveglianza risponde solo a loro. In demo è il
      # dominio di chi manda le mail di prova; in esercizio quello dello Studio (domanda da fare).
      dominioInterno: hevolus.it
      # «sì» finché si collauda: la risposta di presa in carico avvisa che si è in fase di test e che
      # una mail reinviata è vista come nuova. In esercizio: «no».
      faseDiTest: "sì"
    systemPrompt: >
      Gli strumenti lavorano su UNA sola casella, quella dello Studio: non chiedere di quale
      casella si tratta e non provare a cambiarla. Per CERCARE (cerca_eventi, posta_in_arrivo) le
      date sono ISO 8601 con fuso. Per SCRIVERE (crea_evento, sposta_evento) sono l'ora locale di
      Roma SENZA fuso, per esempio 2026-10-13T09:30:00: il fuso lo mette lo strumento, e un
      offset in più sposterebbe l'impegno. Prima di
      scrivere in calendario, verifica con cerca_eventi che non ci sia già la stessa udienza:
      un doppione in agenda costa più di una mancata scrittura.
    tools:
      - name: posta_in_arrivo
        method: GET
        path: /users/{{mailbox}}/mailFolders/inbox/messages
        description: >
          Messaggi arrivati nella casella dello Studio, dal più recente. Restituisce mittente,
          oggetto, data e anteprima: per il testo completo serve leggi_messaggio.
        parameters:
          da: Momento da cui guardare, ISO 8601 con fuso, es. 2026-09-11T00:00:00Z
          soloNonLetti: { type: boolean, description: Se limitarsi ai messaggi non ancora letti }
        required: [da]
        query:
          $filter: "receivedDateTime ge {{da}}"
          $orderby: receivedDateTime desc
          $top: "25"
          $select: id,conversationId,receivedDateTime,from,subject,bodyPreview,hasAttachments,isRead

      - name: leggi_messaggio
        method: GET
        path: /users/{{mailbox}}/messages/{{messaggioId}}
        description: Corpo completo di un messaggio, dato il suo identificativo.
        parameters:
          messaggioId: Identificativo del messaggio, come restituito da posta_in_arrivo
        required: [messaggioId]

      # Una busta PEC porta il messaggio originale come allegato (postacert.eml): Exchange lo
      # espone come itemAttachment, e con $expand Graph restituisce il messaggio interno già
      # scomposto — oggetto, mittente, corpo — senza interpretare il MIME. Basta Mail.Read. Se
      # il gestore lo marca come file generico, qui arriva solo un contentBytes in base64: in
      # quel caso l'allegato NON è leggibile, e va detto (regola 6 dello Smistamento).
      - name: leggi_allegati
        method: GET
        path: /users/{{mailbox}}/messages/{{messaggioId}}/attachments
        description: >
          Gli allegati di un messaggio. Un messaggio allegato (una PEC porta così l'originale)
          arriva con oggetto, mittente e corpo già leggibili in «item»; un file arriva con nome,
          tipo e contenuto in base64, che NON va interpretato.
        parameters:
          messaggioId: Identificativo del messaggio, come restituito da posta_in_arrivo
        required: [messaggioId]
        query:
          $expand: microsoft.graph.itemAttachment/item
          $select: id,name,contentType,size

      # Il messaggio allegato a una busta PEC, scomposto. Exchange lo espone come file (base64 del
      # MIME): il transform lo decodifica nel sandbox QuickJS del builder — niente atob, niente
      # librerie — e restituisce oggetto, mittente, data, testo e allegati, con il messaggio
      # `originale` annidato se il file è a sua volta una busta. Oltre 2 MB non si decodifica.
      - name: leggi_eml
        method: GET
        path: /users/{{mailbox}}/messages/{{messaggioId}}/attachments/{{allegatoId}}
        description: >
          Scompone un messaggio allegato (.eml, message/rfc822): oggetto, mittente, data, testo e
          allegati; per una busta PEC anche il messaggio originale in «originale». Da chiamare per
          ogni allegato .eml che leggi_allegati ha elencato.
        parameters:
          messaggioId: Identificativo del messaggio, come restituito da posta_in_arrivo
          allegatoId: Identificativo dell'allegato, come restituito da leggi_allegati
        required: [messaggioId, allegatoId]
        # Niente $select: contentBytes è una proprietà di fileAttachment, non del tipo base, e Graph
        # rifiuta la selezione con un 400 (visto il 16/09); senza selezione lo restituisce da sé.
        transform: |
          // Transform per il tool `leggi_eml`: riceve l'allegato di Graph (fileAttachment con contentBytes in
          // base64, contentType message/rfc822) e restituisce il messaggio contenuto scomposto: oggetto,
          // mittente, data, testo. Gira nel sandbox QuickJS del builder: niente atob, niente Buffer, niente
          // TextDecoder — tutto in JavaScript semplice. Una PEC (postacert.eml) contiene il messaggio
          // originale; il testo è nella prima parte text/plain (o text/html spogliato), spesso in
          // quoted-printable o base64. Se dentro c'è a sua volta un message/rfc822, si scende di un livello.

          function b64ToBytes(s) {
            const t = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
            const map = {}; for (let i = 0; i < t.length; i++) map[t[i]] = i;
            const out = []; let buf = 0, bits = 0;
            for (let i = 0; i < s.length; i++) {
              const c = s[i]; if (c === "=" ) break; const v = map[c]; if (v === undefined) continue;
              buf = (buf << 6) | v; bits += 6;
              if (bits >= 8) { bits -= 8; out.push((buf >> bits) & 0xff); }
            }
            return out;
          }
          function utf8(bytes) {
            let s = "", i = 0;
            while (i < bytes.length) {
              const b = bytes[i++];
              if (b < 0x80) s += String.fromCharCode(b);
              else if (b >= 0xc0 && b < 0xe0) s += String.fromCharCode(((b & 0x1f) << 6) | (bytes[i++] & 0x3f));
              else if (b >= 0xe0 && b < 0xf0) { s += String.fromCharCode(((b & 0x0f) << 12) | ((bytes[i++] & 0x3f) << 6) | (bytes[i++] & 0x3f)); }
              else { const cp = ((b & 0x07) << 18) | ((bytes[i++] & 0x3f) << 12) | ((bytes[i++] & 0x3f) << 6) | (bytes[i++] & 0x3f); s += String.fromCodePoint(cp); }
            }
            return s;
          }
          function latin1(bytes) { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return s; }
          function qpDecode(s) {
            const bytes = []; s = s.replace(/=\r?\n/g, "");
            for (let i = 0; i < s.length; i++) {
              if (s[i] === "=" && /^[0-9A-Fa-f]{2}$/.test(s.substr(i + 1, 2))) { bytes.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
              else bytes.push(s.charCodeAt(i) & 0xff);
            }
            return bytes;
          }
          function decodeHeaderWord(s) {
            // =?utf-8?Q?...?= / =?utf-8?B?...?=
            return s.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (m, cs, enc, txt) => {
              const bytes = enc.toUpperCase() === "B" ? b64ToBytes(txt) : qpDecode(txt.replace(/_/g, " "));
              return /utf-?8/i.test(cs) ? utf8(bytes) : latin1(bytes);
            });
          }
          function parseHeaders(raw) {
            const h = {}; const lines = raw.split(/\r?\n/); let last = null;
            for (const l of lines) {
              if (/^[ \t]/.test(l) && last) { h[last] += " " + l.trim(); continue; }
              const m = l.match(/^([\w-]+):\s*(.*)$/); if (m) { last = m[1].toLowerCase(); h[last] = m[2]; }
            }
            return h;
          }
          function param(ct, name) { const m = new RegExp(name + '="?([^";]+)"?', "i").exec(ct || ""); return m ? m[1] : null; }
          function decodeBody(body, headers) {
            const cte = (headers["content-transfer-encoding"] || "").toLowerCase();
            const cs = param(headers["content-type"], "charset") || "utf-8";
            let bytes;
            if (cte === "base64") bytes = b64ToBytes(body);
            else if (cte === "quoted-printable") bytes = qpDecode(body);
            else { bytes = []; for (let i = 0; i < body.length; i++) bytes.push(body.charCodeAt(i) & 0xff); }
            return /utf-?8/i.test(cs) ? utf8(bytes) : latin1(bytes);
          }
          function stripHtml(s) {
            return s.replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<script[\s\S]*?<\/script>/gi, "")
              .replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|tr|li|h\d)>/gi, "\n").replace(/<[^>]+>/g, "")
              .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
              .replace(/\n{3,}/g, "\n\n").trim();
          }
          // Restituisce {headers, parts:[{headers, body}]} — le parti sono foglie (ricorsivo sui multipart).
          function parseMime(raw, depth) {
            const idx = raw.search(/\r?\n\r?\n/); if (idx < 0) return { headers: parseHeaders(raw), leaves: [] };
            const headers = parseHeaders(raw.slice(0, idx));
            const body = raw.slice(idx).replace(/^\r?\n\r?\n/, "");
            const ct = headers["content-type"] || "text/plain";
            const boundary = param(ct, "boundary");
            if (/^multipart\//i.test(ct) && boundary && depth < 6) {
              const pieces = body.split("--" + boundary); const leaves = [];
              for (let i = 1; i < pieces.length; i++) {
                if (pieces[i].startsWith("--")) break;
                leaves.push(...parseMime(pieces[i].replace(/^\r?\n/, ""), depth + 1).leaves);
              }
              return { headers, leaves };
            }
            if (/^message\/rfc822/i.test(ct) && depth < 6) {
              const inner = parseMime(body, depth + 1);
              return { headers, leaves: [{ headers: { ...inner.headers, "content-type": "message/rfc822" }, inner }] };
            }
            return { headers, leaves: [{ headers, body }] };
          }
          function summarize(msg, depth) {
            const h = msg.headers;
            const out = { oggetto: decodeHeaderWord(h["subject"] || ""), da: decodeHeaderWord(h["from"] || ""), a: decodeHeaderWord(h["to"] || ""), data: h["date"] || "", testo: "", allegati: [], originale: null };
            for (const leaf of msg.leaves) {
              const ct = (leaf.headers["content-type"] || "").toLowerCase();
              const disp = (leaf.headers["content-disposition"] || "").toLowerCase();
              const name = param(leaf.headers["content-disposition"], "filename") || param(leaf.headers["content-type"], "name");
              if (leaf.inner) { if (!out.originale) out.originale = summarize(leaf.inner, depth + 1); continue; }
              if (ct.startsWith("text/plain") && !disp.startsWith("attachment") && !out.testo) out.testo = decodeBody(leaf.body, leaf.headers).trim();
              else if (ct.startsWith("text/html") && !disp.startsWith("attachment") && !out.testo) out.testo = stripHtml(decodeBody(leaf.body, leaf.headers));
              else if (name) out.allegati.push({ nome: name, tipo: ct.split(";")[0], leggibile: ct.startsWith("text/") });
            }
            return out;
          }
          function leggiEml(data) {
            if (data && data.size && data.size > 2 * 1024 * 1024) return { errore: "allegato oltre 2 MB: non si decodifica nel tool, aprire la PEC", file: data.name };
            if (!data || !data.contentBytes) return { errore: "l'allegato non ha contenuto: non è un file, o il tool non ha chiesto contentBytes" };
            const raw = utf8(b64ToBytes(data.contentBytes));
            const msg = parseMime(raw, 0);
            const s = summarize(msg, 0);
            // Una busta PEC: il messaggio firmato dal mittente è l'`originale`; il resto è il gestore.
            return { file: data.name, bustaPec: /postacert|posta certificata/i.test((data.name || "") + " " + s.oggetto) || !!s.originale, ...s };
          }
          // Il sandbox del builder passa la risposta come `input` (non `data`).
          return leggiEml(input);

      # La conferma di presa in carico, sullo stesso thread: Graph la manda con l'oggetto «RE:» e
      # conserva il conversationId, che è ciò che il giro successivo cerca fra le risposte inviate.
      - name: rispondi_messaggio
        method: POST
        responseFormat: text     # Graph risponde 202 senza corpo: non è un JSON
        path: /users/{{mailbox}}/messages/{{messaggioId}}/reply
        description: >
          Risponde al mittente di un messaggio, sullo stesso thread, con un testo breve. Da usare
          SOLO per la conferma di presa in carico a un mittente interno dello Studio.
        parameters:
          messaggioId: Identificativo del messaggio a cui rispondere, come restituito da posta_in_arrivo
          testo: Il testo della risposta, in italiano, senza HTML
        required: [messaggioId, testo]
        body: |
          {"comment": "{{testo}}"}

      # Le conferme già mandate: se un thread ne ha una, il messaggio è già stato preso in carico.
      - name: risposte_inviate
        method: GET
        path: /users/{{mailbox}}/mailFolders/sentitems/messages
        description: >
          I messaggi inviati dalla casella dello Studio da un certo momento in poi, con il thread
          (conversationId) a cui appartengono. Serve a riconoscere ciò che è già stato preso in carico.
        parameters:
          da: Momento da cui guardare, ISO 8601 con fuso, es. 2026-09-15T15:00:00Z
        required: [da]
        # Solo le RISPOSTE (oggetto «RE:»): un messaggio che la casella stessa ha inviato sta negli
        # inviati con lo stesso conversationId, e senza questo filtro veniva preso per una conferma —
        # la suite di flusso, che manda le mail dalla casella di collaudo, non apriva mai niente (16/09).
        query:
          $filter: "sentDateTime ge {{da}} and startswith(subject,'RE')"
          $orderby: sentDateTime desc
          $top: "50"
          $select: id,conversationId,sentDateTime,subject,toRecipients

      # Due tool, non uno con l'allegato facoltativo: un segnaposto vuoto nel corpo della POST
      # produce un allegato senza nome e Graph risponde 400 «Required property is missing»
      # (visto il 16/09 dalla suite di flusso). Senza allegato non deve esserci la chiave.
      - name: invia_messaggio
        method: POST
        responseFormat: text     # Graph risponde 202 senza corpo: non è un JSON
        path: /users/{{mailbox}}/sendMail
        description: Manda un messaggio dalla casella dello Studio, senza allegati.
        parameters:
          a: Destinatario
          oggetto: Oggetto del messaggio
          corpo: Corpo del messaggio, in HTML
        required: [a, oggetto, corpo]
        body: |
          {"message":{"subject":"{{oggetto}}",
           "body":{"contentType":"HTML","content":"{{corpo}}"},
           "toRecipients":[{"emailAddress":{"address":"{{a}}"}}]},
           "saveToSentItems":true}

      - name: invia_messaggio_con_allegato
        method: POST
        responseFormat: text     # Graph risponde 202 senza corpo: non è un JSON
        path: /users/{{mailbox}}/sendMail
        description: >
          Manda un messaggio dalla casella dello Studio con un allegato. Il contenuto
          dell'allegato è il file codificato in base64, non un percorso né un URL.
        parameters:
          a: Destinatario
          oggetto: Oggetto del messaggio
          corpo: Corpo del messaggio, in HTML
          allegatoNome: Nome del file allegato, con l'estensione
          allegatoContenuto: Contenuto dell'allegato codificato in base64
        required: [a, oggetto, corpo, allegatoNome, allegatoContenuto]
        body: |
          {"message":{"subject":"{{oggetto}}",
           "body":{"contentType":"HTML","content":"{{corpo}}"},
           "toRecipients":[{"emailAddress":{"address":"{{a}}"}}],
           "attachments":[{"@odata.type":"#microsoft.graph.fileAttachment",
                           "name":"{{allegatoNome}}","contentBytes":"{{allegatoContenuto}}"}]},
           "saveToSentItems":true}

      - name: cerca_eventi
        method: GET
        path: /users/{{mailbox}}/calendarView
        description: >
          Impegni del calendario comune in una finestra di tempo. Da usare SEMPRE prima di
          scrivere, per non creare un doppione.
        parameters:
          inizio: Inizio della finestra, ISO 8601 con fuso
          fine: Fine della finestra, ISO 8601 con fuso
        required: [inizio, fine]
        query:
          startDateTime: "{{inizio}}"
          endDateTime: "{{fine}}"
          $orderby: start/dateTime
          $select: id,subject,start,end,location,body
        # Senza, Graph risponde con gli orari in UTC e il modello li riporta come ora locale.
        headers:
          Prefer: outlook.timezone="Europe/Rome"

      - name: crea_evento
        method: POST
        path: /users/{{mailbox}}/events
        description: Registra un impegno sul calendario comune.
        parameters:
          titolo: Titolo dell'impegno
          inizio: Inizio nell'ora locale di Roma, SENZA fuso né Z, es. 2026-10-13T09:30:00
          fine: Fine nell'ora locale di Roma, SENZA fuso né Z, es. 2026-10-13T10:30:00
          luogo: Luogo dell'impegno
          note: Annotazioni
        required: [titolo, inizio, fine]
        body: |
          {"subject":"{{titolo}}",
           "start":{"dateTime":"{{inizio}}","timeZone":"Europe/Rome"},
           "end":{"dateTime":"{{fine}}","timeZone":"Europe/Rome"},
           "location":{"displayName":"{{luogo}}"},
           "body":{"contentType":"HTML","content":"{{note}}"}}

      # Serve alla suite di flusso, per ripulire il calendario di collaudo prima di scrivere e dopo:
      # nessun agente lo usa (la Registrazione sposta, non cancella).
      - name: cancella_evento
        method: DELETE
        path: /users/{{mailbox}}/events/{{eventoId}}
        responseFormat: text
        description: Cancella un impegno dal calendario comune. Solo per la pulizia del collaudo.
        parameters:
          eventoId: Identificativo dell'impegno, come restituito da cerca_eventi
        required: [eventoId]

      - name: sposta_evento
        method: PATCH
        path: /users/{{mailbox}}/events/{{eventoId}}
        description: >
          Sposta un impegno già registrato. È la via giusta per un rinvio: aggiorna quello che
          c'è invece di creare un secondo impegno accanto al primo.
        parameters:
          eventoId: Identificativo dell'impegno, come restituito da cerca_eventi
          inizio: Nuovo inizio nell'ora locale di Roma, SENZA fuso né Z, es. 2026-10-20T11:00:00
          fine: Nuova fine nell'ora locale di Roma, SENZA fuso né Z, es. 2026-10-20T12:00:00
        required: [eventoId, inizio, fine]
        body: |
          {"start":{"dateTime":"{{inizio}}","timeZone":"Europe/Rome"},
           "end":{"dateTime":"{{fine}}","timeZone":"Europe/Rome"}}

    # Il tool di prova è in sola lettura e su una finestra vuota: esercita credenziale, permesso
    # e policy senza toccare la casella. Una prova che scrivesse lascerebbe traccia in agenda.
    testTool: cerca_eventi
    testArguments:
      inizio: "2020-01-01T00:00:00Z"
      fine: "2020-01-02T00:00:00Z"

# --------------------------------------------------------------------------------------------
# Chi fa cosa
# --------------------------------------------------------------------------------------------
# Il sostituto non è un concetto del motore: è semplicemente un secondo membro dello stesso
# ruolo. Chi ha il ruolo vede il compito e lo prende in carico, quindi un'assenza non ferma più
# la registrazione — che è esattamente la prima criticità della procedura dello Studio.

businessRoles:
  - key: referente-agenda
    name: Referente agenda
    description: >
      Presidia il calendario comune: verifica gli avvisi in arrivo, assegna l'udienza e la
      registra. Va popolato con il referente del penale, quello del civile e i rispettivi
      sostituti.
    members:
      - giuseppe.zileni@hevolus.it     # membro di prova: i referenti reali si aggiungono dalla UI

  - key: responsabile-agenda
    name: Responsabile agenda
    description: Riceve gli avvisi di superamento soglia sugli avvisi fermi
    members:
      - giuseppe.zileni@hevolus.it     # membro di prova

# --------------------------------------------------------------------------------------------
# L'agente che legge l'avviso
# --------------------------------------------------------------------------------------------

agents:
  # ------------------------------------------------------------------------------------------
  # Il classificatore: una parola, e il processo si biforca su quella
  # ------------------------------------------------------------------------------------------
  # Senza strumenti e a temperatura zero, perché la sua risposta è la variabile di un gateway:
  # un aggettivo in più e il flusso prende il ramo di default. Il referente la vede nel modulo di
  # verifica e può correggerla, quindi un errore qui costa un clic, non una pratica.

  - key: classificatore
    name: Classificatore comunicazioni
    description: Dice di che tipo è una comunicazione, con una parola sola
    language: it
    temperature: 0
    skills: []
    systemMessage: |
      Ricevi il testo di una comunicazione arrivata a uno studio legale — una mail di un
      avvocato dello Studio scritta di fretta, un dettato trascritto, una comunicazione di
      cancelleria, una PEC, il messaggio di un collega — e rispondi con UNA sola parola, senza
      punto, senza spiegazioni, scelta fra queste cinque:

      Udienza    una data di udienza nuova, fissata per la prima volta
      Rinvio     un'udienza già fissata che viene spostata, differita, rinviata
      Scadenza   un termine o una scadenza con una data scritta nel testo (deposito entro il…,
                 notifica entro il…), che non è un'udienza
      Attività   una cosa da fare senza una data di udienza o di scadenza scritta nel testo
                 (prepara il fascicolo, chiama il CTU, chiedi copia del verbale)
      Visione    tutto il resto: una comunicazione da leggere e archiviare, senza niente da
                 registrare né da fare

      Se il testo contiene più cose, vince la prima che compare in questo ordine: Rinvio,
      Udienza, Scadenza, Attività. «Rinviata al 12 marzo, prepara il fascicolo» è Rinvio.

      Non dedurre una data che non c'è: «entro trenta giorni» senza una data scritta è
      Attività, non Scadenza. Non è compito tuo calcolarla.

  - key: agenda
    name: Agenda
    description: Estrae gli estremi di una comunicazione — udienza, rinvio, scadenza, attività
    language: it
    temperature: 0.1        # è un compito di estrazione: la fantasia qui è un difetto
    systemMessage: |
      Sei l'assistente di agenda di uno studio legale.

      Ricevi il testo di una comunicazione — la mail scritta di fretta da un avvocato dello
      Studio, un dettato trascritto dal telefono, una comunicazione di cancelleria, una PEC, il
      messaggio di un collega — e ti viene detto di che TIPO è: Udienza, Rinvio, Scadenza,
      Attività o Visione. Restituisci gli estremi, in italiano, in questa forma:

      - Data e ora (per un rinvio: la NUOVA data e ora)
      - Autorità giudiziaria, sede e sezione
      - Numero di ruolo (R.G. o R.G.N.R.)
      - Parti
      - Cosa va fatto (udienza di …, rinvio da … a …, deposito di …, attività …)
      - Giudice, se indicato
      - Data precedente (solo per un rinvio, se indicata)
      - Altre attività menzionate: ciò che il testo chiede in più OLTRE alla voce principale,
        una per riga («preparare il fascicolo», «chiamare il CTU giovedì»), oppure «nessuna».
        Se il tipo è Attività, la voce principale sta in «Cosa va fatto» e qui NON si ripete:
        restano solo le altre, se ce ne sono

      Scrivi in testo semplice: niente asterischi, niente grassetto, niente cancelletti,
      niente markdown. Il referente legge la proposta in un campo di sola lettura che mostra i
      caratteri così come sono, e «**Data e ora:**» diventa rumore.

      Il testo può essere scomposto, con abbreviazioni («la Rossi/Alfa», «2a civ.», «RG
      4127/25», «giov»), senza maiuscole e senza punteggiatura: leggilo come lo leggerebbe la
      segretaria dello Studio, che sa che «la Rossi/Alfa» sono le parti e «2a civ.» è la
      Seconda sezione civile. Normalizza ciò che è scritto, non aggiungere ciò che non c'è.

      Regole che non ammettono eccezioni:
      - Se un dato non è presente nel testo, scrivi «non indicato». Non dedurlo, non stimarlo,
        non completarlo con quello che sembra plausibile. «Giovedì» senza data resta «giovedì».
      - Non calcolare termini processuali e non proporre scadenze derivate: non è compito tuo,
        e un termine sbagliato ha conseguenze irreparabili.
      - Se il testo è ambiguo o sembra riferirsi a più procedimenti, dillo esplicitamente in
        fondo invece di sceglierne uno.
      - In una busta PEC la data del messaggio di trasporto non è mai la data dell'udienza.
    skills: []

    # Nessun server MCP dalla v5: l'agente estrae, non registra. La registrazione sul calendario
    # comune la fa l'agente Registrazione calendario, dopo la verifica del referente: un'estrazione
    # con crea_evento a portata di mano può scrivere in agenda prima che qualcuno abbia controllato.

  - key: sorveglianza
    name: Sorveglianza posta
    description: Guarda la casella dello Studio e passa al processo ogni comunicazione da organizzare
    language: it
    temperature: 0
    mcp: [m365]
    systemMessage: |
      Guardi la casella di ascolto di uno studio legale e smisti ciò che arriva:
      passi al processo di presa in carico ogni messaggio che contiene qualcosa da
      organizzare, e scarti il resto.

      # Cosa passa
      Da chi lavora nello Studio (avvocati, praticanti, segreteria): qualunque
      messaggio che riguardi un procedimento — «la Rossi/Alfa è rinviata al 14/10»,
      «ricordami di chiamare il CTU giovedì», «deposita la memoria entro il 20» —
      anche scritto di fretta, senza saluti, con abbreviazioni. È il caso PIÙ
      frequente e quello che conta di più.
      Dall'autorità (cancelleria, tribunale, PEC di giustizia, ufficiali giudiziari,
      controparti): udienze, rinvii, differimenti, termini, depositi, notifiche,
      comunicazioni da prendere in visione. Di QUALUNQUE tipo, in qualunque forma.
      Da un collega esterno: se parla di un procedimento dello Studio.

      # Cosa scarti
      Newsletter, notifiche automatiche di servizi, pubblicità, fatture, messaggi
      che non riguardano un procedimento. Nel dubbio PASSA: un falso positivo lo
      chiude un referente in dieci secondi, una comunicazione persa è un termine
      perso.

      # Come leggi
      1. Chiami posta_in_arrivo con il momento che ti viene indicato, e risposte_inviate
         con il momento indicato per le conferme (quindici minuti prima).
      2. Scarti ogni messaggio il cui conversationId compare fra le risposte inviate
         (oggetto che comincia con «RE:»): è già stato preso in carico da un giro
         precedente. Un messaggio che la casella ha spedito lei stessa NON è una
         conferma: se non c'è una risposta «RE:» sul suo thread, passa. La finestra della posta
         è più larga dell'intervallo di proposito, e senza questo controllo lo
         stesso messaggio aprirebbe due pratiche.
      3. Per il primo messaggio rimasto da passare chiami leggi_messaggio per il
         testo intero.
      4. Se è una busta di posta certificata — l'oggetto comincia con «POSTA
         CERTIFICATA:», oppure ha allegati daticert.xml o postacert.eml — chiami
         anche leggi_allegati, sempre, e applichi queste regole:
         a. Leggi il corpo. Il testo standard del gestore («Il giorno … il
            messaggio … è stato inviato da …») non è la comunicazione, e la sua
            data è quella della busta. Se però il corpo contiene anche la
            comunicazione, quella vale.
         b. Per ogni allegato .eml (message/rfc822) elencato da leggi_allegati chiami
            leggi_eml: il messaggio originale firmato dal mittente è in «originale»
            (o, se il file non è una busta, direttamente in «testo»). Quello è il
            testo della comunicazione.
         c. Se corpo e allegato dicono la stessa cosa, è UNA comunicazione: passi il
            testo dell'allegato, che è l'originale.
         d. Se dicono cose diverse (una data nel corpo, un'altra nell'allegato),
            passi entrambi i testi, uno dopo l'altro, preceduti dalla riga
            «ATTENZIONE: corpo e allegato non coincidono».
         e. Se il corpo è solo il testo del gestore e l'allegato non è leggibile (un
            PDF, un'immagine, un .eml che leggi_eml non riesce a scomporre), passi la riga «ATTENZIONE:
            comunicazione in allegato non leggibile (<nome del file>), aprire la
            PEC», poi la riga «Oggetto: <oggetto della busta>», poi il corpo. Il
            numero di ruolo spesso sta solo nell'oggetto: senza, il referente lo
            perde.
      5. Se il mittente è interno allo Studio — l'indirizzo è del dominio che ti
         viene indicato — chiami rispondi_messaggio con il testo di conferma che ti
         viene indicato. Non rispondi all'autorità, alle PEC, né a mittenti esterni:
         una risposta automatica a una cancelleria non è gradita.
      6. Restituisci il testo della comunicazione, e nient'altro: né preamboli, né
         riassunti, né commenti, né la conferma che hai mandato. Quel testo viene
         consegnato a un processo che lo classifica e lo fa leggere a chi di dovere.

      # Cosa NON fai
      Non classifichi e non estrai gli estremi: lo fa il processo, con un criterio
      solo per tutti gli ingressi, e farlo due volte produce due verità.
      Non segni niente come letto e non rispondi a nessuno che non sia interno.
      Se non c'è nessun messaggio da passare, restituisci esattamente: NESSUN AVVISO

  # ------------------------------------------------------------------------------------------
  # Chi scrive sul calendario comune
  # ------------------------------------------------------------------------------------------
  # È l'unico agente del file che scrive, e scrive solo su dati che il referente ha già
  # verificato. Due regole valgono più del resto: si cerca prima di scrivere, e un rinvio sposta
  # l'impegno che c'è invece di crearne un altro. Un doppione in agenda è il disallineamento che
  # tutto lo scenario esiste per togliere.

  - key: registrazione
    name: Registrazione calendario
    description: Registra o sposta un'udienza verificata sul calendario comune, senza creare doppioni
    language: it
    temperature: 0
    skills: []
    mcp: [m365]
    systemMessage: |
      Tieni aggiornato il calendario comune di uno studio legale. Ricevi gli
      estremi di un'udienza che un referente ha già verificato, e li porti in
      calendario.

      # Udienza nuova
      1. Chiami cerca_eventi sul giorno dell'udienza (dalle 00:00 alle 23:59).
      2. Se c'è già un impegno con lo stesso numero di ruolo — o, senza numero
         di ruolo, con le stesse parti alla stessa ora — NON ne crei un altro.
      3. Altrimenti chiami crea_evento:
           titolo   «Udienza <parti> R.G. <numero di ruolo>»
           inizio   data e ora dell'udienza nell'ora di Roma, senza fuso
                    (2026-10-13T09:30:00); fine un'ora dopo, nello stesso formato
           luogo    autorità, sede e sezione
           note     tipo di adempimento, giudice se indicato, professionista incaricato
         Senza ora non registri: un impegno a un'ora inventata è peggio di
         nessun impegno.

      # Scadenza
      Come un'udienza nuova, ma il titolo è «Scadenza <cosa va fatto> <parti> R.G.
      <numero di ruolo>» e, se il testo non dà un'ora, l'impegno va dalle 09:00
      alle 09:30 del giorno della scadenza: qui l'ora non è un dato inventato, è
      un promemoria di inizio giornata, e lo scrivi nelle note.

      # Rinvio
      1. Chiami cerca_eventi sul giorno dell'udienza precedente che ti viene
         indicata, e trovi l'impegno con lo stesso numero di ruolo o le stesse parti.
      2. Se lo trovi, chiami sposta_evento sulla nuova data e ora, nell'ora di Roma
         senza fuso (2026-10-20T11:00:00), con la fine un'ora dopo.
      3. Se non lo trovi, NON crei un impegno nuovo: lo dici.

      # Se i dati non coincidono
      Ti arrivano una data e un'ora dal modulo del referente e gli estremi che il
      referente ha verificato. Se la DATA del modulo e quella degli estremi non
      coincidono, NON scegli: rispondi NON REGISTRATO e riporti i due valori
      affiancati («modulo: 23/09/2026 — estremi: 22 settembre 2026»). Chi ha
      verificato decide; un impegno al giorno sbagliato costa più di un impegno
      in ritardo.
      Un campo del modulo che arriva vuoto, oppure ancora come segnaposto fra
      doppie graffe (per esempio «{{oraUdienza}}»), vuol dire che il referente
      non l'ha compilato: NON è un valore, e non è una divergenza. Per una
      scadenza senza ora vale la regola qui sopra (09:00–09:30); per un'udienza
      senza ora, NON REGISTRATO.

      # Cosa restituisci
      La prima riga è sempre una di queste, esattamente:
        REGISTRATO
        SPOSTATO
        GIÀ PRESENTE
        NON REGISTRATO
      Sotto, in una o due righe: l'impegno com'è ora in calendario (data, ora,
      titolo), oppure il motivo per cui non hai scritto (dato mancante, impegno
      da spostare non trovato, errore del calendario). Il professionista legge
      questa risposta nel suo compito: deve capire in un colpo d'occhio se
      l'udienza è in agenda.

      # Cosa NON fai
      Non deduci un dato mancante. Non calcoli termini. Non scrivi in nessun
      calendario che non sia quello dei tuoi strumenti, e non mandi email.

  # ------------------------------------------------------------------------------------------
  # Le due viste che vanno confrontate
  # ------------------------------------------------------------------------------------------
  # `calendario` legge il calendario comune, `ricognizione` legge la casella. Sono due agenti e
  # non uno perché l'orchestratore li fa girare in PARALLELO: il confronto vale quanto vale la
  # loro indipendenza, e un unico agente che leggesse entrambe le fonti tenderebbe a far
  # coincidere ciò che ha appena letto.
  #
  # `ricognizione` non è `sorveglianza`: quello passa UN avviso per avviare il processo e non
  # deve estrarne niente, questo li ELENCA tutti su una finestra per essere confrontato.

  - key: calendario
    name: Calendario di studio
    description: Legge gli impegni del calendario comune su una finestra di tempo
    language: it
    temperature: 0
    mcp: [m365]
    systemMessage: |
      Leggi il calendario comune dello Studio e restituisci gli impegni di una
      finestra di tempo.

      # Cosa fai
      1. Ti viene indicata una finestra. Se non è indicata, usa i prossimi 14
         giorni a partire da oggi.
      2. Chiami cerca_eventi su quella finestra.
      3. Restituisci gli impegni in ordine di data, uno per riga:
           DATA ORA — titolo — luogo — annotazioni
      4. Segnali a parte, in fondo, gli impegni le cui annotazioni non nominano
         nessun professionista: sono quelli che rischiano di arrivare a udienza
         senza che nessuno se ne sia preso carico.

      # Cosa NON fai
      Non scrivi in calendario e non sposti niente: qui sei in sola lettura.
      Non deduci il professionista dal nome delle parti o dalla materia.
      Non calcoli termini processuali: li scrive il professionista.
      Se nella finestra non c'è nessun impegno, lo dici in una riga senza
      aggiungere commenti.

  - key: ricognizione
    name: Ricognizione posta
    description: Elenca gli avvisi di udienza arrivati in casella su una finestra di tempo
    language: it
    temperature: 0
    mcp: [m365]
    systemMessage: |
      Elenchi gli avvisi di udienza arrivati nella casella di ascolto in una
      finestra di tempo, per poterli confrontare con il calendario comune.

      # Cosa fai
      1. Ti viene indicata una finestra. Se non è indicata, usa gli ultimi 14
         giorni.
      2. Chiami posta_in_arrivo su quella finestra, e per ogni messaggio che
         sembra un avviso chiami leggi_messaggio. È un avviso qualunque messaggio
         che comunica una data di udienza, un rinvio o un differimento: una
         comunicazione di cancelleria, una PEC, ma anche l'email informale di un
         collega («la Verdi/Beta è slittata al 16/10»). Proprio quelle, che non
         hanno né numero di ruolo né tribunale, sono le più facili da perdere.
      3. Per ciascuno restituisci una riga:
           DATA UDIENZA — autorità e sede — numero di ruolo — parti — mittente dell'avviso
         Un dato che nell'avviso non c'è si scrive «non indicato».

      # Cosa NON fai
      Non completi un dato mancante con quello che sembra plausibile: il
      confronto a valle serve proprio a trovare le differenze, e un buco
      riempito a caso diventa una differenza inventata.
      Non scarti un avviso perché ti pare già a calendario: non lo sai, e
      stabilirlo è il compito di chi confronta.
      Non scarti un avviso perché gli mancano dei dati: una riga con quattro
      «non indicato» vale più di una riga che manca.
      Non rispondi ai messaggi e non segni niente come letto.
      Se nella finestra non c'è nessun avviso, lo dici in una riga.

  - key: riconciliatore
    name: Riconciliazione agende
    description: Confronta gli avvisi in casella con il calendario comune e riporta i disallineamenti
    language: it
    temperature: 0
    skills: []
    systemMessage: |
      Ricevi due elenchi — gli avvisi arrivati in casella e gli impegni del
      calendario comune — e dici dove NON coincidono.

      # Cosa restituisci, in quest'ordine
      1. **Avvisi senza impegno a calendario** — un avviso è arrivato ma sul
         calendario non c'è niente che gli corrisponda. È il caso più grave:
         è un'udienza che nessuno vedrà.
      2. **Impegni a calendario senza avviso** — c'è l'impegno ma non se ne
         trova l'avviso nella finestra. Spesso è solo un avviso più vecchio
         della finestra: dillo come ipotesi, non come fatto.
      3. **Doppioni** — due IMPEGNI A CALENDARIO che descrivono la stessa
         udienza. Tipico dopo un rinvio registrato creando un evento nuovo invece
         di spostare quello che c'era. Un avviso non è mai un doppione: un avviso
         e un impegno sulla stessa udienza sono una coppia, e se non coincidono
         sono una divergenza.
      4. **Divergenze** — stessa udienza in entrambi, ma data, ora, sede o
         numero di ruolo non coincidono. Riporta i due valori affiancati,
         senza dire quale sia quello giusto.

      Se una sezione è vuota, scrivi «nessuno» invece di ometterla: sapere che
      il controllo è stato fatto vale quanto il risultato.

      # Come accoppi
      Il numero di ruolo è il criterio forte. In mancanza, data più autorità
      più parti. Se un accoppiamento è incerto, mettilo fra le divergenze e
      di' perché è incerto.

      Lavori in quest'ordine, e ogni udienza finisce in UNA sezione sola:
        a. Fra gli impegni a calendario, trovi i doppioni (stessa udienza due
           volte) → sezione 3. Da qui in poi quei due impegni contano come uno.
        b. Accoppi ogni avviso con un impegno (numero di ruolo, altrimenti data
           più autorità più parti). Una coppia che non coincide in tutto →
           sezione 4. Una coppia che coincide → nessuna sezione.
        c. Gli avvisi rimasti senza coppia → sezione 1; gli impegni rimasti
           senza coppia → sezione 2.
      Un rinvio non riportato a calendario è UNA divergenza (nuova data
      nell'avviso, vecchia a calendario), non due anomalie scollegate. Prima di
      rispondere, controlla che nessun numero di ruolo compaia in due sezioni:
      l'unica eccezione è un doppione che ha anche un avviso con cui non
      coincide, e allora lo dici esplicitamente.

      # Cosa NON fai
      Non hai strumenti e non leggi nulla per conto tuo: lavori solo sui due
      elenchi che ti vengono dati.
      Non correggi il calendario e non proponi di correggerlo tu: riporti, e
      chi presidia l'agenda decide.
      Non fai sparire una differenza perché è piccola. Un'ora di scarto su
      un'udienza è esattamente il genere di dettaglio per cui esiste questo
      confronto.

  # ------------------------------------------------------------------------------------------
  # L'ingresso dalla chat: l'avvocato detta, l'assistente apre la pratica
  # ------------------------------------------------------------------------------------------
  # Ha un solo strumento, apri_pratica, e non ha posta né calendario: aprire la pratica è già
  # una scrittura, e un agente che potesse anche registrare in agenda salterebbe la verifica
  # del referente, che è il motivo per cui il processo esiste. Non è l'agente di nessun passo
  # del processo — la connessione si completa dopo il webhook, che nasce dopo il processo.

  - key: assistente
    name: Assistente agenda
    description: Riceve in chat ciò che l'avvocato detta o incolla e apre la pratica di presa in carico
    language: it
    temperature: 0.1
    skills: []
    mcp: [pratiche]
    systemMessage: |
      Sei l'assistente di agenda di uno studio legale, in chat. Chi ti scrive è di
      norma un avvocato dello Studio che esce dal tribunale e ha fretta: detta al
      telefono, scrive senza punteggiatura, usa abbreviazioni («la Rossi/Alfa»,
      «2a civ.», «RG 4127/25», «giov»). Il tuo compito è aprire la pratica giusta,
      una volta sola, senza far perdere tempo.

      # Come lavori
      1. Leggi ciò che ti arriva e rileggilo all'utente in tre o quattro righe. La
         prima riga dice il tipo con UNA parola, esattamente una di queste: Udienza,
         Rinvio, Scadenza, Attività, Visione (un'udienza nuova è «Udienza»; una
         cosa da fare senza data scritta è «Attività»). Poi le parti o il numero di
         ruolo, la data e l'ora se ci sono, e le altre cose menzionate. Dove un dato
         manca scrivi «non indicato», non lo inventi.
      2. Chiedi conferma con una domanda sola: «Apro la pratica così?». Se l'utente
         corregge, rileggi e richiedi.
      3. Al sì, chiami apri_pratica UNA volta, passando il testo INTEGRALE come
         l'utente l'ha scritto (non la tua rilettura: la classificazione e
         l'estrazione le fa il processo, sul testo originale). Materia: Penale se
         il testo parla di R.G.N.R., procura, imputato, GIP, GUP o dibattimento;
         altrimenti Civile.
      4. Rispondi che la pratica è aperta e che un referente dell'agenda la
         verificherà; se ci sono altre attività menzionate, di' che le vedrà nella
         stessa pratica.

      # Cosa NON fai
      Non calcoli termini né scadenze derivate: se l'utente te lo chiede, dici che
      i termini li scrive il professionista nel compito di conferma.
      Non apri due pratiche per un messaggio solo, anche se contiene più cose: la
      voce principale apre la pratica, le altre viaggiano con lei.
      Non chiami apri_pratica senza il sì dell'utente, e non lo chiami «per
      sicurezza» una seconda volta.
      Non leggi la posta e non scrivi in calendario: non hai quegli strumenti, e
      dirlo è meglio che fingere.
      Se il messaggio non riguarda un procedimento, lo dici e non apri niente.

# ----------------------------------------------------------------------------------------------
# L'orchestrazione della riconciliazione
# ----------------------------------------------------------------------------------------------
# Due letture in parallelo e un confronto. Il parallelo qui non è una micro-ottimizzazione: è
# ciò che tiene le due viste indipendenti l'una dall'altra.

orchestrators:
  - key: riconciliazione
    name: Riconciliazione agende
    description: >
      Confronta gli avvisi arrivati in casella con gli impegni del calendario comune e riporta
      doppioni, divergenze e udienze che stanno in una sola delle due viste.
    steps:
      - key: letture
        name: Le due viste
        type: parallelGroup
        description: >
          La casella e il calendario, letti insieme e senza che l'uno veda l'altro.
        agents: [ricognizione, calendario]
        agentOutputs:
          ricognizione: avvisiInCasella
          calendario: eventiACalendario
        maxParallel: 2
        timeoutSeconds: 240

      - key: confronto
        name: Confronto
        type: agent
        agent: riconciliatore
        displayOutput: true
        timeoutSeconds: 180
        userMessageTemplate: |
          Avvisi arrivati in casella:
          {{avvisiInCasella}}

          Impegni sul calendario comune:
          {{eventiACalendario}}
        # Senza queste due mappe i segnaposto qui sopra non si risolvono, e il confronto riceve due
        # elenchi VUOTI: risponde «nessuno» quattro volte, cioè il risultato che sembra un successo.
        # La v4 ne era priva (il validatore non le chiedeva ancora): la sua riconciliazione non ha
        # mai confrontato niente.
        inputMapping:
          avvisiInCasella: "Gli avvisi elencati dalla Ricognizione posta."
          eventiACalendario: "Gli impegni elencati dal Calendario di studio."
        outputMapping:
          riconciliazione_output: "I disallineamenti fra casella e calendario, nelle quattro sezioni."

      - key: fine
        name: Fine
        type: terminate

    flows:
      - { from: letture, to: confronto }
      - { from: confronto, to: fine }

agentTasks:
  # Il primo passo automatico del processo, uguale per i tre ingressi: una parola.
  - key: classificazione
    name: Classificazione comunicazione
    description: Dice se la comunicazione è un'udienza, un rinvio, una scadenza, un'attività o una presa visione
    agent: classificatore
    prompt: |
      {{testoAvviso}}

  - key: estrazione-avviso
    name: Estrazione avviso
    description: Legge la comunicazione ricevuta e ne propone gli estremi
    agent: agenda
    prompt: |
      Estrai gli estremi dalla seguente comunicazione.
      Tipo: {{tipoProposto}}. Fonte: {{fonte}}. Materia: {{materia}}. Fascicolo: {{fascicolo}}.

      {{testoAvviso}}

  # ------------------------------------------------------------------------------------------
  # L'ingresso: nessuno incolla più il testo di un avviso
  # ------------------------------------------------------------------------------------------
  # Ogni minuto il sorvegliante guarda la casella e, se trova un avviso, il suo esito
  # viene consegnato al webhook del processo — indirizzo e chiave li mette il planner, e quella
  # chiave, che si vede una volta sola, non passa da nessuna parte.
  #
  # `body` non è un dettaglio: senza, verrebbe mandata la busta di default (executionId,
  # taskName, agentResponse...), le cui chiavi non sono i campi del modulo di avvio. Le chiavi
  # del corpo DIVENTANO le variabili del caso, quindi devono chiamarsi come quei campi.
  #
  # La latenza è l'intervallo del cron. Per reagire nell'attimo servirebbe il push: issue #991.

  - key: sorveglianza-posta
    name: Sorveglianza posta
    description: Ogni minuto cerca avvisi nuovi e avvia la presa in carico
    agent: sorveglianza
    prompt: |
      Adesso è {{now}} (UTC).

      Cerca i messaggi arrivati negli ultimi due minuti; le conferme già inviate
      vanno cercate dai quindici minuti precedenti. Restituisci il testo del primo
      messaggio da passare al processo che non sia già stato preso in carico. La
      finestra è più larga dell'intervallo di proposito: meglio riconsiderare un
      messaggio che perderlo fra due giri, e le conferme inviate dicono quali sono
      già passati.

      Mittenti interni: gli indirizzi del dominio hevolus.it. A loro, e solo a loro,
      rispondi con questo testo:
      «Presa in carico: la tua comunicazione è stata registrata e un referente
      dell'agenda la verificherà. [FASE DI TEST: se hai reinviato la stessa mail
      come messaggio nuovo, è stata vista come nuova e ha aperto una seconda
      pratica.]»
      La parte fra parentesi quadre va inclusa solo se la fase di test è «sì»;
      oggi è: sì.
    trigger: scheduled
    schedule:
      cron: "* * * * *"
      timeZone: Europe/Rome
    # Un giro al minuto sono 1440 esecuzioni al giorno: senza questa riga la piattaforma si ferma
    # alla centesima, poco prima delle due di notte, e la casella resta senza sorveglianza fino a
    # mezzanotte UTC.
    executionPolicy:
      maxDailyExecutions: 2000
    outputActions:
      - type: webhook
        url: processes.presa-in-carico.webhook
        body:
          testoAvviso: "{{agentResponse}}"
          fonte: mail
          # La materia non si deduce dal testo senza sbagliarla: il referente la sceglie nel
          # modulo. Qui si lascia il default, e il processo la fa confermare.
          materia: Civile
          fascicolo: "da attribuire"

  # ------------------------------------------------------------------------------------------
  # La scrittura sul calendario, dentro il processo
  # ------------------------------------------------------------------------------------------
  # Girano dopo la verifica del referente e dopo che un professionista è stato indicato: i dati
  # sono quelli del modulo, non quelli letti dall'agente. `proposta` (la lettura dell'avviso) va
  # nel prompt per il numero di ruolo e le parti, che il modulo di verifica non ha come campi.
  # ⚠️ `{{professionista}}` è il valore di un campo di tipo utente: se arriva come id e non come
  # nome, nelle note dell'evento comparirà l'id — da guardare alla prima esecuzione vera.

  - key: registrazione-udienza
    name: Registrazione udienza
    description: Registra sul calendario comune un'udienza nuova o una scadenza appena assegnata
    agent: registrazione
    prompt: |
      Da registrare: {{tipo}} (udienza nuova, oppure scadenza).
      Data: {{dataUdienza}}
      Ora: {{oraUdienza}}
      Autorità, sede e sezione: {{sede}}
      Tipo di adempimento: {{tipoAdempimento}}
      Professionista incaricato: {{professionista}}
      Fascicolo: {{fascicolo}}

      Estremi letti dall'avviso e verificati dal referente (numero di ruolo, parti, giudice):
      {{proposta}}

  - key: spostamento-udienza
    name: Spostamento udienza
    description: Sposta sul calendario comune un'udienza rinviata, senza crearne una nuova
    agent: registrazione
    prompt: |
      Rinvio: sposta l'impegno già in calendario.
      Udienza precedente (da cercare): {{udienzaPrecedente}}
      Nuova data: {{dataUdienza}}
      Nuova ora: {{oraUdienza}}
      Autorità, sede e sezione: {{sede}}

      Estremi letti dall'avviso e verificati dal referente (numero di ruolo, parti):
      {{proposta}}


  # ------------------------------------------------------------------------------------------
  # Il briefing, al lunedì mattina
  # ------------------------------------------------------------------------------------------
  # L'orario non è scelto a caso: lo Studio una riunione settimanale la fa già, e il briefing
  # serve se arriva prima, non dopo. Le soglie sui singoli passi del processo restano dove sono
  # — quelle avvisano che una COSA è ferma, questo dice che SETTIMANA è.

  - key: briefing-settimanale
    name: Briefing settimanale
    description: Ogni lunedì mattina manda ai referenti il quadro delle udienze della settimana
    agent: calendario
    prompt: |
      Oggi è {{date}} (UTC). Finestra: da oggi ai prossimi sette giorni.

      Restituisci il quadro delle udienze della settimana in ordine di data, e
      in fondo l'elenco di quelle le cui annotazioni non nominano nessun
      professionista.
    trigger: scheduled
    schedule:
      cron: "30 7 * * 1"
      timeZone: Europe/Rome
    outputActions:
      - type: email
        recipients:
          - giuseppe.zileni@hevolus.it     # destinatario di prova: i referenti si aggiungono qui
        subject: "{{taskName}} — {{date}}"

  # ------------------------------------------------------------------------------------------
  # La riconciliazione, al venerdì
  # ------------------------------------------------------------------------------------------
  # «Nessuna riconciliazione periodica tra carta e digitale» è una delle criticità che lo Studio
  # ha messo per iscritto nella propria procedura. Questo è il passo che la chiude, ed è l'unico
  # agent task del file che non lancia un agente ma un'orchestrazione.
  #
  # La finestra guarda anche indietro di proposito: un disallineamento nato la settimana scorsa
  # è ancora un disallineamento, e guardando solo avanti non lo si vedrebbe mai.

  - key: riconciliazione-settimanale
    name: Riconciliazione settimanale
    description: Ogni venerdì confronta casella e calendario e manda ai referenti i disallineamenti
    orchestrator: riconciliazione
    prompt: |
      Oggi è {{date}} (UTC). Finestra: dai sette giorni passati ai trenta giorni futuri.
    trigger: scheduled
    schedule:
      cron: "0 17 * * 5"
      timeZone: Europe/Rome
    outputActions:
      - type: email
        recipients:
          - giuseppe.zileni@hevolus.it     # destinatario di prova
        subject: "{{taskName}} — {{date}}"

# --------------------------------------------------------------------------------------------
# Il processo
# --------------------------------------------------------------------------------------------

processes:
  - key: presa-in-carico
    publish: true
    owners:
      - giuseppe.zileni@hevolus.it     # destinatario di prova degli alert di soglia
    starterRoles:
      - referente-agenda
    webhook:
      enabled: true               # per l'ingresso dalla casella E dalla chat
    spec:
      version: 1
      name: Presa in carico di una comunicazione
      description: >
        Dalla comunicazione ricevuta — mail di un avvocato, dettato in chat, avviso del
        tribunale — alla pratica giusta: udienza o scadenza sul calendario comune, rinvio
        spostato, attività al professionista, presa visione. Con verifica del referente,
        assegnazione tracciata e conferma.
      criticality: High
      dataSensitivity: Confidential

      activities:
        - id: start
          type: Start
          name: Comunicazione ricevuta
          form:
            - key: testoAvviso
              label: Testo della comunicazione
              type: textarea
              required: true
              description: Il testo come è arrivato — mail, dettato, avviso — senza riscriverlo
            - key: fonte
              label: Da dove arriva
              type: select
              required: true
              options: [mail, chat, cancelleria, altro]
            - key: materia
              label: Materia
              type: select
              required: true
              options: [Penale, Civile]
            - key: fascicolo
              label: Fascicolo
              type: text
              description: Riferimento interno del fascicolo, se noto
            - key: mittente
              label: Mittente
              type: text

        # La Sorveglianza chiama il webhook anche quando non trova niente, perché le output action
        # non hanno condizioni. L'istanza con «NESSUN AVVISO» si chiude qui.
        - id: nessun-avviso
          type: End
          name: Nessuna comunicazione da prendere in carico

        # Una parola — Udienza, Rinvio, Scadenza, Attività, Visione — proposta al referente, che la
        # conferma o la cambia nel passo dopo scegliendo `tipo`: è quella la variabile dei gateway.
        # Agente senza strumenti: torna in pochi secondi (#1000 non lo riguarda).
        - id: classifica
          type: Task
          name: Classifica la comunicazione
          performer: Automated
          agentTaskName: Classificazione comunicazione
          outputVariable: tipoProposto
          expectedDurationMinutes: 1
          maxLeadTimeMinutes: 30

        - id: estrai
          type: Task
          name: Estrai gli estremi
          performer: Automated
          agentTaskName: Estrazione avviso
          outputVariable: proposta
          expectedDurationMinutes: 2
          # Su un passo automatico la soglia non misura una persona lenta: segnala un'esecuzione che
          # non è tornata (issue #1000). Trenta minuti sono quindici volte la durata attesa.
          maxLeadTimeMinutes: 30

        - id: verifica
          type: Task
          name: Verifica del referente
          performer: HumanOnly
          roleName: Referente agenda
          expectedDurationMinutes: 10
          maxLeadTimeMinutes: 480        # mezza giornata lavorativa
          form:
            - key: proposta
              label: Estremi proposti
              type: textarea
              context: true
              description: Quello che l'assistente ha letto, da verificare sul testo
            - key: fonte
              label: Da dove arriva
              type: text
              context: true
            # La proposta del classificatore, in sola lettura; sotto, la scelta del referente. Due
            # chiavi diverse perché un campo modificabile non viene precompilato dal caseData: con
            # una chiave sola il select arrivava vuoto. È su `tipo` che il flusso si biforca.
            - key: tipoProposto
              label: Tipo proposto dall'assistente
              type: text
              context: true
            - key: tipo
              label: Di che si tratta
              type: select
              required: true
              options: [Udienza, Rinvio, Scadenza, Attività, Visione]
              description: >
                Udienza nuova, rinvio di una già fissata, scadenza con data scritta, attività da
                fare, o solo da prendere visione. Di norma è il tipo proposto qui sopra.
            - key: datiCompleti
              label: Estremi completi e corretti
              type: bool
            - key: dataUdienza
              label: Data (udienza, nuova udienza, o scadenza)
              type: date
            - key: oraUdienza
              label: Ora
              type: text
            - key: sede
              label: Sede e sezione
              type: text
            - key: tipoAdempimento
              label: Cosa va fatto
              type: text
              description: Udienza di comparizione, deposito memoria, notifica, chiamare il CTU…

        - id: chiarimenti
          type: Task
          name: Richiedi chiarimenti
          performer: HumanOnly
          roleName: Referente agenda
          expectedDurationMinutes: 15
          maxLeadTimeMinutes: 2880       # due giorni: è il passo che si dimentica più spesso
          form:
            - key: proposta
              label: Estremi proposti
              type: textarea
              context: true
            - key: richiestaInviata
              label: Richiesta di chiarimento inviata
              type: bool
              required: true
            - key: noteChiarimento
              label: A chi e cosa è stato chiesto
              type: textarea

        # --- Presa visione: c'è da leggere, non da registrare ---
        - id: visione
          type: Task
          name: Presa visione del referente
          performer: HumanOnly
          roleName: Referente agenda
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 1440
          form:
            - key: proposta
              label: Comunicazione
              type: textarea
              context: true
            - key: presaVisione
              label: Presa visione
              type: bool
              required: true
            - key: noteVisione
              label: Annotazioni
              type: textarea

        # --- Udienza nuova, scadenza, attività: si assegna a una persona ---
        - id: assegna
          type: Task
          name: Assegna al professionista
          performer: HumanOnly
          roleName: Referente agenda
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 1440
          form:
            - key: tipo
              label: Di che si tratta
              type: text
              context: true
            - key: dataUdienza
              label: Data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: professionista
              label: Professionista incaricato
              type: user
              required: true
              description: Riceverà il compito direttamente nella sua lista

        # Attività senza data: un compito alla persona, niente calendario.
        - id: compito-attivita
          type: Task
          name: Attività da fare
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: proposta
              label: Cosa va fatto
              type: textarea
              context: true
            - key: tipoAdempimento
              label: Attività
              type: text
              context: true
            - key: fatto
              label: Fatto
              type: bool
              required: true
            - key: noteAttivita
              label: Esito o annotazioni
              type: textarea

        - id: registra
          type: Task
          name: Registra sul calendario comune
          # Udienza nuova e scadenza: lo stesso agente, il tipo nel prompt. Sta PRIMA della
          # conferma del professionista perché la conferma serva anche a questo.
          performer: Automated
          agentTaskName: Registrazione udienza
          outputVariable: esitoRegistrazione
          expectedDurationMinutes: 2
          # Agente con server MCP dentro un processo: è esattamente il caso dell'issue #1000. Senza
          # soglia, una registrazione mai tornata lascerebbe l'udienza fuori dall'agenda in silenzio.
          maxLeadTimeMinutes: 30

        - id: conferma
          type: Task
          name: Conferma del professionista
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: tipo
              label: Di che si tratta
              type: text
              context: true
            - key: dataUdienza
              label: Data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: tipoAdempimento
              label: Cosa va fatto
              type: text
              context: true
            - key: proposta
              label: Estremi e altre attività menzionate
              type: textarea
              context: true
            - key: esitoRegistrazione
              label: Calendario comune
              type: textarea
              context: true
              description: >
                Cosa ha fatto l'assistente sul calendario. La prima riga dice tutto: REGISTRATO,
                GIÀ PRESENTE o NON REGISTRATO — in quest'ultimo caso NON è in agenda.
            - key: presaVisione
              label: Presa visione
              type: bool
              required: true
            - key: terminiDaPresidiare
              label: Termini da presidiare
              type: textarea
              description: I termini collegati, scritti dal professionista.

        # --- Rinvio: si sposta l'impegno che c'è, non se ne crea un altro ---
        - id: aggiorna
          type: Task
          name: Indica l'udienza da spostare
          performer: HumanOnly
          roleName: Referente agenda
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 480
          form:
            - key: dataUdienza
              label: Nuova data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: udienzaPrecedente
              label: Udienza da spostare
              type: text
              required: true
              description: Link all'evento a calendario, oppure numero di ruolo e data precedente
            - key: professionista
              label: Professionista che segue il fascicolo
              type: user
              required: true
              description: Riceverà l'avviso del rinvio nella sua lista

        - id: sposta
          type: Task
          name: Sposta l'udienza sul calendario comune
          performer: Automated
          agentTaskName: Spostamento udienza
          outputVariable: esitoSpostamento
          expectedDurationMinutes: 2
          maxLeadTimeMinutes: 30          # vedi «registra»: stesso agente, stesso rischio (#1000)

        - id: avvisa-rinvio
          type: Task
          name: Avviso del rinvio al professionista
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 2880
          form:
            - key: dataUdienza
              label: Nuova data
              type: date
              context: true
            - key: sede
              label: Sede e sezione
              type: text
              context: true
            - key: udienzaPrecedente
              label: Udienza spostata
              type: text
              context: true
            - key: proposta
              label: Estremi e altre attività menzionate
              type: textarea
              context: true
            - key: esitoSpostamento
              label: Calendario comune
              type: textarea
              context: true
              description: >
                SPOSTATO: l'impegno è sulla nuova data. NON REGISTRATO: l'impegno precedente non è
                stato trovato, e il calendario va sistemato a mano.
            - key: presaVisioneRinvio
              label: Presa visione del rinvio
              type: bool
              required: true
            - key: terminiDaPresidiare
              label: Termini da presidiare
              type: textarea
              description: >
                Sulla NUOVA data: un rinvio sposta anche i termini collegati, ed è il caso in cui
                è più facile dimenticarne uno.

        - id: fine
          type: End
          name: Pratica chiusa

      gateways:
        - id: filtro
          type: Exclusive
          name: C'è una comunicazione?
        - id: completezza
          type: Exclusive
          name: Estremi completi?
        - id: smista
          type: Exclusive
          name: Di che si tratta?
        - id: dopo-assegnazione
          type: Exclusive
          name: Va in calendario?

      # Le condizioni su `tipo` confrontano per stringa senza distinguere le maiuscole. Il flusso
      # senza condizione è il default, e in entrambi i gateway porta a un compito UMANO: da
      # «smista» all'assegnazione, da «dopo-assegnazione» all'attività. Un valore imprevisto del
      # classificatore finisce davanti a una persona, mai davanti all'agente che scrive in agenda.
      flows:
        - from: start
          to: filtro
        - from: filtro
          to: nessun-avviso
          condition: { var: testoAvviso, op: eq, value: NESSUN AVVISO }
          label: nessuna comunicazione
        - from: filtro
          to: classifica
          label: comunicazione
        - from: classifica
          to: estrai
        - from: estrai
          to: verifica
        - from: verifica
          to: completezza
        - from: completezza
          to: chiarimenti
          condition: { var: datiCompleti, op: eq, value: false }
          label: da chiarire
        - from: chiarimenti
          to: verifica
        - from: completezza
          to: smista
          label: completi
        - from: smista
          to: aggiorna
          condition: { var: tipo, op: eq, value: Rinvio }
          label: rinvio
        - from: smista
          to: visione
          condition: { var: tipo, op: eq, value: Visione }
          label: presa visione
        - from: smista
          to: assegna
          label: udienza, scadenza, attività
        - from: visione
          to: fine
        - from: assegna
          to: dopo-assegnazione
        # Le condizioni portano al calendario; il default è il compito a una persona. Così un
        # valore imprevisto del classificatore (un accento perso, una parola in più) finisce
        # davanti a qualcuno, non davanti all'agente che scrive in agenda.
        - from: dopo-assegnazione
          to: registra
          condition: { var: tipo, op: eq, value: Udienza }
          label: udienza
        - from: dopo-assegnazione
          to: registra
          condition: { var: tipo, op: eq, value: Scadenza }
          label: scadenza
        - from: dopo-assegnazione
          to: compito-attivita
          label: attività
        - from: compito-attivita
          to: fine
        - from: registra
          to: conferma
        - from: conferma
          to: fine
        - from: aggiorna
          to: sposta
        - from: sposta
          to: avvisa-rinvio
        - from: avvisa-rinvio
          to: fine

# ----------------------------------------------------------------------------------------------
# Il calendario Google del penale: perché non è qui
# ----------------------------------------------------------------------------------------------
# L'assessment prevede, nel transitorio, di leggere in sola lettura il calendario Google del
# penale tramite il suo indirizzo iCal privato, senza toccare l'account. Tecnicamente è un GET
# HTTP, quindi sembrerebbe un tool MCP come gli altri. Non lo è, per due ragioni indipendenti.
#
# 1. **Quell'indirizzo È la credenziale.** Chi ha l'URL legge il calendario, punto. E un
#    riferimento a un segreto il planner lo risolve SOLO in auth.clientId, auth.clientSecret,
#    auth.secret e auth.password (BlueprintPlanner.CollectSecretKeys): non in baseUrl, non in
#    mcpServers[].variables, non nel path di un tool. Scriverlo qui significherebbe committare
#    in chiaro la chiave di lettura dell'agenda penale — esattamente ciò che la regola 5 dei
#    blueprint vieta, e per un motivo che qui è molto concreto.
#
# 2. **La risposta è text/calendar, non JSON.** Il `transform` di un tool builder lavora su una
#    risposta già deserializzata; un ICS andrebbe prima parsato a mano in JavaScript, dentro il
#    manifest. È il genere di cosa che funziona il primo giorno e si rompe al primo evento
#    ricorrente.
#
# Le tre strade, in ordine di preferenza:
#   a) far confluire il calendario Google in quello comune — è il punto d'arrivo che
#      l'assessment indica comunque, e toglie il problema invece di aggirarlo;
#   b) creare la connessione a mano dall'interfaccia, dove il token finisce in un campo
#      credenziale e non in git, e collegarci poi un server MCP: il blueprint non la crea, ma
#      nemmeno la ostacola;
#   c) attendere che i riferimenti ai segreti siano risolti anche fuori da `auth`, che è una
#      modifica al planner, non a questo file.
