              label: Riga della designazione
              type: textarea
              required: true
              description: Come è stata dettata in riunione, senza riscriverla
            - key: dataUdienza
              label: Data dell'udienza
              type: date
              required: true
            - key: oraUdienza
              label: Ora
              type: text
            - key: sede
              label: Autorità, sede e sezione
              type: text
            - key: parti
              label: Parti
              type: text
            - key: fascicolo
              label: Fascicolo o numero di ruolo
              type: text
            - key: professionistaProposto
              label: Professionista designato in riunione
              type: text
            - key: materia
              label: Materia
              type: select
              options: [Penale, Civile]
            - key: fonte
              label: Da dove arriva
              type: select
              options: [riunione, chat, altro]

        # Un clic per designazione: il referente sceglie la persona con il selettore utente —
        # `assignmentExpression` risolve un id UTENTE, e un nome dettato non assegna niente — e
        # ricopia il nome per il calendario. Sono due campi e non uno per la ragione già vista
        # con `tipoProposto`/`tipo` (v11): un campo modificabile non viene precompilato dal
        # caseData, quindi la proposta si mostra in sola lettura accanto al campo da compilare.
        - id: conferma
          type: Task
          name: Conferma della designazione
          performer: HumanOnly
          roleName: Referente agenda penale
          expectedDurationMinutes: 2
          maxLeadTimeMinutes: 1440
          form:
            - key: testoRiga
              label: Riga della designazione
              type: textarea
              context: true
            - key: dataUdienza
              label: Data dell'udienza
              type: date
              context: true
            - key: oraUdienza
              label: Ora
              type: text
              context: true
            - key: sede
              label: Autorità, sede e sezione
              type: text
              context: true
            - key: parti
              label: Parti
              type: text
              context: true
            - key: professionistaProposto
              label: Designato in riunione
              type: text
              context: true
            - key: professionista
              label: Professionista incaricato
              type: user
              required: true
              description: Riceverà il compito di comunicare l'esito, il giorno dell'udienza
            - key: professionistaNome
              label: Nome da scrivere in agenda
              type: text
              required: true
              description: >
                Di norma è il designato qui sopra. In calendario va il nome, mai un codice.
            - key: designazioneConfermata
              label: Data, autorità e parti sono corrette
              type: bool
              required: true

        - id: correzione
          type: Task
          name: Correggi gli estremi della designazione
          performer: HumanOnly
          roleName: Referente agenda penale
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 1440
          form:
            - key: testoRiga
              label: Riga della designazione
              type: textarea
              context: true
            - key: dataUdienza
              label: Data dell'udienza
              type: date
              required: true
            - key: oraUdienza
              label: Ora
              type: text
            - key: sede
              label: Autorità, sede e sezione
              type: text
            - key: parti
              label: Parti
              type: text
            - key: fascicolo
              label: Fascicolo o numero di ruolo
              type: text

        - id: abbina
          type: Task
          name: Annota la designazione sul calendario
          performer: Automated
          agentTaskName: Abbinamento designazione penale
          outputVariable: esitoAbbinamento
          expectedDurationMinutes: 2
          # Agente con server MCP dentro un processo: è il caso dell'issue #1000, dove un'esecuzione
          # che non torna lascia il token fermo in silenzio. La soglia lo rende visibile.
          maxLeadTimeMinutes: 30

        # Il compito compare nella lista del designato appena la designazione è confermata, cioè
        # fino a una settimana prima dell'udienza: è esattamente ciò che il cliente chiede — «il
        # sistema sappia che nella giornata di lunedì Andrea sarà in udienza».
        #
        # ⚠️ La soglia qui NON è la scadenza. `maxLeadTimeMinutes` conta dall'arrivo del token, non
        # dalla data dell'udienza, e il motore non ha eventi temporali: sette giorni sono un
        # fondo scala, non un impegno. La scadenza vera — «entro quella giornata» — la presidia il
        # task schedulato «Chiamata esiti», che alle 18:30 guarda gli impegni di oggi.
        - id: esito
          type: Task
          name: Comunica l'esito dell'udienza
          performer: HumanOnly
          assignmentExpression: professionista
          expectedDurationMinutes: 5
          maxLeadTimeMinutes: 10080
          form:
            - key: dataUdienza
              label: Data dell'udienza
              type: date
              context: true
            - key: sede
              label: Autorità, sede e sezione
              type: text
              context: true
            - key: parti
              label: Parti
              type: text
              context: true
            - key: testoRiga
              label: Designazione
              type: textarea
              context: true
            - key: esitoAbbinamento
              label: Calendario comune
              type: textarea
              context: true
              description: >
                Cosa ha trovato l'assistente sul calendario. Se dice NON TROVATA, l'impegno non
                c'è e va sistemato a mano.
            - key: esito
              label: Com'è andata
              type: select
              required: true
              options: [Rinviata, Trattenuta in decisione, Definita, Non tenuta, Altro]
            - key: nuovaData
              label: Nuova data (se rinviata)
              type: date
            - key: nuovaOra
              label: Nuova ora (se indicata)
              type: text
            - key: terminiAssegnati
              label: Termini assegnati
              type: textarea
              description: >
                Scritti dal professionista. Il sistema non li calcola: su questa materia un
                errore non si recupera.
            - key: noteEsito
              label: Adempimenti e annotazioni
              type: textarea

        - id: annota-esito
          type: Task
          name: Annota l'esito sul calendario
          performer: Automated
          agentTaskName: Annotazione esito penale
          outputVariable: esitoAnnotazione
          expectedDurationMinutes: 2
          maxLeadTimeMinutes: 30

        - id: redigi-rinvio
          type: Task
          name: Scrivi la comunicazione di rinvio
          performer: Automated
          agentTaskName: Redazione comunicazione di rinvio
          outputVariable: testoRinvio
          expectedDurationMinutes: 1
          maxLeadTimeMinutes: 30

        # Il rinvio non si registra qui: lo registra la presa in carico, con la verifica del
        # referente e lo spostamento senza doppioni che sono già collaudati. La CallActivity apre
        # quell'istanza e ne aspetta la fine, così l'albero dice a colpo d'occhio da dove viene la
        # pratica. Il mapping copia valori ({"destinazione": "sorgente"}): non compone testo, ed è
        # la ragione per cui il passo qui sopra esiste.
        - id: deriva-rinvio
          type: CallActivity
          name: Riapre la presa in carico per il rinvio
          calledProcessName: Presa in carico di una comunicazione (penale)
          inputMapping:
            testoAvviso: testoRinvio
            fonte: fonte
            materia: materia
            fascicolo: fascicolo
          expectedDurationMinutes: 60
          maxLeadTimeMinutes: 2880

        - id: fine
          type: End
          name: Designazione chiusa

      gateways:
        - id: conferma-ok
          type: Exclusive
          name: Estremi corretti?
        - id: derivazioni
          type: Exclusive
          name: Che cosa ne deriva?

      # Il flusso senza condizione è il default, e in entrambi i gateway porta avanti la strada
      # normale: una designazione confermata prosegue, un esito che non è un rinvio chiude. Un
      # valore imprevisto non manda mai un token in un ramo che scrive.
      flows:
        - from: start
          to: conferma
        - from: conferma
          to: conferma-ok
        - from: conferma-ok
          to: correzione
          condition: { var: designazioneConfermata, op: eq, value: false }
          label: da correggere
        - from: correzione
          to: conferma
        - from: conferma-ok
          to: abbina
          label: confermata
        - from: abbina
          to: esito
        - from: esito
          to: annota-esito
        - from: annota-esito
          to: derivazioni
        - from: derivazioni
          to: redigi-rinvio
          condition: { var: esito, op: eq, value: Rinviata }
          label: rinviata
        - from: redigi-rinvio
          to: deriva-rinvio
        - from: deriva-rinvio
          to: fine
        - from: derivazioni
          to: fine
          label: niente da riaprire

# ----------------------------------------------------------------------------------------------
# Il calendario Google del penale: perché non è qui
# ----------------------------------------------------------------------------------------------
# L'assessment prevede, nel transitorio, di leggere in sola lettura il calendario Google del
# penale tramite il suo indirizzo iCal privato, senza toccare l'account. Tecnicamente è un GET
# HTTP, quindi sembrerebbe un tool MCP come gli altri. Non lo è, per due ragioni indipendenti.
#
# 1. **Quell'indirizzo È la credenziale.** Chi ha l'URL legge il calendario, punto. E un
#    riferimento a un segreto il planner lo risolve SOLO in auth.clientId, auth.clientSecret,
#    auth.secret e auth.password (BlueprintPlanner.CollectSecretKeys): non in baseUrl, non in
#    mcpServers[].variables, non nel path di un tool. Scriverlo qui significherebbe committare
#    in chiaro la chiave di lettura dell'agenda penale — esattamente ciò che la regola 5 dei
#    blueprint vieta, e per un motivo che qui è molto concreto.
#
# 2. **La risposta è text/calendar, non JSON.** Il `transform` di un tool builder lavora su una
#    risposta già deserializzata; un ICS andrebbe prima parsato a mano in JavaScript, dentro il
#    manifest. È il genere di cosa che funziona il primo giorno e si rompe al primo evento
#    ricorrente.
#
# Le tre strade, in ordine di preferenza:
#   a) far confluire il calendario Google in quello comune — è il punto d'arrivo che
#      l'assessment indica comunque, e toglie il problema invece di aggirarlo;
#   b) creare la connessione a mano dall'interfaccia, dove il token finisce in un campo
#      credenziale e non in git, e collegarci poi un server MCP: il blueprint non la crea, ma
#      nemmeno la ostacola;
#   c) attendere che i riferimenti ai segreti siano risolti anche fuori da `auth`, che è una
#      modifica al planner, non a questo file.


# ----------------------------------------------------------------------------------------------
# Perché questa versione non è applicata, e cosa serve per applicarla
# ----------------------------------------------------------------------------------------------
# La v29 nasce per il tenant di PRODUZIONE dello Studio, e da riga di comando quel tenant oggi non
# è raggiungibile. Non è un permesso che manca: è una protezione scritta apposta.
#
# In produzione l'elenco dei tenant lo filtra il SERVER, sulla chiave `Companies:ListingFilter` di
# App Configuration — oggi il frammento «hevolus» — e la CLI rifiuta con exit 3 anche un
# `--company` scritto a mano che non sia in quell'elenco (`TenantChoice.Decide`: in produzione
# «non poter verificare non è una ragione per procedere»). Provisionare l'ambiente di un cliente in
# produzione, dice la documentazione, si fa dall'interfaccia.
#
# Le strade, in ordine di preferenza:
#   a) collaudare la v29 su STAGING, su un tenant di prova e con caselle nostre — cioè con
#      `tenant.companyId`, le due `mailbox` e il `tokenUrl` cambiati — e portare in produzione solo
#      dopo che il giro è verde;
#   b) allargare `Companies:ListingFilter` in produzione al nome del tenant dello Studio. È una
#      modifica deliberata alla protezione, con App Configuration Data Owner su prod, e va decisa
#      da chi presidia quella regola: non è un passaggio da fare di lato per sbloccare un apply;
#   c) costruire l'ambiente dall'interfaccia. Con 119 operazioni fra agenti, task, orchestratori e
#      quattro processi, è la strada che nessuno finisce.
#
# Prima di qualunque apply mancano comunque tre cose che solo il cliente può dare: il companyId di
# produzione, il Directory (tenant) ID della loro registrazione applicativa con i due segreti, e i
# due indirizzi definitivi delle caselle. Finché ci sono i segnaposto, il piano si ferma da sé.
