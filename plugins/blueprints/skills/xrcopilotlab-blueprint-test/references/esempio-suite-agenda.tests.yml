    kind: process
    target: presa-in-carico-civile
    timeoutSeconds: 300
    caseData:
      testoAvviso: |
        rossi/alfa 2a civ bari rinviata al 14/10 ore 9.30 aula 3 sempre bianchi. mettila in agenda e prepara il fascicolo x la prossima
      fonte: mail
      materia: Civile
      fascicolo: da attribuire
      mittente: avv.neri@studiopolis.it
    expect:
      process:
        events: [InstanceStarted, ActivityCompleted, ActivityCompleted, WorkItemCreated]
        completed: [classifica, estrai]
        waitingAt: verifica
        status: Running
        caseData:
          tipoProposto: "Rinvio"
          proposta: "14/10"
    tags: [process]

