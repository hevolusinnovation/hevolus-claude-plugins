# Suite di collaudo del blueprint «studiopolis-agenda» (tag STUDIOPOLIS).
#
# Dalla v10 lo scenario è l'ORGANIZER dello Studio, e i casi seguono quell'ordine: prima la mail
# scomposta dell'avvocato e il dettato in chat, poi le comunicazioni dell'autorità di ogni tipo.
# Copre il classificatore (una parola, su cui il processo si biforca), l'agente Agenda (estrazione),
# l'Assistente agenda in chat (rilegge e chiede conferma; apri_pratica non si esercita qui perché
# aprirebbe una pratica: vedi la suite di scrittura), la Riconciliazione, il processo con i suoi
# cinque ingressi, e — con il tag «simulata» — la logica degli agenti che leggono posta e
# calendario, alimentata con un testo di prova al posto della casella.
#
#   xrcopilotlab-bp test run blueprints/tests/studiopolis-agenda.tests.yml --env staging --company <guid> --only classificatore,agenda,assistente,riconciliatore,process
#   xrcopilotlab-bp test run blueprints/tests/studiopolis-agenda.tests.yml --env staging --company <guid> --only simulata
#
# Le letture VERE di casella e calendario sono in studiopolis-agenda-casella.tests.yml, da lanciare
# quando la casella di collaudo o quella del cliente è operativa; la scrittura sul calendario in
# studiopolis-agenda-scrittura.tests.yml.
#
# Dalla v5 l'agente Termini non esiste più (collaudo del 13/09/2026: date sbagliate e instabili), e
# i suoi tre casi sono stati tolti. La registrazione sul calendario è automatica, ma scrive: i suoi
# casi stanno in studiopolis-agenda-scrittura.tests.yml.
#
# Le entità si risolvono dall'ultimo run completato del tag: su un tenant dove è applicata una
# versione precedente del manifest, i casi sulle entità che non esistono escono in errore
# «non trovato» — è l'informazione giusta, non un difetto della suite.

blueprint: studiopolis-agenda
tag: STUDIOPOLIS
version: 10
description: Collaudo dello scenario Agenda di Studio Polis

defaults:
  language: it
  # Per conto di chi si parla e si avvia il processo. Senza, la CLI usa il nome utente del
  # sistema operativo («gzileni»), che non è membro di «Referente agenda»: l'avvio del processo
  # esce 403 «Non autorizzato ad avviare questo processo» (collaudo del 13/09/2026).
  userId: giuseppe.zileni@hevolus.it
  timeoutSeconds: 180

cases:
  # ════════════════════════════════════════════════════════════════════════════════════════
  # Classificatore — una parola, e il processo si biforca su quella
  # ════════════════════════════════════════════════════════════════════════════════════════
  # La risposta è la variabile di un gateway: si verifica con `matches` sull'INTERA risposta,
  # perché «Rinvio.» o «Tipo: Rinvio» prenderebbero il ramo di default.

  - key: classificatore-mail-rinvio-sgangherata
    name: "Classificatore: la mail scomposta dell'avvocato è un Rinvio"
    kind: agent
    target: classificatore
    message: |
      rossi/alfa 2a civ bari rinviata al 14/10 ore 9.30 aula 3 sempre bianchi. mettila in agenda e prepara il fascicolo x la prossima
    expect:
      answer: "Esattamente «Rinvio», niente altro."
      matches: ["(?i)^\\s*rinvio\\s*$"]
      noError: true
      maxSeconds: 30
    tags: [agent, classificatore]

  - key: classificatore-dettato-attivita
    name: "Classificatore: un dettato senza date è un'Attività"
    kind: agent
    target: classificatore
    message: |
      sì allora per la verdi contro beta ricordami di chiamare il ctu giovedì e di chiedere copia del verbale alla cancelleria
    expect:
      answer: "Esattamente «Attività»: c'è da fare, non c'è una data scritta («giovedì» non è una data)."
      matches: ["(?i)^\\s*attivit[àa]\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-scadenza-con-data
    name: "Classificatore: un deposito con data scritta è una Scadenza"
    kind: agent
    target: classificatore
    message: |
      Memoria ex art. 183 c.p.c. nel Rossi c/ Alfa R.G. 4127/2025: va depositata entro il 30 settembre 2026.
    expect:
      matches: ["(?i)^\\s*scadenza\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-termine-senza-data
    name: "Classificatore: «entro trenta giorni» senza data NON è una Scadenza"
    kind: agent
    target: classificatore
    message: |
      Notificato oggi il decreto ingiuntivo Gialli c/ Gamma: l'opposizione va fatta entro quaranta giorni dalla notifica.
    expect:
      answer: "«Attività»: la data non è scritta e il classificatore non la calcola."
      matches: ["(?i)^\\s*attivit[àa]\\s*$"]
      wrongAnswers:
        - pattern: "(?i)^\\s*scadenza"
          means: "Ha dedotto una data che nel testo non c'è: è il computo dei termini, fuori scenario dalla v5"
          suspect: Manifest
      noError: true
    tags: [agent, classificatore, negative]

  - key: classificatore-cancelleria-udienza
    name: "Classificatore: la comunicazione di cancelleria di prima fissazione è un'Udienza"
    kind: agent
    target: classificatore
    message: |
      TRIBUNALE ORDINARIO DI BARI — Sezione Seconda Civile
      R.G. n. 4127/2025 — Rossi Mario c/ Alfa S.r.l.
      Si comunica che l'udienza di comparizione delle parti è fissata per il giorno 14 ottobre 2026 alle ore 9:30, aula 3.
    expect:
      matches: ["(?i)^\\s*udienza\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-visione
    name: "Classificatore: una comunicazione senza niente da fare è Visione"
    kind: agent
    target: classificatore
    message: |
      Si comunica che il fascicolo R.G. 5310/2025 Verdi c/ Beta è stato assegnato alla dott.ssa Neri in sostituzione del dott. Blu. La Cancelleria.
    expect:
      matches: ["(?i)^\\s*visione\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-piu-cose-vince-rinvio
    name: "Classificatore: più cose in un messaggio, vince il Rinvio"
    kind: agent
    target: classificatore
    message: |
      la gialli/gamma è stata rinviata al 12 marzo, prepara il fascicolo per la prossima e ricordami di chiamare il ctu giovedì
    expect:
      matches: ["(?i)^\\s*rinvio\\s*$"]
      noError: true
    tags: [agent, classificatore]

  # ════════════════════════════════════════════════════════════════════════════════════════
  # Agenda — estrazione degli estremi, senza dedurre e senza calcolare
  # ════════════════════════════════════════════════════════════════════════════════════════
  # Prima il caso che conta di più: la mail scomposta dell'avvocato.

  - key: agenda-mail-sgangherata
    name: "Agenda: la mail scomposta dell'avvocato, letta come la leggerebbe la segretaria"
    kind: agent
    target: agenda
    message: |
      Tipo: Rinvio. Fonte: mail. Materia: Civile. Fascicolo: da attribuire.

      rossi/alfa 2a civ bari rinviata al 14/10 ore 9.30 aula 3 sempre bianchi. mettila in agenda e prepara il fascicolo x la prossima
    expect:
      answer: >
        Data 14/10 ore 9:30 (anno non indicato); Tribunale di Bari, Seconda sezione civile;
        numero di ruolo «non indicato»; parti Rossi c/ Alfa; rinvio; giudice Bianchi; data
        precedente «non indicato»; altre attività: preparare il fascicolo. Non inventa l'anno,
        non inventa il numero di ruolo.
      contains: ["14/10", "9:30", "Rossi", "Alfa", "Bianchi", "non indicato", "fascicolo"]
      notContains: ["4127"]
      noError: true
    tags: [agent, agenda]

  - key: agenda-dettato-piu-cose
    name: "Agenda: dettato con tre cose dentro — la principale e le altre, separate"
    kind: agent
    target: agenda
    message: |
      Tipo: Rinvio. Fonte: chat. Materia: Civile. Fascicolo: da attribuire.

      la gialli/gamma è stata rinviata al 12 marzo, prepara il fascicolo per la prossima e ricordami di chiamare il ctu giovedì
    expect:
      answer: >
        Voce principale: rinvio al 12 marzo (anno e ora non indicati), parti Gialli c/ Gamma.
        Altre attività menzionate, una per riga: preparare il fascicolo; chiamare il CTU giovedì
        («giovedì» resta così, non diventa una data).
      contains: ["12 marzo", "Gialli", "fascicolo", "CTU", "giovedì"]
      noError: true
    tags: [agent, agenda]


  - key: agenda-avviso-completo
    name: "Agenda: avviso completo, tutti gli estremi"
    kind: agent
    target: agenda
    message: |
      Tipo: Udienza. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      TRIBUNALE ORDINARIO DI BARI — Sezione Seconda Civile
      R.G. n. 4127/2025 — Rossi Mario c/ Alfa S.r.l.
      Si comunica che l'udienza di comparizione delle parti è fissata per il giorno
      14 ottobre 2026 alle ore 9:30, aula 3, dinanzi al Giudice dott.ssa Bianchi.
      La Cancelleria
    expect:
      answer: >
        Sei voci, tutte valorizzate: data e ora 14 ottobre 2026 ore 9:30; Tribunale di Bari,
        Sezione Seconda Civile; R.G. 4127/2025; parti Rossi Mario c/ Alfa S.r.l.; adempimento
        udienza (di comparizione); giudice dott.ssa Bianchi. Nessun termine proposto.
      contains: ["14 ottobre 2026", "9:30", "4127/2025", "Bianchi", "Rossi"]
      notContains: ["termine per", "scadenza"]
      wrongAnswers:
        - pattern: "(?i)(ho|è stat[oa]|sono stat[ie]) (registrat|creat|inserit|aggiunt)"
          means: >
            L'agente di estrazione ha scritto in calendario. Ha gli strumenti m365 (anche
            crea_evento) e la pipeline MCP aggiunge al messaggio «Use the available MCP tools…»,
            ma nessun passo del processo gli chiede di registrare: la registrazione è del referente.
          suspect: Manifest
      language: it
      noError: true
      maxSeconds: 60
    tags: [agent, agenda]

  - key: agenda-avviso-incompleto
    name: "Agenda: avviso incompleto, «non indicato» dove manca"
    kind: agent
    target: agenda
    message: |
      Tipo: Rinvio. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      Si comunica che l'udienza è rinviata al 3 novembre 2026. Tribunale di Bari.
    expect:
      answer: >
        Data 3 novembre 2026; ora, sezione, numero di ruolo, parti e giudice «non indicato»;
        adempimento «rinvio». Non stima un orario, non inventa un numero di ruolo.
      contains: ["3 novembre 2026", "non indicato", "rinvio"]
      noError: true
    tags: [agent, agenda, negative]

  - key: agenda-non-calcola-termini
    name: "Agenda: non calcola termini anche se glielo chiedono"
    kind: agent
    target: agenda
    message: |
      Tipo: Udienza. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      Udienza il 14 ottobre 2026 al Tribunale di Bari, Seconda Civile, R.G. 4127/2025.
      Mi dici anche entro quando va depositata la memoria ex art. 183 c.p.c.?
    expect:
      answer: >
        Riporta gli estremi e dichiara che non calcola termini processuali. Non propone una
        data di deposito.
      notContains: ["giorni prima", "entro il"]
      noError: true
    tags: [agent, agenda, negative]

  - key: agenda-due-procedimenti
    name: "Agenda: avviso ambiguo su due procedimenti"
    kind: agent
    target: agenda
    message: |
      Tipo: Udienza. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      Si comunicano le udienze del 14 ottobre 2026 ore 9:30 (R.G. 4127/2025, Rossi c/ Alfa)
      e del 21 ottobre 2026 ore 11:00 (R.G. 5310/2025, Verdi c/ Beta), Tribunale di Bari.
    expect:
      answer: >
        Non sceglie uno dei due: riporta entrambi, oppure segnala in fondo che il testo si
        riferisce a più procedimenti.
      contains: ["4127/2025", "5310/2025"]
      noError: true
    tags: [agent, agenda]

  # ════════════════════════════════════════════════════════════════════════════════════════
  # Riconciliazione agende — confronta due elenchi dati, senza strumenti
  # ════════════════════════════════════════════════════════════════════════════════════════

  - key: riconciliatore-quattro-sezioni
    name: "Riconciliazione: le quattro sezioni, «nessuno» dove è vuota"
    kind: agent
    target: riconciliatore
    message: |
      Avvisi arrivati in casella:
      14/10/2026 09:30 — Tribunale di Bari, Seconda Civile — R.G. 4127/2025 — Rossi c/ Alfa — cancelleria
      21/10/2026 11:00 — Tribunale di Bari, Prima Civile — R.G. 5310/2025 — Verdi c/ Beta — cancelleria

      Impegni sul calendario comune:
      14/10/2026 10:30 — Udienza Rossi c/ Alfa R.G. 4127/2025 — Tribunale di Bari — avv. Neri
      28/10/2026 09:00 — Udienza Gialli c/ Gamma R.G. 2201/2025 — Tribunale di Trani — avv. Neri
      28/10/2026 09:00 — Udienza Gialli/Gamma — Trani — (nessuna annotazione)
    expect:
      answer: >
        Quattro sezioni nell'ordine: (1) avvisi senza impegno: Verdi c/ Beta R.G. 5310/2025;
        (2) impegni senza avviso: Gialli c/ Gamma, detto come ipotesi (avviso forse più vecchio
        della finestra); (3) doppioni: i due impegni del 28/10 su Gialli/Gamma; (4) divergenze:
        Rossi c/ Alfa con 09:30 in casella e 10:30 a calendario, i due valori affiancati senza
        dire quale è giusto.
      contains: ["5310/2025", "09:30", "10:30", "Gialli"]
      notContains: ["nessuna differenza"]
      noError: true
      noSkills: true
    tags: [agent, riconciliatore]

  - key: riconciliatore-tutto-allineato
    name: "Riconciliazione: elenchi coincidenti, quattro «nessuno»"
    kind: agent
    target: riconciliatore
    message: |
      Avvisi arrivati in casella:
      14/10/2026 09:30 — Tribunale di Bari — R.G. 4127/2025 — Rossi c/ Alfa — cancelleria

      Impegni sul calendario comune:
      14/10/2026 09:30 — Udienza Rossi c/ Alfa R.G. 4127/2025 — Tribunale di Bari — avv. Neri
    expect:
      answer: >
        Le quattro sezioni compaiono tutte, ciascuna con «nessuno»: sapere che il controllo è
        stato fatto vale quanto il risultato.
      contains: ["nessuno"]
      noError: true
    tags: [agent, riconciliatore, negative]

  # ════════════════════════════════════════════════════════════════════════════════════════
  # Assistente agenda — il dettato in chat: rilegge e chiede conferma, non apre da solo
  # ════════════════════════════════════════════════════════════════════════════════════════
  # apri_pratica apre una pratica vera: qui si verifica il passo PRIMA della chiamata. La chiamata
  # si prova a mano (mcp test pratiche --tool apri_pratica) o in demo, e sta nella suite di scrittura.

  - key: assistente-dettato-rilegge
    name: "Assistente: al dettato risponde rileggendo e chiedendo conferma"
    kind: agent
    target: assistente
    message: |
      sì allora la rossi contro alfa quella della seconda civile è stata rinviata al quattordici ottobre alle nove e mezza aula tre sempre davanti alla bianchi mettimela in agenda
    expect:
      answer: >
        Rilegge: rinvio, Rossi c/ Alfa, Seconda civile, 14 ottobre ore 9:30, aula 3, giudice
        Bianchi, numero di ruolo non indicato. Poi UNA domanda di conferma. Non dice di aver
        aperto la pratica, non dice di aver scritto in agenda.
      contains: ["Rossi", "14 ottobre", "9:30", "Bianchi"]
      wrongAnswers:
        - pattern: "(?i)pratica (è stata )?aperta|ho aperto"
          means: "Ha chiamato apri_pratica senza aspettare il sì: in esercizio ogni dettato aprirebbe una pratica non confermata"
          suspect: Manifest
        - pattern: "(?i)(ho|è stat[oa]) (registrat|inserit|aggiunt).*(agenda|calendario)"
          means: "Dice di aver scritto in calendario: non ha quegli strumenti, sta fingendo"
          suspect: Manifest
      noError: true
    tags: [agent, assistente]

  - key: assistente-fuori-tema
    name: "Assistente: un messaggio che non riguarda un procedimento non apre niente"
    kind: agent
    target: assistente
    message: |
      ricordami di comprare il latte tornando a casa
    expect:
      answer: "Dice che non riguarda un procedimento dello Studio e non propone di aprire una pratica."
      notContains: ["Apro la pratica"]
      wrongAnswers:
        - pattern: "(?i)apro la pratica|pratica aperta"
          means: "Vuole aprire una pratica per la spesa: manca il filtro sul procedimento"
          suspect: Manifest
      noError: true
    tags: [agent, assistente, negative]

  - key: assistente-non-calcola-termini
    name: "Assistente: la richiesta di calcolare un termine viene rimandata al professionista"
    kind: agent
    target: assistente
    message: |
      udienza rossi alfa il 14 ottobre, dimmi entro quando devo depositare la memoria 183
    expect:
      answer: >
        Rilegge l'udienza e chiede conferma; sul termine dice che lo scrive il professionista nel
        compito di conferma. Non propone una data di deposito.
      notContains: ["giorni prima", "entro il"]
      noError: true
    tags: [agent, assistente, negative]

  # ════════════════════════════════════════════════════════════════════════════════════════
  # Processo — dalla comunicazione al compito del referente
  # ════════════════════════════════════════════════════════════════════════════════════════

  # Il primo compito umano è sempre la verifica: i cinque rami stanno DOPO, e dalla CLI non si
  # esercitano (bpm.md). Qui si verifica che ogni ingresso arrivi alla verifica con il `tipo` giusto
  # nel caseData: è quel valore che decide il ramo, e il referente lo vede nel modulo.

  - key: presa-in-carico-mail-avvocato
    name: "Processo: la mail scomposta dell'avvocato arriva al referente come Rinvio"
    kind: process
    target: presa-in-carico
    timeoutSeconds: 300
    caseData:
      testoAvviso: |
        rossi/alfa 2a civ bari rinviata al 14/10 ore 9.30 aula 3 sempre bianchi. mettila in agenda e prepara il fascicolo x la prossima
      fonte: mail
      materia: Civile
      fascicolo: da attribuire
      mittente: avv.neri@studiopolis.it
    expect:
      process:
        events: [InstanceStarted, ActivityCompleted, ActivityCompleted, WorkItemCreated]
        completed: [classifica, estrai]
        waitingAt: verifica
        status: Running
        caseData:
          tipo: "Rinvio"
          proposta: "14/10"
    tags: [process]

  - key: presa-in-carico-dettato-chat
    name: "Processo: il dettato in chat, come lo manda apri_pratica, arriva al referente come Attività"
    kind: process
    target: presa-in-carico
    timeoutSeconds: 300
    caseData:
      testoAvviso: |
        sì allora per la verdi contro beta ricordami di chiamare il ctu giovedì e di chiedere copia del verbale alla cancelleria
      fonte: chat
      materia: Civile
      fascicolo: da attribuire
      mittente: chat
    expect:
      process:
        completed: [classifica, estrai]
        waitingAt: verifica
        status: Running
        caseData:
          tipo: "Attivit"
          proposta: "CTU"
    tags: [process]

  - key: presa-in-carico-avvio
    name: "Processo: la comunicazione di cancelleria arriva al referente come Udienza"
    kind: process
    target: presa-in-carico
    timeoutSeconds: 300
    caseData:
      testoAvviso: |
        TRIBUNALE ORDINARIO DI BARI — Sezione Seconda Civile
        R.G. n. 4127/2025 — Rossi Mario c/ Alfa S.r.l.
        Si comunica che l'udienza è fissata per il giorno 14 ottobre 2026 alle ore 9:30, aula 3.
      fonte: cancelleria
      materia: Civile
      fascicolo: 2025/118 Rossi
      mittente: cancelleria.civile.bari@giustiziacert.it
    expect:
      process:
        events: [InstanceStarted, ActivityCompleted, ActivityCompleted, WorkItemCreated]
        completed: [classifica, estrai]
        waitingAt: verifica
        status: Running
        caseData:
          tipo: "Udienza"
          proposta: "14 ottobre 2026"
    tags: [process]

  - key: presa-in-carico-scadenza
    name: "Processo: un deposito con data scritta arriva al referente come Scadenza"
    kind: process
    target: presa-in-carico
    timeoutSeconds: 300
    caseData:
      testoAvviso: |
        Memoria ex art. 183 c.p.c. nel Rossi c/ Alfa R.G. 4127/2025: va depositata entro il 30 settembre 2026.
      fonte: mail
      materia: Civile
      fascicolo: da attribuire
    expect:
      process:
        completed: [classifica, estrai]
        waitingAt: verifica
        status: Running
        caseData:
          tipo: "Scadenza"
          proposta: "30 settembre 2026"
    tags: [process]

  - key: presa-in-carico-visione
    name: "Processo: una comunicazione senza niente da fare arriva al referente come Visione"
    kind: process
    target: presa-in-carico
    timeoutSeconds: 300
    caseData:
      testoAvviso: |
        Si comunica che il fascicolo R.G. 5310/2025 Verdi c/ Beta è stato assegnato alla dott.ssa Neri in sostituzione del dott. Blu. La Cancelleria.
      fonte: cancelleria
      materia: Civile
      fascicolo: da attribuire
    expect:
      process:
        completed: [classifica, estrai]
        waitingAt: verifica
        status: Running
        caseData:
          tipo: "Visione"
    tags: [process]
    notes: >
      Riproduce la prova del 10/09/2026 (istanza 5701b965…): dall'avvio al compito «Verifica del
      referente» in una decina di secondi, con la proposta dell'agente nel case data.


  # ════════════════════════════════════════════════════════════════════════════════════════
  # Letture SIMULATE — la casella non è ancora operativa (tag «simulata»)
  # ════════════════════════════════════════════════════════════════════════════════════════
  # Finché la casella di collaudo non è sotto controllo, si collauda la LOGICA degli agenti che la
  # leggono dandogli il contenuto nel messaggio, nella forma in cui lo restituirebbero gli
  # strumenti: il corpo di una PEC, un'email di un collega, la risposta JSON di calendarView. Cosa
  # resta fuori, e sta nella tranche casella: la chiamata vera a Graph (formato delle date,
  # permessi, policy) e la finestra relativa calcolata dall'agente.
  #
  # Attenzione: gli agenti Sorveglianza, Ricognizione, Calendario e Agenda hanno il server MCP, e la
  # pipeline aggiunge al messaggio «Use the available MCP tools…». Possono provare a leggere la
  # casella vera nonostante l'istruzione: se nella risposta compare un errore di Graph o un
  # messaggio che non è nel testo di prova, è quello — e va nel giudizio.

