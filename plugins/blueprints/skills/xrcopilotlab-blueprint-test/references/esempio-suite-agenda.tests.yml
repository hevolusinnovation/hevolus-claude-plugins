  - key: sim-riconciliazione-orchestratore
    name: "Simulata · Orchestratore: le due letture in parallelo arrivano al Confronto"
    kind: orchestrator
    target: riconciliazione
    timeoutSeconds: 600
    message: |
      Lettura simulata: NON chiamare gli strumenti. La casella e il calendario comune sono già
      letti qui sotto; ciascuno usi solo la parte che gli compete. Finestra: dal 1 settembre 2026
      al 31 ottobre 2026.

      === CASELLA DI ASCOLTO (messaggi già letti con leggi_messaggio) ===
      --- Messaggio 1 ---
      Da: posta-certificata@telecompost.it
      Oggetto: POSTA CERTIFICATA: Comunicazione di cancelleria - Proc. n. 4127/2025 R.G.
      Corpo: TRIBUNALE ORDINARIO DI BARI — Sezione Seconda Civile. Proc. n. 4127/2025 R.G. —
      Rossi Mario c/ Alfa S.r.l. L'udienza è fissata per il 14/10/2026 ore 9:30. Il Cancelliere
      --- Messaggio 2 ---
      Da: luca.ferri@studiopolis.it
      Oggetto: Verdi/Beta
      Corpo: Ciao, la Verdi/Beta R.G. 5310/2025 è slittata al 16/10/2026 ore 11:00, Tribunale di
      Bari, Prima Civile. Luca
      --- Messaggio 3 ---
      Da: amministrazione@fornitore-it.it
      Oggetto: Fattura n. 318/2026
      Corpo: In allegato la fattura del canone di settembre.

      === CALENDARIO COMUNE (risposta di cerca_eventi, ora di Roma) ===
      {"value":[
       {"subject":"Udienza Rossi c/ Alfa R.G. 4127/2025",
        "start":{"dateTime":"2026-10-14T10:30:00","timeZone":"Europe/Rome"},
        "location":{"displayName":"Tribunale di Bari, Seconda Civile"},
        "body":{"content":"avv. Neri"}},
       {"subject":"Udienza Verdi c/ Beta R.G. 5310/2025",
        "start":{"dateTime":"2026-09-30T11:00:00","timeZone":"Europe/Rome"},
        "location":{"displayName":"Tribunale di Bari, Prima Civile"},
        "body":{"content":"avv. Neri"}},
       {"subject":"Udienza Gialli c/ Gamma R.G. 2201/2025",
        "start":{"dateTime":"2026-10-15T09:00:00","timeZone":"Europe/Rome"},
        "location":{"displayName":"Tribunale di Trani"},
        "body":{"content":"avv. Neri"}},
       {"subject":"Udienza Gialli/Gamma",
        "start":{"dateTime":"2026-10-15T09:00:00","timeZone":"Europe/Rome"},
        "location":{"displayName":"Trani"},
        "body":{"content":""}}
      ]}
    expect:
      answer: >
        Il Confronto produce le quattro sezioni a partire da ciò che hanno restituito Ricognizione e
        Calendario: (1) avvisi senza impegno — nessuno; (2) impegni senza avviso — Gialli c/ Gamma
        R.G. 2201/2025, come ipotesi; (3) doppioni — i due impegni del 15/10 alle 09:00 su
        Gialli/Gamma; (4) divergenze — Rossi c/ Alfa 09:30 nell'avviso e 10:30 a calendario,
        Verdi c/ Beta 16/10/2026 nell'avviso e 30/09/2026 a calendario. Niente fattura.
      steps: [letture, confronto]
      contains: ["4127/2025", "5310/2025", "Gialli"]
      matches: ["0?9[:.]30", "10[:.]30"]      # «ore 9:30» è legittimo quanto «09:30»
      notContains: ["318/2026"]
      wrongAnswers:
        - pattern: "(?i)avvisi senza impegno[^\\n]*\\n+[^\\n]*nessuno.{0,300}impegni a calendario senza avviso[^\\n]*\\n+[^\\n]*nessuno.{0,300}doppioni[^\\n]*\\n+[^\\n]*nessuno.{0,300}divergenze[^\\n]*\\n+[^\\n]*nessuno"
          means: >
            Quattro «nessuno»: il Confronto non ha ricevuto gli elenchi. È il difetto della v4 (passo
            senza inputMapping) o il messaggio di avvio che non arriva agli agenti del parallelGroup
          suspect: Orchestration
        - pattern: "(?i)16/10/2026[^\\n]{0,40}11:00[^\\n]{0,80}luca|impegno (a calendario )?(anche )?del \\*{0,2}16/10/2026"
          means: >
            Ha trattato l'email del collega come un impegno a calendario, inventando un evento del
            16/10 che il calendario non ha. Nella simulazione il messaggio di avvio porta entrambe le
            fonti e le letture le mescolano: difetto del caso più che dell'agente, ma un evento
            inventato in un confronto va segnalato
          suspect: Manifest
        - contains: "ha risposto"
          means: "Un agente di lettura ha chiamato Graph nonostante il testo fosse nel messaggio: con le credenziali rotte l'errore finisce nel confronto"
          suspect: WebApp
        - pattern: "(?i)doppioni.{0,1500}(cancelliere|telecompost|luca\\.ferri|luca\\b).{0,1500}divergenze"
          means: >
            Ha messo fra i doppioni la coppia avviso/impegno, e poi di nuovo fra le divergenze. I
            doppioni sono due impegni A CALENDARIO sulla stessa udienza, mai un avviso con un
            impegno (visto il 13/09/2026 sulla v5: Rossi e Verdi contati due volte)
          suspect: Manifest
      noError: true
    tags: [simulata, orchestrator]
    notes: >
      È l'unico modo di collaudare la catena senza la casella: il messaggio di avvio porta il
      contenuto simulato di entrambe le fonti, e ognuno dei due agenti in parallelo usa la sua parte.
      Se i due agenti non ricevono il messaggio di avvio, rispondono sulla loro finestra di default
      (e provano Graph): allora la simulazione dell'orchestratore non è possibile così, e resta
      sim-riconciliatore-rinvio-mancato per il solo Confronto.

