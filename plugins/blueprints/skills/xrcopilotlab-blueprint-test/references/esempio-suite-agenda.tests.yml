# Suite di collaudo del blueprint «studiopolis-agenda» (tag STUDIOPOLIS).
#
# Dalla v10 lo scenario è l'ORGANIZER dello Studio, e i casi seguono quell'ordine: prima la mail
# scomposta dell'avvocato e il dettato in chat, poi le comunicazioni dell'autorità di ogni tipo.
# Copre il classificatore (una parola, su cui il processo si biforca), l'agente Agenda (estrazione),
# l'Assistente agenda in chat (rilegge e chiede conferma; apri_pratica_civile non si esercita qui perché
# aprirebbe una pratica: vedi la suite di scrittura), la Riconciliazione, il processo con i suoi
# cinque ingressi, e — con il tag «simulata» — la logica degli agenti che leggono posta e
# calendario, alimentata con un testo di prova al posto della casella.
#
#   xrcopilotlab-bp test run blueprints/tests/studiopolis-agenda.tests.yml --env staging --company <guid> --only classificatore,agenda,assistente,riconciliatore,process
#   xrcopilotlab-bp test run blueprints/tests/studiopolis-agenda.tests.yml --env staging --company <guid> --only simulata
#
# Le letture VERE di casella e calendario sono in studiopolis-agenda-casella.tests.yml, da lanciare
# quando la casella di collaudo o quella del cliente è operativa; la scrittura sul calendario in
# studiopolis-agenda-scrittura.tests.yml.
#
# Dalla v5 l'agente Termini non esiste più (collaudo del 13/09/2026: date sbagliate e instabili), e
# i suoi tre casi sono stati tolti. La registrazione sul calendario è automatica, ma scrive: i suoi
# casi stanno in studiopolis-agenda-scrittura.tests.yml.
#
# Dalla v23 i casi nuovi vengono dalle comunicazioni VERE dello Studio (documentazione del cliente,
# 17/09/2026, in hevolus-assessment/customers/studiopolis/test-data). Nomi di parti, imputati e
# clienti sono sostituiti; la forma — sigle, ordine dei campi, punteggiatura, firme — è quella
# autentica, ed è la forma che si sta collaudando. Sono riconoscibili dal nome: le due righe degli
# elenchi («da segnare», «Rinvii»), il modulo del processo telematico civile, l'inoltro penale con
# la data dell'atto, l'agenda scansionata.
#
# Attenzione ai casi «sim-sorveglianza-*»: dalla v23 la Sorveglianza APRE le pratiche da sé con
# apri_pratica_civile, quindi i casi simulati le chiedono di ELENCARE le chiamate («PRATICA: …») invece di
# farle. Se un giorno un caso le facesse davvero, aprirebbe pratiche vere sul tenant.
#
# Le entità si risolvono dall'ultimo run completato del tag: su un tenant dove è applicata una
# versione precedente del manifest, i casi sulle entità che non esistono escono in errore
# «non trovato» — è l'informazione giusta, non un difetto della suite.

blueprint: studiopolis-agenda
tag: STUDIOPOLIS
version: 29
description: Collaudo dello scenario Agenda di Studio Polis

defaults:
  language: it
  # Per conto di chi si parla e si avvia il processo. Senza, la CLI usa il nome utente del
  # sistema operativo («gzileni»), che non è membro di «Referente agenda»: l'avvio del processo
  # esce 403 «Non autorizzato ad avviare questo processo» (collaudo del 13/09/2026).
  userId: giuseppe.zileni@hevolus.it
  timeoutSeconds: 180

cases:
  # ════════════════════════════════════════════════════════════════════════════════════════
  # Classificatore — una parola, e il processo si biforca su quella
  # ════════════════════════════════════════════════════════════════════════════════════════
  # La risposta è la variabile di un gateway: si verifica con `matches` sull'INTERA risposta,
  # perché «Rinvio.» o «Tipo: Rinvio» prenderebbero il ramo di default.

  - key: classificatore-mail-rinvio-sgangherata
    name: "Classificatore: la mail scomposta dell'avvocato è un Rinvio"
    kind: agent
    target: classificatore
    message: |
      rossi/alfa 2a civ bari rinviata al 14/10 ore 9.30 aula 3 sempre bianchi. mettila in agenda e prepara il fascicolo x la prossima
    expect:
      answer: "Esattamente «Rinvio», niente altro."
      matches: ["(?i)^\\s*rinvio\\s*$"]
      noError: true
      maxSeconds: 30
    tags: [agent, classificatore]

  - key: classificatore-dettato-attivita
    name: "Classificatore: un dettato senza date è un'Attività"
    kind: agent
    target: classificatore
    message: |
      sì allora per la verdi contro beta ricordami di chiamare il ctu giovedì e di chiedere copia del verbale alla cancelleria
    expect:
      answer: "Esattamente «Attività»: c'è da fare, non c'è una data scritta («giovedì» non è una data)."
      matches: ["(?i)^\\s*attivit[àa]\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-scadenza-con-data
    name: "Classificatore: un deposito con data scritta è una Scadenza"
    kind: agent
    target: classificatore
    message: |
      Memoria ex art. 183 c.p.c. nel Rossi c/ Alfa R.G. 4127/2025: va depositata entro il 30 settembre 2026.
    expect:
      matches: ["(?i)^\\s*scadenza\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-termine-senza-data
    name: "Classificatore: «entro trenta giorni» senza data NON è una Scadenza"
    kind: agent
    target: classificatore
    message: |
      Notificato oggi il decreto ingiuntivo Gialli c/ Gamma: l'opposizione va fatta entro quaranta giorni dalla notifica.
    expect:
      answer: "«Attività»: la data non è scritta e il classificatore non la calcola."
      matches: ["(?i)^\\s*attivit[àa]\\s*$"]
      wrongAnswers:
        - pattern: "(?i)^\\s*scadenza"
          means: "Ha dedotto una data che nel testo non c'è: è il computo dei termini, fuori scenario dalla v5"
          suspect: Manifest
      noError: true
    tags: [agent, classificatore, negative]

  - key: classificatore-cancelleria-udienza
    name: "Classificatore: la comunicazione di cancelleria di prima fissazione è un'Udienza"
    kind: agent
    target: classificatore
    message: |
      TRIBUNALE ORDINARIO DI BARI — Sezione Seconda Civile
      R.G. n. 4127/2025 — Rossi Mario c/ Alfa S.r.l.
      Si comunica che l'udienza di comparizione delle parti è fissata per il giorno 14 ottobre 2026 alle ore 9:30, aula 3.
    expect:
      matches: ["(?i)^\\s*udienza\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-visione
    name: "Classificatore: una comunicazione senza niente da fare è Visione"
    kind: agent
    target: classificatore
    message: |
      Si comunica che il fascicolo R.G. 5310/2025 Verdi c/ Beta è stato assegnato alla dott.ssa Neri in sostituzione del dott. Blu. La Cancelleria.
    expect:
      matches: ["(?i)^\\s*visione\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-piu-cose-vince-rinvio
    name: "Classificatore: più cose in un messaggio, vince il Rinvio"
    kind: agent
    target: classificatore
    message: |
      la gialli/gamma è stata rinviata al 12 marzo, prepara il fascicolo per la prossima e ricordami di chiamare il ctu giovedì
    expect:
      matches: ["(?i)^\\s*rinvio\\s*$"]
      noError: true
    tags: [agent, classificatore]

  # ── Le forme reali dello Studio (documentazione del cliente, 17/09/2026) ──────────────────
  # Nomi di parti e imputati sostituiti; la FORMA — sigle, punteggiatura, ordine dei campi — è
  # quella delle comunicazioni vere.

  - key: classificatore-riga-da-segnare
    name: "Classificatore: una riga dell'elenco «da segnare» è un'Udienza"
    kind: agent
    target: classificatore
    message: |
      5.11.2026 - Trib. De Rosa: Ingargiola
    expect:
      answer: "Esattamente «Udienza»: una data nuova, l'autorità con il giudice, le parti."
      matches: ["(?i)^\\s*udienza\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-riga-rinvio-collega
    name: "Classificatore: la riga del giro dei rinvii è un Rinvio"
    kind: agent
    target: classificatore
    message: |
      Oggetto: Rinvii 17.9

      Tm Mascari: Zuccaro al 15.10.2026 ore 11.00 per discussione
    expect:
      answer: "Esattamente «Rinvio»: «al <data>» su un'udienza che esisteva già."
      matches: ["(?i)^\\s*rinvio\\s*$"]
      noError: true
    tags: [agent, classificatore]

  - key: classificatore-notifica-atto-penale
    name: "Classificatore: la notifica di un atto con la data dell'atto NON è una Scadenza"
    kind: agent
    target: classificatore
    message: |
      Oggetto: I: [PM NOTI 2026/4420 BARI] - Notifica/Comunicazione atti penali

      In relazione al procedimento penale in oggetto si notifica/comunica nell'interesse di
      MARTELLI FRANCESCO quanto segue in allegato

      Avviso conclusione indagini e Informazione di Garanzia - 415 bis, 369 c.p.p. - 09/09/2026

      PROCURA DELLA REPUBBLICA PRESSO IL TRIBUNALE ORDINARIO
    expect:
      answer: >
        «Attività» o «Visione» sono entrambe difendibili — c'è qualcosa da fare, ma il testo non
        scrive nessuna data di adempimento. Quello che NON deve succedere è «Scadenza» o
        «Udienza»: il 09/09/2026 è la data dell'ATTO, e il termine di venti giorni non è scritto
        da nessuna parte. Il referente sceglie nel modulo.
      matches: ["(?i)^\\s*(attività|visione)\\s*$"]
      wrongAnswers:
        - pattern: "(?i)^\\s*scadenza\\s*$"
          means: >
            Ha letto la data dell'atto come una scadenza: in esercizio l'avviso 415 bis finirebbe
            in calendario al 09/09, che è il giorno in cui l'atto è stato emesso.
          suspect: Manifest
        - pattern: "(?i)^\\s*udienza\\s*$"
          means: "Ha letto la data dell'atto come un'udienza. Qui non c'è nessuna udienza fissata."
          suspect: Manifest
      noError: true
    tags: [agent, classificatore, negative]

  # ════════════════════════════════════════════════════════════════════════════════════════
  # Agenda — estrazione degli estremi, senza dedurre e senza calcolare
  # ════════════════════════════════════════════════════════════════════════════════════════
  # Prima il caso che conta di più: la mail scomposta dell'avvocato.

  - key: agenda-mail-sgangherata
    name: "Agenda: la mail scomposta dell'avvocato, letta come la leggerebbe la segretaria"
    kind: agent
    target: agenda
    message: |
      Tipo: Rinvio. Fonte: mail. Materia: Civile. Fascicolo: da attribuire.

      rossi/alfa 2a civ bari rinviata al 14/10 ore 9.30 aula 3 sempre bianchi. mettila in agenda e prepara il fascicolo x la prossima
    expect:
      answer: >
        Data 14/10 ore 9:30 (anno non indicato); Tribunale di Bari, Seconda sezione civile;
        numero di ruolo «non indicato»; parti Rossi c/ Alfa; rinvio; giudice Bianchi; data
        precedente «non indicato»; altre attività: preparare il fascicolo. Non inventa l'anno,
        non inventa il numero di ruolo.
      # «9.30» com'è scritto o «9:30» normalizzato valgono entrambi: il collaudo del 15/09 ha
      # bocciato una risposta giusta per i due punti.
      contains: ["14/10", "Rossi", "Alfa", "Bianchi", "non indicato", "fascicolo"]
      matches: ["9[.:]30"]
      # Testo semplice: nel campo di sola lettura del compito gli asterischi si vedono (15/09).
      notContains: ["4127", "**", "##"]
      noError: true
    tags: [agent, agenda]

  - key: agenda-dettato-piu-cose
    name: "Agenda: dettato con tre cose dentro — la principale e le altre, separate"
    kind: agent
    target: agenda
    message: |
      Tipo: Rinvio. Fonte: chat. Materia: Civile. Fascicolo: da attribuire.

      la gialli/gamma è stata rinviata al 12 marzo, prepara il fascicolo per la prossima e ricordami di chiamare il ctu giovedì
    expect:
      answer: >
        Voce principale: rinvio al 12 marzo (anno e ora non indicati), parti Gialli c/ Gamma.
        Altre attività menzionate, una per riga: preparare il fascicolo; chiamare il CTU giovedì
        («giovedì» resta così, non diventa una data).
      contains: ["12 marzo", "Gialli", "fascicolo", "CTU", "giovedì"]
      noError: true
    tags: [agent, agenda]


  - key: agenda-avviso-completo
    name: "Agenda: avviso completo, tutti gli estremi"
    kind: agent
    target: agenda
    message: |
      Tipo: Udienza. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      TRIBUNALE ORDINARIO DI BARI — Sezione Seconda Civile
      R.G. n. 4127/2025 — Rossi Mario c/ Alfa S.r.l.
      Si comunica che l'udienza di comparizione delle parti è fissata per il giorno
      14 ottobre 2026 alle ore 9:30, aula 3, dinanzi al Giudice dott.ssa Bianchi.
      La Cancelleria
    expect:
      answer: >
        Sei voci, tutte valorizzate: data e ora 14 ottobre 2026 ore 9:30; Tribunale di Bari,
        Sezione Seconda Civile; R.G. 4127/2025; parti Rossi Mario c/ Alfa S.r.l.; adempimento
        udienza (di comparizione); giudice dott.ssa Bianchi. Nessun termine proposto.
      contains: ["14 ottobre 2026", "9:30", "4127/2025", "Bianchi", "Rossi"]
      notContains: ["termine per", "scadenza"]
      wrongAnswers:
        - pattern: "(?i)(ho|è stat[oa]|sono stat[ie]) (registrat|creat|inserit|aggiunt)"
          means: >
            L'agente di estrazione ha scritto in calendario. Ha gli strumenti m365 (anche
            crea_evento) e la pipeline MCP aggiunge al messaggio «Use the available MCP tools…»,
            ma nessun passo del processo gli chiede di registrare: la registrazione è del referente.
          suspect: Manifest
      language: it
      noError: true
      maxSeconds: 60
    tags: [agent, agenda]

  - key: agenda-avviso-incompleto
    name: "Agenda: avviso incompleto, «non indicato» dove manca"
    kind: agent
    target: agenda
    message: |
      Tipo: Rinvio. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      Si comunica che l'udienza è rinviata al 3 novembre 2026. Tribunale di Bari.
    expect:
      answer: >
        Data 3 novembre 2026; ora, sezione, numero di ruolo, parti e giudice «non indicato»;
        adempimento «rinvio». Non stima un orario, non inventa un numero di ruolo.
      contains: ["3 novembre 2026", "non indicato", "rinvio"]
      noError: true
    tags: [agent, agenda, negative]

  - key: agenda-non-calcola-termini
    name: "Agenda: non calcola termini anche se glielo chiedono"
    kind: agent
    target: agenda
    message: |
      Tipo: Udienza. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      Udienza il 14 ottobre 2026 al Tribunale di Bari, Seconda Civile, R.G. 4127/2025.
      Mi dici anche entro quando va depositata la memoria ex art. 183 c.p.c.?
    expect:
      answer: >
        Riporta gli estremi e dichiara che non calcola termini processuali. Non propone una
        data di deposito.
      notContains: ["giorni prima", "entro il"]
      noError: true
    tags: [agent, agenda, negative]

  - key: agenda-due-procedimenti
    name: "Agenda: avviso ambiguo su due procedimenti"
    kind: agent
    target: agenda
    message: |
      Tipo: Udienza. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      Si comunicano le udienze del 14 ottobre 2026 ore 9:30 (R.G. 4127/2025, Rossi c/ Alfa)
      e del 21 ottobre 2026 ore 11:00 (R.G. 5310/2025, Verdi c/ Beta), Tribunale di Bari.
    expect:
      answer: >
        Non sceglie uno dei due: riporta entrambi, oppure segnala in fondo che il testo si
        riferisce a più procedimenti.
      contains: ["4127/2025", "5310/2025"]
      noError: true
    tags: [agent, agenda]

  # ── Le forme reali dello Studio (documentazione del cliente, 17/09/2026) ──────────────────

  - key: agenda-pct-civile-modulo
    name: "Agenda: il modulo del processo telematico civile, e «00:00» che non è un'ora"
    kind: agent
    target: agenda
    message: |
      Tipo: Rinvio. Fonte: cancelleria. Materia: Civile. Fascicolo: da attribuire.

      --
      Comunicazione di cancelleria
      Sezione: A5

      Tipo procedimento: Contenzioso Civile
      Numero di Ruolo generale: 87/2026
      Giudice: SAMMARTINO SILVIA
      Attore principale: ANTICO MULINO HOLDING IMMOBILIARE S.R.L.
      Conv. principale: CAT. CONSULTING CONSULENZA AMBIENTALE E TERRITORIO DI RAGONE MARCO

      Oggetto: RINVIO AD ALTRA UDIENZA DI DISCUSSIONE
      Descrizione: RINVIATO AD ALTRA UDIENZA DI DISCUSSIONE IL 14/01/2027 00:00 in presenza

      Note:

      Notificato alla PEC / in cancelleria il 17/09/2026 08:55
      Registrato da PIETRALONGO MICHELE
      --
    expect:
      answer: >
        Nuova data 14/01/2027; ORA «non indicato» — «00:00» nel modulo vuol dire che l'ora non è
        stata indicata, non mezzanotte; R.G. 87/2026; giudice Sammartino; parti Antico Mulino
        Holding Immobiliare c/ CAT. Consulting; adempimento rinvio ad altra udienza di
        discussione. Il 17/09/2026 è la data della notifica, non dell'udienza.
      contains: ["14/01/2027", "87/2026", "non indicato"]
      wrongAnswers:
        - pattern: "00:00"
          means: >
            Ha preso «00:00» per un'ora vera: in calendario l'udienza finirebbe a mezzanotte, e
            la riconciliazione vedrebbe una divergenza di nove ore con l'impegno giusto.
          suspect: Manifest
        - pattern: "(?i)data e ora[^\\n]*17/09/2026"
          means: "Ha preso la data della notifica per quella dell'udienza."
          suspect: Manifest
      language: it
      noError: true
    tags: [agent, agenda, pct]

  - key: agenda-notifica-penale-data-atto
    name: "Agenda: nella notifica penale la data è quella dell'ATTO, l'udienza sta nel PDF"
    kind: agent
    target: agenda
    message: |
      Tipo: Udienza. Fonte: cancelleria. Materia: Penale. Fascicolo: da attribuire.

      Oggetto: I: [GIP NOTI 2026/4821 BARI] - Notifica/Comunicazione atti penali

      In relazione al procedimento penale in oggetto si notifica/comunica nell'interesse di
      MASTRANGELO DARIO quanto segue in allegato

      Avviso fissazione udienza procedimento in camera di consiglio - 127 c. 1 c.p.p. - 03/09/2026

      GIP PRESSO IL TRIBUNALE ORDINARIO
    expect:
      answer: >
        Data e ora dell'udienza «non indicato»: il 03/09/2026 è la data dell'atto, e la data
        dell'udienza sta nel PDF allegato che l'agente non vede. Autorità: GIP presso il
        Tribunale ordinario di Bari. Numero di ruolo: quello dell'oggetto (GIP 4821/2026).
        Parti: Mastrangelo Dario. Adempimento: udienza in camera di consiglio ex art. 127 c.p.p.
      contains: ["non indicato", "4821", "Mastrangelo"]
      wrongAnswers:
        - pattern: "(?i)data e ora[^\\n]*03/09/2026"
          means: >
            Ha preso la data dell'atto per la data dell'udienza. È il caso più frequente del
            penale — gli avvisi arrivano inoltrati, con l'udienza solo nel PDF — e una data
            sbagliata qui va in calendario con la verifica del referente sopra.
          suspect: Manifest
      noError: true
    tags: [agent, agenda, penale, negative]

  - key: agenda-riga-da-segnare
    name: "Agenda: una riga dell'elenco «da segnare», con tre «non indicato»"
    kind: agent
    target: agenda
    message: |
      Tipo: Udienza. Fonte: mail. Materia: Penale. Fascicolo: da attribuire.

      Oggetto: da segnare
      Da: avv.neri@studiopolis.it

      5.11.2026 - Trib. De Rosa: Ingargiola
    expect:
      answer: >
        Data 5 novembre 2026; ora «non indicato»; autorità Tribunale (monocratico), giudice
        De Rosa; numero di ruolo «non indicato»; parti Ingargiola; adempimento udienza.
        Non inventa l'ora e non inventa il numero di ruolo.
      contains: ["non indicato", "Ingargiola"]
      matches: ["(?i)(5\\.11\\.2026|5 novembre 2026)"]
      wrongAnswers:
        - pattern: "(?i)(9|09)[:.]00"
          means: "Ha messo un'ora che nel testo non c'è."
          suspect: Manifest
        - pattern: "(?i)parti[^\\n]*De Rosa"
          means: >
            Ha preso il giudice per una parte. Nella forma dello Studio il nome dopo l'autorità
            è il giudice, e le parti vengono dopo i due punti.
          suspect: Manifest
      noError: true
    tags: [agent, agenda, penale]

  - key: agenda-firma-non-e-contenuto
    name: "Agenda: la firma dello Studio non è la comunicazione"
    kind: agent
    target: agenda
    message: |
      Tipo: Rinvio. Fonte: mail. Materia: Civile. Fascicolo: da attribuire.

      Oggetto: Re: Rinvii 17.9
      Da: avv.neri@studiopolis.it

      Corte Potenza: Nardò + a. (Corvino/Guzzo pp.cc.) al 19.11.2026 (ore 10.30) - come da
      calendario - per discussione delle parti civili.

      Neri Antonio
      avv.neri@studiopolis.it - www.studiopolis.it
      Bari 70100
      Via della Repubblica, 1
      Tel +39.080.0000000 - Fax +39.080.0000001
      Cod. Fisc. P. IVA 00000000000 | Registro imprese di Bari n. 00000000000
      -
      Please consider your environmental responsibility before printing this email.
      Il contenuto di questa e-mail è rivolto unicamente alle persone cui è indirizzato, e puo'
      contenere informazioni la cui riservatezza è tutelata.
    expect:
      answer: >
        Nuova data 19 novembre 2026 ore 10:30; autorità Corte d'appello di Potenza; parti Nardò
        e altri, con Corvino e Guzzo parti civili; adempimento discussione delle parti civili;
        numero di ruolo «non indicato». Della firma non prende niente: né l'indirizzo come sede,
        né la partita IVA come numero di ruolo.
      contains: ["Potenza"]
      matches: ["(?i)(19\\.11\\.2026|19 novembre 2026)", "10[:.]30"]
      notContains: ["Via della Repubblica", "00000000000", "environmental"]
      noError: true
    tags: [agent, agenda]

  # ════════════════════════════════════════════════════════════════════════════════════════
  # Riconciliazione agende — confronta due elenchi dati, senza strumenti
  # ════════════════════════════════════════════════════════════════════════════════════════

  - key: riconciliatore-quattro-sezioni
    name: "Riconciliazione: le quattro sezioni, «nessuno» dove è vuota"
    kind: agent
    target: riconciliatore
    message: |
      Avvisi arrivati in casella:
