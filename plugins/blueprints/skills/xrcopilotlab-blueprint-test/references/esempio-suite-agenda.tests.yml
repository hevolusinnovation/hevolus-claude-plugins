# Suite di collaudo del blueprint di prova «test-agenda» (tag TEST).
#
# È l'esempio minimo e completo del formato: un caso positivo e uno negativo sull'agente, un
# caso sul processo. Si esegue su un tenant dove il blueprint è stato applicato:
#
#   xrcopilotlab-bp test validate blueprints/tests/test-agenda.tests.yml
#   xrcopilotlab-bp test run      blueprints/tests/test-agenda.tests.yml --tag TEST --env staging
#
# Il formato è documentato in docs/blueprints/testing.md.

blueprint: test-agenda
tag: TEST
version: 1
description: Collaudo del blueprint di prova

defaults:
  language: it
  timeoutSeconds: 180

cases:
  # ── Agente «Agenda»: legge un avviso e ne propone gli estremi, senza inventare né calcolare.

  - key: agenda-estremi
    name: "Agenda: estrae gli estremi di un avviso completo"
    kind: agent
    target: agenda
    message: |
      TRIBUNALE ORDINARIO DI BARI — Sezione Seconda Civile
      R.G. n. 4127/2025 — Rossi Mario c/ Alfa S.r.l.
      Si comunica che l'udienza è fissata per il giorno 14 ottobre 2026 alle ore 9:30,
      aula 3, dinanzi al Giudice dott.ssa Bianchi.
    expect:
      answer: >
        Riporta data e ora (14 ottobre 2026, 9:30), sede e sezione (Tribunale di Bari, Seconda
        Civile), numero di ruolo 4127/2025, le parti (Rossi Mario c/ Alfa S.r.l.), il tipo di
        adempimento (udienza) e il giudice. Non propone scadenze né termini.
      contains: ["14 ottobre 2026", "4127/2025", "Bari"]
      notContains: ["termine per", "scadenza"]
      language: it
      noError: true
      maxSeconds: 60
    tags: [agent]
    notes: "Il caso base: tutti i dati ci sono, l'agente deve solo trascriverli."

  - key: agenda-dato-mancante
    name: "Agenda: non completa un dato che manca"
    kind: agent
    target: agenda
    message: |
      Si comunica il rinvio dell'udienza al 3 novembre 2026. Tribunale di Bari.
    expect:
      answer: >
        Riporta la data (3 novembre 2026) e la sede, e per ora, sezione, numero di ruolo e parti
        scrive «non indicato». Non stima un orario e non inventa un numero di ruolo.
      contains: ["non indicato", "3 novembre 2026"]
      matches: ["(?i)non indicato"]
      noError: true
    tags: [agent, negative]
    notes: >
      La regola «non dedurlo, non inventarlo» è quella che rende l'agente affidabile: si verifica
      con un avviso volutamente incompleto.

  - key: agenda-fuori-perimetro
    name: "Agenda: rifiuta di calcolare i termini"
    kind: agent
    target: agenda
    message: |
      Udienza il 14 ottobre 2026 al Tribunale di Bari, R.G. 4127/2025. Quando scade il termine
      per depositare la memoria ex art. 183 c.p.c.?
    expect:
      answer: >
        Riporta gli estremi dell'udienza e dice che non calcola termini processuali. Non propone
        una data di scadenza.
      notContains: ["giorni prima", "entro il"]
      noError: true
    tags: [agent, negative]

  # ── Processo «Presa in carico avviso di udienza»: avvio, estrazione automatica, compito al referente.

  - key: presa-in-carico-avvio
    name: "Processo: dall'avvio al compito del referente"
    kind: process
    target: presa-in-carico
    timeoutSeconds: 300
    caseData:
      testoAvviso: |
        TRIBUNALE ORDINARIO DI BARI — Sezione Seconda Civile
        R.G. n. 4127/2025 — Rossi Mario c/ Alfa S.r.l.
        Udienza fissata per il 14 ottobre 2026 alle ore 9:30, aula 3.
      mittente: cancelleria.civile.bari@giustiziacert.it
    expect:
      process:
        events: [InstanceStarted, ActivityCompleted, WorkItemCreated]
        completed: [estrai]
        waitingAt: conferma
        status: Running
        caseData:
          proposta: "14 ottobre 2026"
    tags: [process]
    notes: >
      L'attività automatica «estrai» deve chiudersi da sola e lasciare un compito aperto su
      «conferma», con la proposta dell'agente nel case data.
