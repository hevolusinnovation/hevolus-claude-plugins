<style>
:root{

  --ai-bg:#ede9fe;    --ai-bd:#7c3aed;    --ai-fg:#4c1d95;
  --auto-bg:#dcfce7;  --auto-bd:#16a34a;  --auto-fg:#14532d;
  --gw-bg:#fef3c7;    --gw-bd:#b45309;    --gw-fg:#78350f;
  --call-bd:#374151;  --edge:#4b5563; --edge-hot:#c2410c;
  --font-display:'Newsreader',Georgia,serif; --font-body:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#8fbfdc; --accent-soft:#1f2f3a;
  --human-bg:#1e3a5f; --human-bd:#60a5fa; --human-fg:#dbeafe;
  --ai-bg:#35285e;    --ai-bd:#a78bfa;    --ai-fg:#ede9fe;
  --auto-bg:#173d27;  --auto-bd:#4ade80;  --auto-fg:#dcfce7;
  --gw-bg:#4a3510;    --gw-bd:#fbbf24;    --gw-fg:#fef3c7;
  --call-bd:#d1d5db;  --edge:#9ca3af; --edge-hot:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181c; --surface:#1b2026; --fg:#e6e8ea; --muted:#9aa5b0; --line:#323a43; --lane:#191e23; --lane-alt:#1e242a;
  --accent:#8fbfdc; --accent-soft:#1f2f3a;
  --human-bg:#1e3a5f; --human-bd:#60a5fa; --human-fg:#dbeafe;
  --ai-bg:#35285e;    --ai-bd:#a78bfa;    --ai-fg:#ede9fe;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;padding-inline:16px}
.page{max-width:1400px;margin:0 auto;padding-block:20px 56px}
h1{font-family:var(--font-display);font-size:28px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tab{font:500 13px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;text-align:left}
.tab small{display:block;color:var(--muted);font-weight:400;font-size:11px}

.tab:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:8px 0 10px}

.canvas{overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.panel{margin-top:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:12px 16px}
.panel h3{font-family:var(--font-display);font-size:18px;margin:0 0 6px}
.panel dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0}
.panel dt{color:var(--muted)} .panel dd{margin:0;min-width:0;overflow-wrap:anywhere}

.plain p+p{margin-top:8px} .plain{font-size:15px;max-width:78ch}
details.tech{margin-top:12px} details.tech>summary{cursor:pointer;color:var(--muted);font-weight:500;padding:6px 0}

.card{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:12px 16px}

.card dd ul{margin:0;padding-left:16px}
.bar{display:flex;gap:6px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 10px}
.bar .legend{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}

.seg button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.q b.d{width:28px;height:28px;border-radius:50%;background:#f59e0b;color:#1c2127;font-size:11px;text-align:center;line-height:28px}
.q p{margin:0 0 4px}
textarea.nota{width:100%;min-height:58px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;resize:vertical}

textarea.nota:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel h3.sp{margin-top:14px}

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" integrity="sha384-4xaIisuLEy2lo2HkB2C4rEf7v8jbTb2kuogX6TkuEt9feTWKBSFSOzsqNNbV+sKh" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous"></script>
<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var view=document.getElementById('view');
var doc;
try{doc=jsyaml.load(document.getElementById('manifest').textContent)||{};}catch(e){view.innerHTML='<div class="err">Il manifest incorporato non si legge: '+esc(e.message)+'</div>';return;}

/* ───────── dati di contorno ───────── */
var agentName={},agentMcp={}; (doc.agents||[]).forEach(function(a){agentName[a.key]=a.name||a.key;agentMcp[a.key]=a.mcp||[];});
var orchName={};(doc.orchestrators||[]).forEach(function(o){orchName[o.key]=o.name||o.key;});
var procByKey={}; (doc.processes||[]).forEach(function(p){procByKey[p.key]=p;});
var taskByName={}; (doc.agentTasks||[]).forEach(function(t){taskByName[t.name]=t;});
var roleByKey={}; (doc.businessRoles||[]).forEach(function(r){roleByKey[r.key]=r.name||r.key;});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function el(name,attrs,parent){var n=document.createElementNS(NS,name);for(var k in (attrs||{}))n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
function wrap(text,max,lines){
  var words=String(text||'').split(/\s+/),out=[],cur='';
  words.forEach(function(w){ if((cur+' '+w).trim().length>max&&cur){out.push(cur);cur=w;}else cur=(cur+' '+w).trim(); });
  if(cur)out.push(cur);
  if(out.length>lines){out=out.slice(0,lines);out[lines-1]=out[lines-1].replace(/.{0,2}$/,'…');}
  return out;
}
function condText(c){
  if(!c)return '';
  if(c===true||c==='true')return 'sì'; if(c===false||c==='false')return 'no';
  if(typeof c!=='object')return String(c);
  var ops={eq:'=',neq:'≠',gt:'>',lt:'<',gte:'≥',lte:'≤'};
  if(c.op==='exists')return c.var+' presente';
  return c.var+' '+(ops[c.op]||c.op)+' '+(typeof c.value==='string'&&c.value.length>18?c.value.slice(0,17)+'…':c.value);
}

/* ───────── modello: processo e orchestratore → nodi e archi ───────── */
function fromProcess(p){
  var s=p.spec||{}, nodes=[], edges=[];
  var starter=(p.starterRoles||[]).map(function(k){return roleByKey[k]||k;});
  (s.activities||[]).forEach(function(a){
    var n={id:a.id,name:a.name||a.id,raw:a};
    if(a.type==='Start'){n.shape='start';}
    else if(a.type==='End'){n.shape='end';}
    else if(a.type==='CallActivity'){n.shape='call';n.cls='call';n.lane='Sottoprocessi';}
    else{
      n.shape='task';
      if(a.performer==='Automated'){n.cls='auto';n.lane='Sistema (automatico)';n.icon='gear';}
      else{
        n.cls=a.performer==='AiAssisted'?'ai':'human'; n.icon=a.performer==='AiAssisted'?'ai':'user';
        n.lane=a.roleName||(a.assignmentExpression?'Persona scelta al momento':'Senza ruolo');
      }
    }
    nodes.push(n);
  });
  (s.gateways||[]).forEach(function(g){nodes.push({id:g.id,name:g.name||g.id,raw:g,shape:'gw',gtype:g.type});});
  (s.flows||[]).forEach(function(f){edges.push({from:f.from,to:f.to,label:f.label||condText(f.condition),cond:!!f.condition});});
  return {kind:'Processo',key:p.key,title:s.name||p.key,desc:s.description||'',nodes:nodes,edges:edges,starter:starter,
    meta:[['Criticità',s.criticality],['Dati sensibili',s.dataSensitivity],['Avvio',starter.join(', ')||null],['Webhook',p.webhook?'sì':null],['Pubblicato',p.publish===false?'no':'sì']]};
}
function fromOrchestrator(o){
  var nodes=[],edges=[],stepKeys={};
  (o.steps||[]).forEach(function(st){
    if(st.type==='start')return;
    var n={id:st.key,name:st.name||st.key,raw:st,lane:'Orchestrazione'};
    var t=st.type;
    if(t==='terminate'){n.shape='end';}
    else if(t==='condition'||t==='switch'){n.shape='gw';n.gtype='Exclusive';}
    else{
      n.shape='task'; n.cls=(t==='userQuestion'||t==='humanApproval')?'human':(t==='action'||t==='sendMessage')?'auto':'ai';
      n.icon=(t==='userQuestion'||t==='humanApproval')?'user':(t==='action'||t==='sendMessage')?'gear':'ai';
      if(t==='agent')n.sub='Agente · '+(agentName[st.agent]||st.agent);
      else if(t==='parallelGroup'){n.sub='In parallelo';n.members=(st.agents||[]).map(function(a){return agentName[a]||a;});}
      else if(t==='handoffGroup'){n.sub='In staffetta';n.members=(st.agents||[]).map(function(a){return agentName[a]||a;});}
      else if(t==='humanApproval')n.sub='Approvazione umana';
      else if(t==='userQuestion')n.sub='Domanda all’utente';
      else if(t==='action')n.sub='Azione · '+(st.provider||'');
      else if(t==='sendMessage')n.sub='Messaggio';
    }
    nodes.push(n); stepKeys[st.key]=1;
  });
  (o.flows||[]).forEach(function(f){
    if(!stepKeys[f.from]||!stepKeys[f.to])return;
    var lab=f.label!=null?String(f.label):'';
    if(!lab&&f.condition!=null)lab=condText(f.condition);
    edges.push({from:f.from,to:f.to,label:lab,cond:!!lab});
  });
  return {kind:'Orchestratore',key:o.key,title:o.name||o.key,desc:o.description||'',nodes:nodes,edges:edges,starter:[],meta:[]};
}

/* ───────── layout ───────── */
var LABEL_W=132, COL_W=186, PAD_TOP=14, PAD_BOT=22;
function sizeOf(n){
  if(n.shape==='task'){var lines=wrap(n.name,20,3).length;var mem=(n.members||[]).slice(0,4).length*13;return {w:148,h:n.sub?Math.max(62,48+lines*14+mem+8):Math.max(58,22+lines*14+8)};}
  if(n.shape==='call')return {w:148,h:58};
  if(n.shape==='gw')return {w:44,h:44};
  return {w:34,h:34};
}
function layout(g){
  var byId={},out={},inn={};
  g.nodes.forEach(function(n){byId[n.id]=n;out[n.id]=[];inn[n.id]=[];Object.assign(n,sizeOf(n));});
  g.edges=g.edges.filter(function(e){return byId[e.from]&&byId[e.to];});
  g.edges.forEach(function(e){out[e.from].push(e);inn[e.to].push(e);});
  /* ingresso: il nodo Start; altrimenti quello senza archi entranti */
  var roots=g.nodes.filter(function(n){return n.shape==='start';});
  if(!roots.length)roots=g.nodes.filter(function(n){return !inn[n.id].length;});
  if(!roots.length&&g.nodes.length)roots=[g.nodes[0]];
  /* archi di ritorno: quelli che chiudono un ciclo nella DFS */
  var state={},back=new Set();
  function dfs(id){state[id]=1;out[id].forEach(function(e){var s=state[e.to];if(s===1)back.add(e);else if(!s)dfs(e.to);});state[id]=2;}
  roots.forEach(function(r){if(!state[r.id])dfs(r.id);});
  g.nodes.forEach(function(n){if(!state[n.id])dfs(n.id);});
  /* rango = percorso più lungo dall'ingresso sugli archi in avanti */
  var rank={};g.nodes.forEach(function(n){rank[n.id]=0;});
  var indeg={};g.nodes.forEach(function(n){indeg[n.id]=0;});
  g.edges.forEach(function(e){if(!back.has(e))indeg[e.to]++;});
  var q=g.nodes.filter(function(n){return indeg[n.id]===0;}).map(function(n){return n.id;}),seen=0;
  while(q.length){var id=q.shift();seen++;out[id].forEach(function(e){if(back.has(e))return;rank[e.to]=Math.max(rank[e.to],rank[id]+1);if(--indeg[e.to]===0)q.push(e.to);});}
  g.nodes.forEach(function(n){n.rank=rank[n.id];});
  /* corsia: ruolo per i compiti, quella del predecessore per eventi e gateway */
  var order=g.nodes.slice().sort(function(a,b){return a.rank-b.rank;});
  order.forEach(function(n){
    if(n.lane)return;
    var pre=inn[n.id].filter(function(e){return !back.has(e)&&byId[e.from].lane;}).map(function(e){return byId[e.from];});
    if(pre.length){pre.sort(function(a,b){return b.rank-a.rank;});n.lane=pre[0].lane;}
  });
  g.nodes.forEach(function(n){
    if(n.lane)return;
    if(n.shape==='start'&&g.starter.length){n.lane=g.starter[0];return;}
    var suc=out[n.id].map(function(e){return byId[e.to];}).filter(function(m){return m.lane;});
    n.lane=suc.length?suc[0].lane:(g.starter[0]||'Processo');
  });
  var lanes=[];
  order.forEach(function(n){if(lanes.indexOf(n.lane)<0)lanes.push(n.lane);});
  g.nodes.forEach(function(n){if(lanes.indexOf(n.lane)<0)lanes.push(n.lane);});
  lanes.sort(function(a,b){var A=/^(Automatico|Sistema)/.test(a)?1:0,B=/^(Automatico|Sistema)/.test(b)?1:0;return A-B;});
  /* slot: dentro una corsia, i nodi dello stesso rango si impilano */
  var cell={};
  g.nodes.slice().sort(function(a,b){return a.rank-b.rank||g.nodes.indexOf(a)-g.nodes.indexOf(b);}).forEach(function(n){
    var k=n.lane+'|'+n.rank;cell[k]=cell[k]||[];n.slot=cell[k].length;cell[k].push(n);
  });
  var laneInfo={};
  lanes.forEach(function(l){
    var maxSlots=1,maxH=40;
    g.nodes.forEach(function(n){if(n.lane!==l)return;maxH=Math.max(maxH,n.h);var c=cell[l+'|'+n.rank];maxSlots=Math.max(maxSlots,c.length);});
    var slotH=maxH+22;
    laneInfo[l]={slotH:slotH,h:maxSlots*slotH+16};
  });
  var y=PAD_TOP;
  lanes.forEach(function(l){laneInfo[l].y=y;y+=laneInfo[l].h;});
  var maxRank=0;g.nodes.forEach(function(n){maxRank=Math.max(maxRank,n.rank);});
  g.nodes.forEach(function(n){
    var li=laneInfo[n.lane];
    n.cx=LABEL_W+COL_W/2+n.rank*COL_W; n.cy=li.y+8+n.slot*li.slotH+li.slotH/2-6;
  });
  g.order=g.nodes.slice().sort(function(a,b){return a.rank-b.rank||lanes.indexOf(a.lane)-lanes.indexOf(b.lane)||a.slot-b.slot||g.nodes.indexOf(a)-g.nodes.indexOf(b);});
  g.order.forEach(function(n,i){n.num=i+1;});
  g.lanes=lanes;g.laneInfo=laneInfo;g.back=back;g.byId=byId;g.cell=cell;
  g.W=Math.max(900,LABEL_W+(maxRank+1)*COL_W+16); g.laneBottom=y;
  var nb=0;g.edges.forEach(function(e){if(back.has(e))nb++;});
  g.H=y+PAD_BOT+nb*12+(nb?8:0);
  return g;
}

/* ───────── archi ───────── */
function route(g,e,k){
  var a=g.byId[e.from],b=g.byId[e.to],pts;
  var sx=a.cx+a.w/2,sy=a.cy,tx=b.cx-b.w/2,ty=b.cy;
  if(g.back.has(e)){
    var ch=g.laneBottom+12+k*12;
    return [[a.cx,a.cy+a.h/2],[a.cx,ch],[b.cx,ch],[b.cx,b.cy+b.h/2]];
  }
  if(a.shape==='gw'&&Math.abs(ty-a.cy)>4){ /* esce dal vertice alto o basso */
    var sy2=ty<a.cy?a.cy-a.h/2:a.cy+a.h/2;
    return [[a.cx,sy2],[a.cx,ty],[tx,ty]];
  }
  if(Math.abs(sy-ty)<1)return [[sx,sy],[tx,ty]];
  var gap=b.rank-a.rank;
  var mx=gap<=1?(sx+tx)/2:tx-20;
  if(gap>1){ /* se la riga di partenza è occupata fra i due rangi, sale prima */
    var blocked=false;
    for(var r=a.rank+1;r<b.rank;r++){var c=g.cell[a.lane+'|'+r];if(c&&c.some(function(n){return Math.abs(n.cy-sy)<30;}))blocked=true;}
    if(blocked)mx=sx+16;
  }
  mx+=(k%3)*6;
  return [[sx,sy],[mx,sy],[mx,ty],[tx,ty]];
}
function pathOf(pts){return pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');}

/* ───────── disegno ───────── */
function icon(parent,type,x,y){
  var g=el('g',{transform:'translate('+x+','+y+')'},parent);
  var o={'class':'ic','stroke-width':'1.4','stroke-linecap':'round'};
  if(type==='user'||type==='ai'){
    el('circle',Object.assign({cx:6,cy:4,r:2.6},o),g); el('path',Object.assign({d:'M1 12c0-3 2.4-4.6 5-4.6s5 1.6 5 4.6'},o),g);
    if(type==='ai')el('path',Object.assign({d:'M12.5 1.2v3M11 2.7h3'},o),g);
  }else{ /* ingranaggio */
    el('circle',Object.assign({cx:6,cy:6,r:2.4},o),g);
    for(var i=0;i<8;i++){var t=i*Math.PI/4;el('path',Object.assign({d:'M'+(6+3.6*Math.cos(t)).toFixed(1)+' '+(6+3.6*Math.sin(t)).toFixed(1)+'L'+(6+5.4*Math.cos(t)).toFixed(1)+' '+(6+5.4*Math.sin(t)).toFixed(1)},o),g);}
  }
}
function draw(g,host,onPick){
  var svg=el('svg',{width:g.W,height:g.H,viewBox:'0 0 '+g.W+' '+g.H,role:'img','aria-label':'Diagramma di '+g.title});
  var defs=el('defs',{},svg);
  ['edge','hot'].forEach(function(id){var m=el('marker',{id:'ah-'+id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);el('path',{d:'M0 0L10 5L0 10z',fill:id==='edge'?'var(--edge)':'var(--edge-hot)'},m);});
  /* corsie */
  g.lanes.forEach(function(l,i){
    var li=g.laneInfo[l];
    el('rect',{x:0,y:li.y,width:g.W,height:li.h,'class':'lane-bg'+(i%2?' alt':'')},svg);
    el('line',{x1:0,x2:g.W,y1:li.y,y2:li.y,'class':'lane-line'},svg);
    var lines=wrap(l,17,3),t=el('text',{x:10,y:li.y+li.h/2-(lines.length-1)*7,'class':'lane-name'},svg);
    lines.forEach(function(s,j){var ts=el('tspan',{x:10,dy:j?14:4},t);ts.textContent=s;});
  });
  el('line',{x1:LABEL_W,x2:LABEL_W,y1:PAD_TOP,y2:g.laneBottom,'class':'lane-line'},svg);
  el('line',{x1:0,x2:g.W,y1:g.laneBottom,y2:g.laneBottom,'class':'lane-line'},svg);
  /* archi (sotto ai nodi) */
  var edgeEls=[],pair={};
  g.edges.forEach(function(e,i){
    var key=e.from+'>'+e.to;pair[key]=(pair[key]||0)+1;
    var k=pair[key]-1, back=g.back.has(e);
    var pts=route(g,e,back?g.edges.slice(0,i).filter(function(x){return g.back.has(x);}).length:k);
    var p=el('path',{d:pathOf(pts),'class':'edge'+(back?' back':''),'marker-end':'url(#ah-edge)'},svg);
    edgeEls.push({e:e,p:p,pts:pts});
  });
  /* etichette degli archi */
  var labCount={};
  g.edges.forEach(function(e,i){
    var lab=e.label||(g.back.has(e)?'ritorno':'');
    if(!lab)return;
    var pts=edgeEls[i].pts,a=pts[0],b=pts[1];
    var lx=(a[0]+b[0])/2, ly=(a[1]+b[1])/2;
    if(Math.abs(a[0]-b[0])<2){ly=a[1]+(b[1]>a[1]?16:-16)+0;lx=a[0]+4;}
    if(g.byId[e.from].shape==='gw'&&Math.abs(a[0]-b[0])>2){lx=a[0]+Math.min(70,Math.abs(a[0]-b[0])/2+4);ly=a[1]-6;}
    var li=labCount[e.from]=(labCount[e.from]||0)+1; if(li>1&&g.byId[e.from].shape==='gw')ly+=(li-1)*13;
    var text=wrap(lab,22,2);
    var w=Math.max.apply(null,text.map(function(s){return s.length;}))*5.4+8;
    var tl=el('g',{},svg);
    el('rect',{x:lx-w/2,y:ly-8-(text.length-1)*5,width:w,height:text.length*11+4,rx:2,'class':'edge-label-bg'},tl);
    var t=el('text',{x:lx,y:ly+1-(text.length-1)*5,'class':'edge-label','text-anchor':'middle'},tl);
    text.forEach(function(s,j){var ts=el('tspan',{x:lx,dy:j?11:0},t);ts.textContent=s;});
  });
  /* nodi */
  var nodeEls={};
  g.nodes.forEach(function(n){
    var ng=el('g',{'class':'node '+(n.cls||(n.shape==='gw'?'gw':'ev'+(n.shape==='end'?' end':''))),tabindex:0,role:'button','aria-label':n.name,'data-id':n.id},svg);
    var tt=el('title',{},ng);tt.textContent=n.name;
    var x=n.cx,y=n.cy;
    if(n.shape==='start'||n.shape==='end'){
      el('circle',{cx:x,cy:y,r:n.w/2-(n.shape==='end'?2:0),'class':'shape'},ng);
      var lt=el('text',{x:x,y:y+n.h/2+13,'class':'evt'},ng);
      var s=wrap(n.name,18,2);s.forEach(function(w,j){var ts=el('tspan',{x:x,dy:j?12:0},lt);ts.textContent=w;});
    }else if(n.shape==='gw'){
      el('path',{d:'M'+x+' '+(y-n.h/2)+'L'+(x+n.w/2)+' '+y+'L'+x+' '+(y+n.h/2)+'L'+(x-n.w/2)+' '+y+'Z','class':'shape'},ng);
      if(n.gtype==='Parallel'){el('path',{d:'M'+(x-9)+' '+y+'H'+(x+9)+'M'+x+' '+(y-9)+'V'+(y+9),'class':'mark'},ng);}
      else{el('path',{d:'M'+(x-7)+' '+(y-7)+'L'+(x+7)+' '+(y+7)+'M'+(x+7)+' '+(y-7)+'L'+(x-7)+' '+(y+7),'class':'mark'},ng);}
      var gt=el('text',{x:x,y:y-n.h/2-5,'class':'evt'},ng);gt.textContent=wrap(n.name,26,1)[0];
    }else{
      el('rect',{x:x-n.w/2,y:y-n.h/2,width:n.w,height:n.h,rx:8,'class':'shape'},ng);
      if(n.icon)icon(ng,n.icon,x-n.w/2+7,y-n.h/2+6);
      if(n.shape==='call'||n.collapsed)el('path',{d:'M'+(x-4)+' '+(y+n.h/2-9)+'h8M'+x+' '+(y+n.h/2-13)+'v8',stroke:'var(--call-bd)','stroke-width':1.6,fill:'none'},ng);
      var lines=wrap(n.name,20,3),ty=n.sub?y-n.h/2+46:y-n.h/2+(n.icon?30:20)-6;
      if(n.sub){var st=el('text',{x:x,y:y-n.h/2+32,'class':'cap'},ng);st.textContent=wrap(n.sub,30,1)[0];}
      var tx=el('text',{x:x,y:ty,'class':'t'},ng);
      lines.forEach(function(s,j){var ts=el('tspan',{x:x,dy:j?14:0},tx);ts.textContent=s;});
      (n.members||[]).slice(0,4).forEach(function(m,j){var mt=el('text',{x:x,y:ty+lines.length*14+j*13-2,'class':'cap'},ng);mt.textContent='· '+wrap(m,24,1)[0];});
    }
    var bx=x+n.w/2-(n.shape==='start'||n.shape==='end'?2:0), by=y-n.h/2+(n.shape==='gw'?n.h/2-2:0);
    el('circle',{cx:bx,cy:by,r:8,'class':'numb'},ng);
    var nt=el('text',{x:bx,y:by+3.2,'class':'numt'},ng);nt.textContent=n.num;
    if(n.q&&n.q.length){ /* punto da discutere: pallino ambra in alto a sinistra, D1, D2… come nell'elenco sotto il disegno */
      var qx=x-n.w/2+(n.shape==='start'||n.shape==='end'||n.shape==='gw'?4:0), qy=y-n.h/2+(n.shape==='gw'?4:0);
      el('circle',{cx:qx,cy:qy,r:10,'class':'qb'},ng);
      var qt=el('text',{x:qx,y:qy+3,'class':'qt'},ng);qt.textContent='D'+n.q[0]+(n.q.length>1?'+':'');
    }
    function pick(){onPick(n);}
    ng.addEventListener('click',pick);
    ng.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();}});
    nodeEls[n.id]=ng;
  });
  host.innerHTML='';host.appendChild(svg);
  return {svg:svg,nodeEls:nodeEls,edgeEls:edgeEls};
}

/* ───────── pannello di dettaglio ───────── */
function row(k,v){return v==null||v===''||(Array.isArray(v)&&!v.length)?'':'<dt>'+esc(k)+'</dt><dd>'+v+'</dd>';}
function detail(g,n){
  if(g.kind==='Panoramica'){

    else hh2+='<dl>'+row('Quando',esc(n.sub))+'</dl>';

  }

    h+=row('Processo chiamato',esc(r.calledProcessName));
    h+=row('Variabile prodotta',r.outputVariable?'<code>'+esc(r.outputVariable)+'</code>':'');
    h+=row('Tempo atteso',r.expectedDurationMinutes?esc(r.expectedDurationMinutes)+' min':'');
    h+=row('Tempo massimo',r.maxLeadTimeMinutes?esc(r.maxLeadTimeMinutes)+' min':'');
    h+=row('Chat con l’agente',r.interactive?'sì':'');
    if(r.form&&r.form.length)h+=row('Modulo','<ul>'+r.form.map(function(f){return '<li>'+esc(f.label||f.key)+' <span style="color:var(--muted)">('+esc(f.type)+(f.required?', obbligatorio':'')+(f.context?', sola lettura':'')+')</span></li>';}).join('')+'</ul>');
  }else{
    h+=row('Tipo',esc(r.type));
    h+=row('Agente',esc(agentName[r.agent]||r.agent));
    h+=row('Agenti',(n.members||[]).map(esc).join(', '));
    h+=row('Produce',r.outputMapping?Object.keys(r.outputMapping).map(function(k){return '<code>'+esc(k)+'</code>';}).join(', '):(r.agentOutputs?Object.keys(r.agentOutputs).map(function(k){return '<code>'+esc(r.agentOutputs[k])+'</code>';}).join(', '):''));
    h+=row('Legge',r.inputMapping?Object.keys(r.inputMapping).map(function(k){return '<code>'+esc(k)+'</code>';}).join(', '):'');

  var outs=g.edges.filter(function(e){return e.from===n.id;});
  if(outs.length>1||outs.some(function(e){return e.label;}))h+=row('Uscite','<ul>'+outs.map(function(e){return '<li>'+esc(e.label||'predefinita')+' → '+esc((g.byId[e.to]||{}).name)+'</li>';}).join('')+'</ul>');
  return h+'</dl>';
}

/* ───────── spiegazione semplice ───────── */
var spieg={};
try{var sp=jsyaml.load(document.getElementById('spiegazioni').textContent);if(sp&&typeof sp==='object'&&sp.flussi)spieg=sp.flussi;}catch(e){}
var spiegAll={};try{var sp0=jsyaml.load(document.getElementById('spiegazioni').textContent);if(sp0&&typeof sp0==='object')spiegAll=sp0;}catch(e){}
function flat(s){return String(s||'').replace(/\s+/g,' ').trim();}
function entryOf(g){var s=spieg[g.title]||spieg[g.key];return !s?{}:(typeof s==='string'?{sintesi:s}:s);}
function paras(t){return String(t||'').split(/\n\s*\n/).map(flat).filter(Boolean);}
function storiaParas(g){var e=entryOf(g);return g.kind==='Panoramica'?paras(spiegAll.panoramica):paras(e.in_breve||e.storia||e.sintesi);}
function sintesiOf(g){return storiaParas(g).join(' ');}
function who(n){
  var r=n.raw||{};
  if(n.shape!=='task')return '';
  if(r.performer==='Automated'){var t=taskByName[r.agentTaskName];var a=t&&t.agent?(agentName[t.agent]||t.agent):'';return 'lo fa il sistema da solo'+(a?' (agente «'+a+'»)':'');}
  if(r.performer==='AiAssisted')return 'un agente prepara e '+(r.roleName?'«'+r.roleName+'»':'una persona')+' controlla';
  if(r.performer==='HumanOnly')return r.roleName?'lo fa «'+r.roleName+'»':'lo fa la persona scelta al momento';
  var s=r.type;
  if(s==='agent')return 'lavora l’agente «'+(agentName[r.agent]||r.agent)+'»';
  if(s==='parallelGroup')return 'lavorano insieme gli agenti '+(n.members||[]).map(function(m){return '«'+m+'»';}).join(', ');
  if(s==='handoffGroup')return 'gli agenti si passano il turno: '+(n.members||[]).join(', ');
  if(s==='userQuestion')return 'si chiede una risposta all’utente';
  if(s==='humanApproval')return 'una persona deve approvare o rifiutare';
  if(s==='action')return 'il sistema esegue un’azione ('+(r.provider||'')+')';
  if(s==='sendMessage')return 'si mostra un messaggio';
  return '';
}
function authoredSteps(g){
  var e=entryOf(g);if(!e.passi||g.kind==='Panoramica')return null;
  function txt(n){return (n.ids||[n.id]).map(function(i){return e.passi[i]?flat(e.passi[i]):'';}).filter(Boolean).join(' ');}
  return g.order.filter(function(n){return txt(n);}).map(function(n){return {num:n.num,text:txt(n)};});
}

/* ───────── vista sintetica: i passi automatici in fila diventano un passo solo (sottoprocesso compresso, come in BPMN) ───────── */
var mode='sintetica';
function collapse(g){
  var out={},inn={},byId={};
  g.nodes.forEach(function(n){out[n.id]=[];inn[n.id]=[];byId[n.id]=n;});
  g.edges.forEach(function(e){if(out[e.from]&&inn[e.to]){out[e.from].push(e);inn[e.to].push(e);}});
  function ok(n){return n.shape==='task'&&n.cls==='auto'&&inn[n.id].length===1&&out[n.id].length===1;}
  var head={},skip={},inside={};
  g.nodes.forEach(function(n){
    if(!ok(n)||ok(byId[inn[n.id][0].from]))return; /* solo la testa di una fila */
    var ch=[n],cur=n;
    for(;;){var nx=byId[out[cur.id][0].to];if(!ok(nx)||ch.indexOf(nx)>=0)break;ch.push(nx);cur=nx;}
    if(ch.length<2)return;
    head[n.id]=ch;ch.forEach(function(c,i){inside[c.id]=1;if(i)skip[c.id]=1;});
  });
  var nodes=[];
  g.nodes.forEach(function(n){
    if(skip[n.id])return;
    var c=Object.assign({},n);
    if(c.shape==='start'||c.shape==='end'||c.shape==='gw')delete c.lane;
    if(head[n.id]){var ch=head[n.id];
      Object.assign(c,{name:'Il sistema lavora da solo',sub:ch.length+' passi in uno',members:ch.map(function(x){return x.name;}),memberNames:ch.map(function(x){return x.name;}),ids:ch.map(function(x){return x.id;}),collapsed:true,raw:{performer:'Automated'}});}
    nodes.push(c);
  });
  var edges=[];
  g.edges.forEach(function(e){
    if(inside[e.from]&&inside[e.to]&&skip[e.to])return; /* freccia interna alla fila */
    var f=e.from,t=e.to;
    Object.keys(head).forEach(function(h){var ch=head[h];if(ch[ch.length-1].id===f)f=h;});
    edges.push(Object.assign({},e,{from:f,to:t}));
  });
  return Object.assign({},g,{nodes:nodes,edges:edges});
}
function viewOf(gf){return mode==='sintetica'&&gf.kind==='Processo'?layout(collapse(gf)):gf;}

/* punti da discutere: D1, D2… con (facoltativo) il passo a cui si riferiscono */
function questionsOf(g){
  var e=entryOf(g),list=Array.isArray(e.discutere)?e.discutere:[];
  return list.map(function(q,i){
    if(typeof q==='string')q={domanda:q};
    var id=q.passo,hit=null;
    if(id)g.nodes.forEach(function(n){if((n.ids||[n.id]).indexOf(id)>=0)hit=n;});
    return {n:i+1,text:flat(q.domanda||q.testo||''),passo:id||null,node:hit,stepNum:hit?hit.num:null};
  }).filter(function(q){return q.text;});
}
function markQuestions(g){
  g.nodes.forEach(function(n){delete n.q;});
  questionsOf(g).forEach(function(q){if(q.node)(q.node.q=q.node.q||[]).push(q.n);});
}

/* note di chi conduce la sessione: restano in memoria e, se il browser lo permette, nel browser */
var notes={};
function nkey(g,k){return 'bpmflow|'+(doc.tag||doc.blueprint||'')+'|'+g.key+'|'+k;}
function getNote(g,k){var kk=nkey(g,k);if(notes[kk]!=null)return notes[kk];try{return localStorage.getItem(kk)||'';}catch(e){return '';}}
function setNote(g,k,v){var kk=nkey(g,k);notes[kk]=v;try{if(v)localStorage.setItem(kk,v);else localStorage.removeItem(kk);}catch(e){}}

/* la scheda del processo: le righe che servono a ragionarne con il cliente */
function schedaRows(gf){
  var e=entryOf(gf),rows=[];
  function add(k,v){v=(v||[]).filter(Boolean);if(v.length)rows.push({k:k,v:v});}
  if(gf.kind!=='Processo')return rows;
  var tasks=gf.nodes.filter(function(n){return n.shape==='task';});
  add('Come parte',startLines(gf.key));
  add('Che cosa arriva',e.ingresso?[flat(e.ingresso)]:[]);
  add('Che cosa si ottiene',e.risultato?[flat(e.risultato)]:[]);
  var roles=[];tasks.forEach(function(n){if((n.cls==='human'||n.cls==='ai')&&roles.indexOf(n.lane)<0)roles.push(n.lane);});
  add('Chi partecipa',roles.map(function(r){return r==='Persona scelta al momento'?'una persona scelta al momento':r;}));
  var ctl=Array.isArray(e.controlli)?e.controlli.map(flat):tasks.filter(function(n){return n.cls==='human'||n.cls==='ai';}).map(function(n){
    var who=n.lane==='Persona scelta al momento'?'una persona scelta al momento':n.lane;
    return '«'+n.name+'» - '+who+(n.cls==='ai'?' (controlla il lavoro dell’assistente)':'');});
  add('Dove decide una persona',ctl.length>8?ctl.slice(0,8).concat(['e altri '+(ctl.length-8)]):ctl);
  var aut=tasks.filter(function(n){return n.cls==='auto';}).map(function(n){return n.name;});
  add('Che cosa fa il sistema da solo',aut.length>6?aut.slice(0,6).concat(['e altri '+(aut.length-6)]):aut);
  var t=timing(gf);
  add('Quanto dura',[t.work?'Lavoro stimato: circa '+fmtMin(t.work)+', senza contare le attese fra un passo e l’altro.':'Tempi non dichiarati.']);
  return rows;

function plain(g){

var DAYS=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],DAYS3=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
function expand(fs,min,max){
  var set=[];
  String(fs).split(',').forEach(function(p){
    var step=1,m=p.match(/^(.*)\/(\d+)$/); if(m){p=m[1];step=+m[2];}
    var a=min,b=max; if(p!=='*'&&p!==''){var r=p.split('-');a=+r[0];b=r.length>1?+r[1]:(m?max:a);}
    for(var i=a;i<=b;i+=step)set.push(i);

  return set.filter(function(v,i){return set.indexOf(v)===i;}).sort(function(a,b){return a-b;});
}
function hh(n){return (n<10?'0':'')+n;}
function cronInfo(sch){
  var f=String(sch&&sch.cron||'').trim().split(/\s+/),tz=(sch&&sch.timeZone)||'';
  var tzt=tz==='Europe/Rome'?'ora di Roma':(tz||'');

  var mins=expand(f[0],0,59),hrs=expand(f[1],0,23);
  var dow=(f[4]==='*'?[0,1,2,3,4,5,6]:expand(f[4],0,7).map(function(d){return d%7;})).filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
  var perDay=mins.length*hrs.length,time,times=null,short;
  if(f[0]==='*'&&f[1]==='*'){time='ogni minuto';short='ogni minuto';}
  else if(/^\*\/\d+$/.test(f[0])&&f[1]==='*'){time='ogni '+f[0].slice(2)+' minuti';short=time;}
  else if(f[1]==='*'){time=mins.length===1?(mins[0]===0?'ogni ora, a ora piena':'ogni ora, al minuto '+mins[0]):'ogni ora, ai minuti '+mins.join(', ');short='ogni ora';}
  else if(perDay<=4){times=[];hrs.forEach(function(h){mins.forEach(function(m){times.push(hh(h)+':'+hh(m));});});time='alle '+times.join(', ');short=times.join(', ');}
  else{time='più volte al giorno ('+perDay+' volte)';short=perDay+' volte';}
  var dtxt;

function fmtMin(m){

/* durata sul percorso più lungo, senza cicli: expectedDurationMinutes e maxLeadTimeMinutes dei passi, o timeoutSeconds degli step */
function timing(g){

  function d2(n){var r=n.raw||{};return r.maxLeadTimeMinutes||(r.timeoutSeconds?r.timeoutSeconds/60:0);}

    best[n.id]=d1(n)+Math.max.apply(null,[0].concat(pre.map(function(e){return best[e.from];})));

    y+=put(m.kind==='Panoramica'?'Panoramica':(m.kind==='Processo'?'Scheda del processo':m.kind),M,y,PW-2*M,9.5,'normal',MUT)+3;
    if(m.scopo)y+=put(m.scopo,M,y,PW-2*M,13,'italic',ACC)+4;
    var LW=m.rows.length?148:PW-2*M,RX=M+LW+10,RW=PW-M-RX,yl=y,yr=y;
    if(m.brevi.length){yl+=put('In breve',M,yl,LW,11.5,'bold',ACC)+1.5;m.brevi.forEach(function(p){yl+=put(p,M,yl,LW,11)+2.5;});yl+=2;}
    if(m.quando){yl+=put('Quando si usa',M,yl,LW,11.5,'bold',ACC)+1.5;yl+=put(m.quando,M,yl,LW,11)+2.5;}
    function rowsH(sz,dry){var yy=yr;m.rows.forEach(function(r){
      yy+=put(r.k,RX,yy,RW,sz,'bold',ACC,dry)+0.6;
      r.v.forEach(function(v){yy+=put((r.v.length>1?'- ':'')+v,RX,yy,RW,sz,'normal',INK,dry)+0.6;});yy+=2;});return yy;}
    var rsz=10;while(rsz>7.5&&rowsH(rsz,true)>BOT)rsz-=0.5; /* la colonna di destra si stringe finché sta nella pagina */
    yr=rowsH(rsz,false);
    if(m.rows.length){pdf.setDrawColor(200,204,208);pdf.setLineWidth(0.3);pdf.line(RX-5,y,RX-5,Math.max(y+10,yr-2));}
    y=Math.max(yl,yr);
    /* pagina 2: il diagramma, intero, ad alta risoluzione */
    newPage();
    y+=1;y+=put(m.title+' - il diagramma',M,y,PW-2*M,14,'bold')+3;
    legend(M,y);y+=8;
    var host=document.createElement('div'),d=draw(m.g,host,function(){});
    var sc=Math.min(3,9000/m.g.W),cv=await toCanvas(d.svg,m.g.W,m.g.H,sc);
    var maxH=BOT-y,w=PW-2*M,h=w*m.g.H/m.g.W;if(h>maxH){h=maxH;w=h*m.g.W/m.g.H;}
    pdf.addImage(cv.toDataURL('image/jpeg',0.93),'JPEG',M,y,w,h,undefined,'FAST');
    /* pagina 3: passo per passo, punti da discutere, note */
    newPage();
    y+=1;y+=put(m.title+' - passo per passo e punti da decidere',M,y,PW-2*M,14,'bold')+4;
    if(m.steps.length){
      var cw=(PW-2*M-10)/2,hs=m.steps.map(function(s){pdf.setFontSize(10);return pdf.splitTextToSize(ascii(s.num+'. '+s.text),cw).length*10*0.43+1.5;}),tot=hs.reduce(function(a,b){return a+b;},0),acc=0,col=0,yy=y,y0=y;
      m.steps.forEach(function(s,i){
        if(col===0&&acc>=tot/2){col=1;yy=y0;}
        put(s.num+'. '+s.text,M+col*(cw+10),yy,cw,10);yy+=hs[i];acc+=hs[i];
      });
      y=y0+Math.max(tot/2+4,0)+2;
      y=Math.max(y,yy)+2;
    }
    if(m.qs.length){
      need(14);y+=put('Da decidere insieme',M,y,PW-2*M,12,'bold',ACC)+2;
      m.qs.forEach(function(q){
        need(26);
        pdf.setFillColor(245,158,11);pdf.circle(M+3.5,y+3,3.2,'F');pdf.setFont('helvetica','bold');pdf.setFontSize(7);pdf.setTextColor(28,33,39);pdf.text('D'+q.n,M+3.5,y+3.8,{align:'center'});
        var hq=put(q.text+(q.stepNum?'  (passo '+q.stepNum+')':''),M+10,y,PW-2*M-10,10.5,'bold');y+=Math.max(hq,6)+1;
        if(q.note){var hn=put(q.note,M+10,y,PW-2*M-10,10.5,'normal',ACC);y+=hn+1;}
        ruled(q.note?1:2);y+=1;
      });
    }
    need(30);y+=put('Note della sessione',M,y,PW-2*M,12,'bold',ACC)+2;
    if(m.gen){y+=put(m.gen,M,y,PW-2*M,10.5,'normal',ACC)+1;}
    ruled(Math.max(2,Math.min(8,Math.floor((BOT-y)/8))));
  }
  var N=pdf.getNumberOfPages();
  for(var p=1;p<=N;p++){pdf.setPage(p);pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(110,118,126);pdf.text('Pagina '+p+' di '+N,PW-M,PH-6,{align:'right'});}
  return pdf;
}
async function buildDocx(list){
  var D=window.docx;if(!D)throw new Error('la libreria Word non è stata caricata');
  var P=D.Paragraph,R=D.TextRun,kids=[],head=document.title+(doc.version?' - versione '+doc.version:'');
  function para(t,o){o=o||{};return new P({heading:o.h,spacing:{before:o.before||0,after:o.after==null?100:o.after},bullet:o.bullet?{level:0}:undefined,pageBreakBefore:o.pb,keepNext:o.keep,children:[new R({text:String(t||''),bold:o.bold,italics:o.it,color:o.color,size:o.size})]});}
  function cell(children,o){o=o||{};return new D.TableCell({children:children,width:{size:o.w||50,type:D.WidthType.PERCENTAGE},shading:o.fill?{type:D.ShadingType.CLEAR,fill:o.fill,color:'auto'}:undefined,margins:{top:70,bottom:70,left:110,right:110}});}
  function noteBox(label,text){
    var body=text?String(text).split(/\n/).map(function(l){return para(l,{after:40});}):[para('',{after:40}),para('',{after:40}),para('',{after:40})];
    return new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:[new D.TableRow({children:[cell([para(label,{bold:true,color:'1F4E6B',after:40,size:18})].concat(body),{w:100})]})]});
  }
  for(var k=0;k<list.length;k++){
    var m=modelOf(list[k]);
    kids.push(para(m.title,{h:D.HeadingLevel.HEADING_1,pb:k>0,after:60}));
    kids.push(para(m.kind==='Panoramica'?'Panoramica':(m.kind==='Processo'?'Scheda del processo':m.kind),{color:'59636E',after:120}));
    if(m.scopo)kids.push(para(m.scopo,{it:true,color:'1F4E6B',size:26,after:160}));
    if(m.brevi.length){kids.push(para('In breve',{h:D.HeadingLevel.HEADING_2,keep:true}));m.brevi.forEach(function(p){kids.push(para(p));});}
    if(m.quando){kids.push(para('Quando si usa',{h:D.HeadingLevel.HEADING_2,keep:true}));kids.push(para(m.quando));}
    if(m.rows.length){
      kids.push(para('La scheda',{h:D.HeadingLevel.HEADING_2,keep:true,before:120}));
      kids.push(new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:m.rows.map(function(r){
        return new D.TableRow({cantSplit:true,children:[cell([para(r.k,{bold:true,after:0})],{w:26,fill:'E3EDF3'}),cell(r.v.map(function(v){return para(v,{bullet:r.v.length>1,after:30});}),{w:74})]});})}));
    }
    kids.push(para('Il diagramma',{h:D.HeadingLevel.HEADING_2,pb:true,after:60}));
    kids.push(para('Blu: persona · Viola: persona + assistente · Verde: automatico · Rombo: bivio · Pallino D1: punto da discutere',{color:'59636E',size:18,after:80}));
    var host=document.createElement('div'),d=draw(m.g,host,function(){});
    var cv=await toCanvas(d.svg,m.g.W,m.g.H,Math.min(2,6000/m.g.W));
    var blob=await new Promise(function(r){cv.toBlob(r,'image/png');}),buf=new Uint8Array(await blob.arrayBuffer());
    var w=900,h=w*m.g.H/m.g.W;if(h>500){h=500;w=h*m.g.W/m.g.H;}
    kids.push(new P({children:[new D.ImageRun({data:buf,type:'png',transformation:{width:Math.round(w),height:Math.round(h)}})]}));
    if(m.steps.length){
      kids.push(para('Passo per passo',{h:D.HeadingLevel.HEADING_2,before:200,keep:true}));
      m.steps.forEach(function(s){kids.push(para(s.num+'. '+s.text,{after:60}));});
    }
    if(m.qs.length){
      kids.push(para('Da decidere insieme',{h:D.HeadingLevel.HEADING_2,before:200,keep:true}));
      m.qs.forEach(function(q){
        kids.push(para('D'+q.n+'  '+q.text+(q.stepNum?'  (passo '+q.stepNum+')':''),{bold:true,keep:true,after:60}));
        kids.push(noteBox('Risposta o nota',q.note));kids.push(para('',{after:80}));
      });
    }
    kids.push(para('Note della sessione',{h:D.HeadingLevel.HEADING_2,before:200,keep:true}));
    kids.push(noteBox('Note',m.gen));
  }
  var docx=new D.Document({
    creator:'XRCopilotLab',title:document.title,
    styles:{default:{document:{run:{font:'Calibri',size:22}}}},
    sections:[{properties:{page:{size:{orientation:D.PageOrientation.LANDSCAPE},margin:{top:850,bottom:850,left:850,right:850}}},
      headers:{default:new D.Header({children:[new P({children:[new R({text:head,color:'6E767E',size:16})]})]})},children:kids}]
  });
  return D.Packer.toBlob(docx);
}
async function downloadsCap(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){return null;}}
async function doExport(all,fmt){
  var note=document.getElementById('pdfnote'),dl=await downloadsCap();
  if(!dl){note.textContent='L’esportazione è disponibile dalla pagina pubblicata, aperta in claude.ai.';return;}
  note.textContent='Preparo il '+(fmt==='docx'?'documento Word':'PDF')+'…';
  try{
    var lst=all?graphs:[graphs[current]];
    var data=fmt==='docx'?await buildDocx(lst):(await buildPdf(lst)).output('blob');
    var slug=slugOf(document.title||'flussi-bpm')+(all?'':'-'+slugOf(graphs[current].key||current));
    await dl.save({filename:slug+(fmt==='docx'?'.docx':'.pdf'),data:data});
    note.textContent=(fmt==='docx'?'Documento Word pronto: ':'PDF pronto: ')+'le note che hai scritto qui sono dentro.';
  }catch(e){note.textContent=e&&e.code==='declined'?'Download annullato.':'Non sono riuscito a creare il file: '+((e&&e.message)||e);}
}
