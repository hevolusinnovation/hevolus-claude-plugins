name: Controlli

# Gira su ogni push e su ogni pull request: se la separazione fra Claude Code e Claude Desktop
# non torna, o se una skill non passerebbe il caricamento su claude.ai, si vede qui invece che
# addosso a chi prova a installarla.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Superfici — ogni plugin dichiara dove gira, e il catalogo è d'accordo
        run: ./verifica-superfici.sh

      - name: Skill — frontmatter e forma dell'archivio
        run: ./build-skill-zip.sh --all

      - name: Pacchetto Desktop — si costruisce davvero
        run: ./build-desktop-plugin.sh

      - name: CLI — la versione dichiarata esiste, e per tutte le piattaforme
        # version.txt è il numero che gli avviatori compongono in «bp-v<numero>» per cercare
        # l'allegato: se nomina una release che non c'è, o che non porta il binario di una
        # piattaforma, il download muore per chi ci prova — e non c'era modo di accorgersene prima.
        #
        # Si guarda nel catalogo, dove la pipeline del prodotto rispecchia gli allegati: è lo stesso
        # posto da cui li prende chi usa il plugin, quindi il controllo verifica ciò che vede lui.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONE="$(cat plugins/blueprints/bin/version.txt)"
          TAG="bp-v$VERSIONE"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::la release $TAG non è ancora rispecchiata qui: chi non ha accesso al" \
                 "repository di prodotto non può scaricare la CLI. Si popola alla prossima release."
            exit 0
          fi

          # Gli allegati appena caricati compaiono con un ritardo di qualche decina di secondi, e la
          # via GraphQL (`gh release view`) li vede dopo la REST. Il 23/09/2026 questo controllo è
          # fallito dicendo che mancavano TUTTI e sei i binari, mentre erano stati appena
          # rispecchiati: il push che alza version.txt segue di pochi secondi la release. Si
          # riprova, e si chiede a entrambe le vie prima di dare qualcosa per mancante.
          ALLEGATI=""

          for TENTATIVO in 1 2 3 4; do
            ALLEGATI="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null)"

            if [ -z "$ALLEGATI" ]; then
              ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id 2>/dev/null)"
              [ -n "$ID" ] && ALLEGATI="$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[].name' 2>/dev/null)"
            fi

            [ -n "$ALLEGATI" ] && break

            echo "Allegati di $TAG non ancora visibili (tentativo $TENTATIVO): attendo."
            sleep 15
          done

          MANCANTI=""

          for RID in osx-arm64 osx-x64 linux-x64 linux-arm64; do
            echo "$ALLEGATI" | grep -qx "xrcopilotlab-bp-$RID" || MANCANTI="$MANCANTI $RID"
          done

          for RID in win-x64 win-arm64; do
            echo "$ALLEGATI" | grep -qx "xrcopilotlab-bp-$RID.exe" || MANCANTI="$MANCANTI $RID"
          done

          if [ -n "$MANCANTI" ]; then
            echo "::error::la release $TAG non porta il binario per:$MANCANTI — su quelle" \
                 "piattaforme il plugin non ha da dove prendere la CLI."
            exit 1
          fi

          echo "$TAG: allegati completi per tutte le piattaforme che gli avviatori possono chiedere."


      - name: Avviso di aggiornamento — bash e PowerShell dicono la stessa cosa
        # L'hook SessionStart del plugin chiama l'avviatore con --avviso-sessione. Si prova su una
        # copia del plugin con la versione abbassata di uno: deve uscire un JSON valido con la riga
        # per l'utente; con la versione vera, niente. Il gemello PowerShell si prova qui perché
        # nessuno lo esegue su un Mac, e un errore di sintassi arriverebbe dritto a chi usa Windows.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERA="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([0-9.]*\)".*/\1/p' plugins/blueprints/.claude-plugin/plugin.json | head -1)"
          ULTIMA="$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body | awk -F'|' '$2 ~ /^[[:space:]]*blueprints[[:space:]]*$/ { gsub(/[[:space:]]/, "", $4); print $4; exit }')"
          echo "plugin nel repository: $VERA · ultimo pubblicato: $ULTIMA"

          prova() {  # $1 = come si lancia, $2 = versione finta
            T="$(mktemp -d)"; cp -R plugins/blueprints "$T/plugin"
            sed -i "s/\"version\": \"$VERA\"/\"version\": \"$2\"/" "$T/plugin/.claude-plugin/plugin.json"
            case "$1" in
              bash) CLAUDE_PLUGIN_DATA="$T/dati" "$T/plugin/bin/xrcopilotlab-bp" --avviso-sessione ;;
              pwsh) CLAUDE_PLUGIN_DATA="$T/dati" pwsh -NoProfile -File "$T/plugin/bin/xrcopilotlab-bp.ps1" --avviso-sessione ;;
            esac
          }

          for SHELL_ in bash pwsh; do
            OUT="$(prova "$SHELL_" 0.0.1)"
            echo "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "systemMessage" in d and d["hookSpecificOutput"]["hookEventName"]=="SessionStart", d; print(d["systemMessage"])'
            OUT="$(prova "$SHELL_" "$ULTIMA")"
            [ -z "$OUT" ] || { echo "::error::$SHELL_: con il plugin aggiornato l'avviso non deve dire niente, ha detto: $OUT"; exit 1; }
            echo "$SHELL_: avviso corretto."
          done
